config-version: 1

position-markers: true

server-name: "Amazake"
time-zone: "Europe/Moscow"
time-format: "HH:mm"
date-format: "dd.MM.yyyy"
update-ticks: 20

pack:
  install: true
  dir: ""
  reload-nexo: true

tab:
  enabled: true
  header:
    - "<shadow:#5a0a26E6><gradient:#ffffff:#ffd6e2><b>{server}</b></gradient>"
    - "<shadow:#5a0a26E6><#ffe0ea>Онлайн: <white>{online}</white>   Пинг: <white>{ping} мс</white>"
  footer:
    - "<shadow:#5a0a26E6><#ffe0ea>TPS: <white>{tps}</white>   Время: <white>{time}</white>"
  max-name-length: 12
  max-columns: 2
  max-players: 15
  position: center
  margin: 4
  width: auto
  bossbar-rows: own
  ping-bars: false

board:
  enabled: true
  respect-other-scoreboards: true
  position: right
  margin: 4
  avoid-tab: overlap
  title: "<shadow:#5a0a26E6><gradient:#ffffff:#ffd6e2><b>{server}</b></gradient>"
  lines:
    - "<shadow:#5a0a26E6><#ffe0ea>Игрок: <white>{player}"
    - "<shadow:#5a0a26E6><#ffe0ea>Онлайн: <white>{online}"
    - "<shadow:#5a0a26E6><#ffe0ea>Пинг: <white>{ping} мс"
    - "<shadow:#5a0a26E6><#ffe0ea>Мир: <white>{world}"
    - "<shadow:#5a0a26E6><#ffe0ea>XYZ: <white>{x} {y} {z}"
    - "<shadow:#5a0a26E6><#ffe0ea>Время: <white>{time}"

bossbar:
  enabled: true
  text: "<#ffd6e6>Онлайн <#ff8fbd>{online}/{max}</#ff8fbd> <#ff7aaa>-</#ff7aaa> <white>{time}"
  progress: clock
  color: pink
  overlay: progress

actionbar:
  test: "<shadow:#5a0a26E6><#ffd6e6>Тест актионбара: <gradient:#ffffff:#ffc2d4>розово-кримсон</gradient>"

title:
  test-title: "<shadow:#5a0a26E6><gradient:#ffffff:#ffd6e2><b>{server}</b></gradient>"
  test-subtitle: "<shadow:#5a0a26E6><#ffe0ea>Добро пожаловать, <white>{player}"
  fade-in: 10
  stay: 60
  fade-out: 15

messages:
  help: "<#ff8fbd>tabshader</#ff8fbd> <gray>- стиль таба, табло, боссбара, актионбара и тайтла</gray>\n<#ff7aaa>/tsh toggle <tab|board|bossbar|actionbar|title> [игрок]</#ff7aaa> <gray>- вкл/выкл</gray>\n<#ff7aaa>/tsh test-title [игрок|*]</#ff7aaa> <gray>- тестовый тайтл</gray>\n<#ff7aaa>/tsh test-actionbar [игрок|*]</#ff7aaa> <gray>- тестовый актионбар</gray>\n<#ff7aaa>/tsh title <игрок|*> <текст> [| подзаголовок]</#ff7aaa> <gray>- тайтл с подложкой</gray>\n<#ff7aaa>/tsh actionbar <игрок|*> <текст></#ff7aaa> <gray>- актионбар с подложкой</gray>\n<#ff7aaa>/tsh reload</#ff7aaa> <gray>- перечитать config.yml</gray>"
  no-permission: "<#ff3d6e>Нет прав.</#ff3d6e>"
  only-players: "<#ff3d6e>Укажите игрока.</#ff3d6e>"
  player-not-found: "<#ff3d6e>Игрок <white><player></white> не найден.</#ff3d6e>"
  unknown-part: "<#ff3d6e>Неизвестная часть: <white><part></white>. Есть: tab, board, bossbar, actionbar, title.</#ff3d6e>"
  usage-toggle: "<#ff7aaa>/tsh toggle <tab|board|bossbar|actionbar|title> [игрок]</#ff7aaa>"
  usage-title: "<#ff7aaa>/tsh title <игрок|*> <текст> [| подзаголовок]</#ff7aaa>"
  usage-actionbar: "<#ff7aaa>/tsh actionbar <игрок|*> <текст></#ff7aaa>"
  toggled-on: "<#ff8fbd><part></#ff8fbd> <gray>для</gray> <white><player></white><gray>:</gray> <#7dffb0>включено</#7dffb0>"
  toggled-off: "<#ff8fbd><part></#ff8fbd> <gray>для</gray> <white><player></white><gray>:</gray> <#ff3d6e>выключено</#ff3d6e>"
  sent-title: "<gray>Тайтл отправлен:</gray> <white><player></white>"
  sent-actionbar: "<gray>Актионбар отправлен:</gray> <white><player></white>"
  reloaded: "<#ff8fbd>tabshader:</#ff8fbd> <gray>config.yml перечитан.</gray>"
  status: "<#ff8fbd>tabshader:</#ff8fbd> <gray>игроков</gray> <white><players></white><gray>, обновлений</gray> <white><updates></white><gray>, ширин глифов</gray> <white><widths></white>"
  status-tab: "<gray>Таб: лимит</gray> <white><limit></white><gray>, скрыто</gray> <white><hidden></white><gray>, обрезано ников</gray> <white><cut></white><gray>, ширина</gray> <white><width></white><gray>, таб</gray> <white><tab></white><gray>, табло</gray> <white><board></white><gray>, обход таба</gray> <white><avoid></white><gray>, табло шире <max> px (стоит справа)</gray> <white><wide></white>"
  status-pack: "<gray>Шейдеры в паке Nexo:</gray> <white><state></white>"
  status-ping: "<gray>Полоски пинга (tab.ping-bars):</gray> <white><state></white><gray>, сейчас убраны у</gray> <white><hidden></white><gray> из</gray> <white><players></white><gray> игроков</gray>"
  ping-on: "показаны"
  ping-off: "скрыты"
  tab-hidden: "<shadow:#5a0a26E6><#ffe0ea>И еще <white>+<count></white> в сети"
  part-tab: "Таб"
  part-board: "Табло"
  part-bossbar: "Боссбар"
  part-actionbar: "Актионбар"
  part-title: "Тайтл"
