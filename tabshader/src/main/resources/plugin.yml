name: tabshader
version: '${version}'
main: dev.tearsmilk.tabshader.TabShaderPlugin
api-version: '1.21'
author: tearsmilk
authors: [tearsmilk]
description: HUD restyled by resource pack core shaders - tab list, sidebar, boss bar, action bar, title
softdepend: [PlaceholderAPI]
commands:
  tabshader:
    description: tabshader - styled tab list, sidebar, boss bar, action bar and title
    usage: /tabshader help
    aliases: [tsh]
permissions:
  tabshader.toggle:
    description: Toggle own tab, board, bossbar, actionbar, title
    default: true
  tabshader.test:
    description: test-title, test-actionbar for yourself
    default: op
  tabshader.admin:
    description: reload, status, title, actionbar, other players and *
    default: op
    children:
      tabshader.toggle: true
      tabshader.test: true
