# coreshaders - настройки. Автор: tearsmilk.
# Версия конфига, не менять. При обновлении плагин сам допишет новые картинки в images.
config-version: 4

# Картинки должны совпадать с ресурспаком: coreshaders:cube_<картинка> и coreshaders:plane_<картинка>.
images:
  - sky_sea
  - space
  - nether
  - aurora
  - end
  - sunset
  - volcano
  - hell_end
  - heaven
  - walk
  - rain
  - sea_sand

# Названия картинок для сообщений и подсказок жезла.
image-names:
  sky_sea: "Небо и море"
  space: "Космос"
  nether: "Незер"
  aurora: "Северное сияние"
  end: "Энд"
  sunset: "Закат"
  volcano: "Вулкан"
  hell_end: "Ад и Энд"
  heaven: "Рай"
  walk: "Прогулка"
  rain: "Дождь"
  sea_sand: "Море и песок"

defaults:
  shape: cube
  image: sky_sea
  color: "#FFFFFF"

# Дальность луча для команд и ЛКМ жезлом (в блоках).
max-distance: 8.0

# Отступ плоскости от грани блока (в блоках), чтобы не было мерцания.
plane-offset: 0.015

# Светящийся обод по краям граней и рамка вокруг плоскости. По умолчанию выключен: окна без линий,
# соседние кубы и плоскости сливаются в одну поверхность. Для отдельного эффекта: /cs rim on|off [group].
# Если обод включен, он рисуется только по внешнему краю группы соседних эффектов.
rim: false

# Команды на эффектах (порталы, варпы).
commands:
  # Триггер по умолчанию при первой команде: enter (вошел в блок эффекта), click (ПКМ без жезла), both.
  default-trigger: enter
  # Пауза между срабатываниями для игрока, секунды (защита от петель телепорта). /cs cooldown меняет у эффекта.
  default-cooldown: 2.0
  # Максимум эффектов в группе (флаг group - все соседние эффекты, например стена портала).
  max-group: 1024

# Свои картинки: /cs upload <имя> <https-ссылка>, /cs import <имя> (из plugins/coreshaders/images/<имя>.png|jpg|gif).
custom-images:
  # Сколько своих картинок можно добавить (картинка - спрайт 1024x512 в атласе, 2 МБ видеопамяти; анимация - один
  # кадр в атласе, по умолчанию 512x256).
  max: 24
  # Предел размера файла (МБ) и картинки (мегапиксели).
  max-download-mb: 16
  max-megapixels: 40
  timeout-seconds: 20
  # Куда писать файлы пака (относительно папки plugins или абсолютный путь).
  pack-assets: "Nexo/pack/assets"
  # Плагин пака и команды пересборки (из консоли). Пустой список - пересобрать вручную.
  pack-plugin: Nexo
  reload-commands:
    - "nexo reload pack"
  # Номера картинок для шейдера (33-200). Заполняет плагин, руками не менять.
  kinds: {}
  # Анимированные GIF: каждый кадр превращается в панораму как обычная картинка, кадры идут столбиком в одном PNG
  # с .png.mcmeta. В атласе анимация занимает один кадр, но клиент держит в памяти все кадры.
  animation:
    # Не больше стольких кадров (время сохраняется: кадры GIF прореживаются, frametime подбирается).
    max-frames: 32
    # Ширина кадра: 256, 512 или 1024 (высота - половина). Другие числа округляются до ближайшего.
    width: 512
    # Плавный переход между кадрами (interpolate в mcmeta).
    interpolate: false
    # Предел одной анимации в памяти клиента (ширина x высота x кадры x 4 байта), МБ.
    max-texture-mb: 16
    # Предел всех своих анимаций вместе в памяти клиента, МБ.
    total-texture-mb: 96
    # Предел размера PNG одной анимации в паке, МБ.
    max-file-mb: 8
    # Сколько кадров может быть в исходном GIF.
    max-source-frames: 1000

# Яркость дисплеев (0-15). Шейдер сам светится, это влияет только на клиенты без пака.
brightness: 15

# Именованные цвета для /cs color и /cs give. Можно добавлять свои: имя: "#RRGGBB".
colors:
  white: "#FFFFFF"
  red: "#FF5050"
  orange: "#FFA040"
  yellow: "#FFE060"
  green: "#70FF70"
  cyan: "#60FFFF"
  blue: "#6080FF"
  purple: "#C070FF"
  pink: "#FF80C0"
  gray: "#A0A0A0"
  dark: "#505050"
  белый: "#FFFFFF"
  красный: "#FF5050"
  оранжевый: "#FFA040"
  жёлтый: "#FFE060"
  желтый: "#FFE060"
  зелёный: "#70FF70"
  зеленый: "#70FF70"
  голубой: "#60FFFF"
  синий: "#6080FF"
  фиолетовый: "#C070FF"
  розовый: "#FF80C0"
  серый: "#A0A0A0"
  тёмный: "#505050"

