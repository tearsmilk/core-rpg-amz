# Повышающие планки (TACZ slot adapters): ставятся в слот (scope), разрешают ещё обвесы (allow) и поднимают
# их на mount-offset (пикселей модели). Своих характеристик нет.
adapters:
  riser_pistol_high:
    name: "Пистолетная высокая повышающая планка"
    slot: "scope"
    sort: 11
    allow: ["#pistol_sight"]
    model: "guns/att/riser_pistol_high.bbmodel"
    mount-offset: [0, 1.25, 0]
  riser_pistol_low:
    name: "Пистолетная низкая повышающая планка"
    slot: "scope"
    sort: 10
    allow: ["#pistol_sight"]
    model: "guns/att/riser_pistol_low.bbmodel"
    mount-offset: [0, 0.375, 0]
  riser_pistol_mid:
    name: "Пистолетная средняя повышающая планка"
    slot: "scope"
    sort: 10
    allow: ["#pistol_sight"]
    model: "guns/att/riser_pistol_mid.bbmodel"
    mount-offset: [0, 1, 0]
  riser_rail_high:
    name: "Высокая повышающая планка"
    slot: "scope"
    sort: 20
    allow: ["#scope_sight"]
    model: "guns/att/riser_rail_high.bbmodel"
    mount-offset: [0, 1.825, 0]
  riser_rail_mid:
    name: "Средняя повышающая планка"
    slot: "scope"
    sort: 20
    allow: ["#scope_sight"]
    model: "guns/att/riser_rail_mid.bbmodel"
    mount-offset: [0, 0.75, 0]
  riser_rail_unity:
    name: "Повышающая планка Unity"
    slot: "scope"
    sort: 20
    allow: ["#scope_sight"]
    model: "guns/att/riser_rail_unity.bbmodel"
    mount-offset: [0, 0.85, 0]

# Обвесы. type — слот (scope, muzzle, stock, grip, laser, extended_mag); hidden — не показывать в списках
# (только если разрешён оружию); builtin — встроенный (часть оружия: ставится без предмета, при снятии
# ничего не возвращается); item — предмет hoitems; display — вид (zoom — кратности прицела, views — какая
# точка взгляда scope_view для каждой кратности, views-fov / fov — угол обзора модели в прицеле, scope — оптика,
# sight — коллиматор, height-adjust — подъём оружия у глаза, adapter — какую кость оружия показать,
# show-muzzle — не прятать дульный срез, flash-offset — вспышка дальше на столько пикселей, laser — луч ЛЦУ).
attachments:
  ammo_mod_fmj:
    type: extended_mag
    name: "Патроны с цельнометаллической оболочкой"
    sort: 1000
    weight: 0.6
    item: att_ammo_mod_fmj
    icon: tacz/att/ammo_mod_fmj.png
    sounds: {install: "gun_att_attachment_general_a", uninstall: "gun_att_attachment_general_uninstall"}
    mods:
      ads: {add: 0.02}
      damage: {mul: 0.9}
      ammo-speed: {mul: 1.1}
      armor-ignore: {op: {gt: 0.5, then-mul: 1.5, else-mul: 1.75}}
      pierce: {op: {gt: 2, then-add: 2}}
      extended-mag-level: 3
  ammo_mod_he:
    type: extended_mag
    name: "Разрывные патроны"
