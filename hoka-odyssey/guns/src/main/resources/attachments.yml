# Обвесы оружия (модуль guns) — весь стандартный пак TACZ tacz_default_gun: названия (ru_ru), вес, вид и
# модификаторы характеристик. Сделан скриптом tools/tacz2bb/attachments2yml.py из файлов пака (числа как есть).
# Модели, иконки и звуки обвесов — TACZ, CC BY-NC-ND 4.0 (без изменений, см. NOTICE.md в jar, папка tacz/).
# Свой файл без пересборки — module/guns/attachments.yml (тогда этот из jar не читается).
#
# Модификатор (как в TACZ): значение = (база + сумма add) × max(0, 1 + сумма percent) × произведение mul,
# потом op: set — заменить числом; gt/then-add — «если больше gt, прибавить»; gt/then-mul/else-mul — «если больше
# gt, умножить на then-mul, иначе на else-mul». Ключи: ads — время прицеливания; inaccuracy — разброс от бедра
# (стоя и в движении); aim-/sneak-/lie-inaccuracy — в прицеле, присев, лёжа; recoil-pitch/yaw — отдача;
# effective-range — дальности полос урона; damage, ammo-speed, rpm, head-shot, armor-ignore, pierce, knockback;
# flash-hider — размер вспышки; extended-mag-level — какой из extended-mag оружия (1–3); silence — глушитель
# (distance — на сколько блоков тише, sound — звук «с глушителем»); explosion — фугасный (взрыв оружия);
# ignite — поджигает; single-projectile — одна пуля вместо дроби (пуля «slug»); melee — штык/приклад (пока
# только хранится, ближнего боя нет); recoil-push — пока не используется.

