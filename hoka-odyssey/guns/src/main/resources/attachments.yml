    icon: tacz/att/ammo_mod_he.png
    sounds: {install: "gun_att_attachment_general_a", uninstall: "gun_att_attachment_general_uninstall"}
    mods:
      aim-inaccuracy: {mul: 0.25}
      inaccuracy: {mul: 1}
      rpm: {mul: 0.85}
      head-shot: {op: {set: 1}}
      armor-ignore: {mul: 0.5}
      pierce: {op: {set: 1}}
      extended-mag-level: 1
      explosion: true
      single-projectile: true
  ammo_mod_hp:
