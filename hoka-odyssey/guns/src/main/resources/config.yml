  # M1897 (m1897 из TACZ): помповый дробовик. За выстрел 8 дробин (pellets), урон из damage — на весь выстрел
  # (делится между дробинами, как у TACZ). После выстрела — помпа (bolt-time, как затвор AWP); зажатая ЛКМ — стреляет
  # и передёргивает подряд. Перезарядка — по одному патрону (shell-reload); выстрел её прерывает.
  m1897:
    name: "M1897"
    lore: ["Помповый дробовик под 12 калибр.", "Модель и звуки: TACZ, CC BY-NC-ND 4.0"]
    item: m1897
    material: iron_horse_armor
    ammo-item: ammo_12g
    ammo-material: gold_nugget
    ammo-name: "Патроны 12 калибра"
    caliber: "12g"
    infinite-ammo: false
    # Трубчатый магазин на 5 и патрон в патроннике.
    magazine: 5
    chamber: true
    rpm: 400
    modes: [auto]
    bolt-time: 0.2
    # Дробин за выстрел.
    pellets: 8
    damage:
      - {distance: 16, damage: 32}
      - {distance: 20, damage: 28}
      - {distance: 24, damage: 24}
      - {distance: inf, damage: 16}
    headshot: 1.25
    bullet:
      speed: 150
      life: 0.6
      gravity: 0.15
      friction: 0.05
      pierce: 1
      knockback: 0.15
      tracer: "#FF8888"
    # У дробовика конус широкий и в прицеле.
    spread:
      stand: 3.65
      move: 3.7
      sneak: 3.65
      aim: 3.5
      vacuum: 3.65
    recoil:
      pitch:
        - {time: 0, min: 2.25, max: 2.25}
        - {time: 0.2, min: 2.25, max: 2.25}
        - {time: 0.5, min: 0.15, max: 0.15}
        - {time: 0.75, min: 0, max: 0}
      yaw:
        - {time: 0, min: -1.5, max: -1.5}
        - {time: 0.1, min: -1, max: -1}
        - {time: 0.5, min: 0.15, max: 0.15}
        - {time: 0.75, min: 0, max: 0}
    # Перезарядка по одному патрону, секунд (TACZ m870_unload_gun_logic): вступление intro (в магазине что-то есть)
    # или intro-empty (пустой: патрон в патронник в intro-empty-feed), потом на каждый патрон цикл loop (патрон в
    # магазине в loop-feed от начала цикла), в конце end.
    shell-reload:
      intro: 0.47
      intro-empty: 2.1
      intro-empty-feed: 1.53
      loop: 0.53
      loop-feed: 0.27
      end: 0.37
    draw: 0.25
    aim-time: 0.18
    zoom: 1.25
    aim-speed: 0.9
    flash-scale: 2.0
    # Своего прицела (крестика по разбросу) на экране нет — как у TACZ.
    crosshair: false
    model: guns/m1897.bbmodel
    hud: guns/m1897_hud.png
    flash: guns/common_muzzle_flash.png
    player-animation: guns/rifle_default.player_animation.json
    sounds:
      shoot: m1897_shoot
      shoot3p: m1897_shoot_3p
      silence: m1897_silence
      silence3p: m1897_silence_3p
      draw: m1897_draw
      put_away: m1897_put_away
      dry_fire: gun_dry_fire
      fire_select: gun_fire_select
      flesh_hit: gun_flesh_hit
      head_hit: gun_head_hit
      kill: gun_kill
    # Для остальных: tactical — вступление, empty — вступление с пустым магазином, loop — каждый патрон, end — конец.
    reload-sounds-3p:
      tactical: {"0": m1897_reload_empty_start}
      empty: {"0": m1897_reload_empty_start, "0.33": m1897_bolt_out, "1.47": m1897_bolt_in}
      loop: {"0.03": m1897_reload_shellinsert}
      end: {"0": m1897_reload_end}
    bolt-sounds-3p: {"0.03": m1897_bolt_in, "0.23": m1897_bolt_out}
    type: rifle
    vacuum-recoil: 2.0
    # В TACZ нет упрощённой модели M1897 — предмет hoitems из полной модели (без рук и штыка).
    item-icon: tacz/m1897_slot.png
    item-model: tacz/m1897_item.bbmodel
    ammo-icon: tacz/12g.png
    # Обвес (как в TACZ, клавиша Y с оружием в руке): slots — какие слоты есть; allow — какие обвесы можно (id
    # и #метки из attachments.yml; метки adapter/… — повышающие планки); builtin — встроенные (ставятся без
    # предмета); default — что стоит на новом оружии; locked — слоты, которые нельзя менять; extended-mag —
    # патронов в магазине с удлинённым магазином 1/2/3 уровня; reload-xmag — перезарядка с ним (как reload).
    attachments:
      slots: ["extended_mag", "muzzle"]
      allow: ["#ammo_mod_no_he", "#ammo_mod_shotgun_exclusive", "#muzzle_shotgun", "oem_m1897_bayonet"]
      builtin: {muzzle: ["oem_m1897_bayonet"]}
      default: {}
    # Взрыв (только с фугасными патронами ammo_mod_he): урон в центре, радиус (блоков), отбрасывает ли.
    explosion: {damage: 50, radius: 3, knockback: false}

  # Плазменная винтовка ПВ-7 — наше оружие (не TACZ): модель, текстура, анимации, иконки и звуки сделаны скриптами
  # tools/plasma (gen_plasma_rifle.py, gen_plasma_sounds.py), лежат в jar в папке hoka/. Блок из четырёх коротких
  # стволов проворачивается на каждый выстрел; питание — энергоячейка (патроны ammo_plasma_cell). Выстрел — короткий
  # голубой сгусток плазмы (bullet.tracer-style: plasma), летит заметно медленнее пули.
  plasma_rifle:
    name: "Плазменная винтовка ПВ-7"
    lore: ["Импульсная винтовка с вращающимся блоком стволов.", "Питание — плазменные ячейки."]
