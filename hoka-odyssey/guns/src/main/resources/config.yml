# guns — огнестрел. Стреляет сервер: клиентский модуль guns (мод Hoka Odyssey) только присылает «выстрел» и
# направление, а сервер проверяет темп, патроны, перезарядку и угол, сам разбрасывает пули (разброс), летит пулей
# по тикам, считает попадания и урон. Без клиентского модуля можно стрелять ЛКМ (по одному выстрелу), перезарядка — F.
# Перечитать: homodule reload guns.
#
# Модели, текстуры и звуки АКМ, AWP (с прицелом 8x) и Glock 17 — из мода TACZ (https://github.com/MCModderAnchor/TACZ), лицензия CC BY-NC-ND 4.0:
# только некоммерческое использование, без изменений, с указанием авторов (см. NOTICE.md в jar, папка tacz/).
# Поставить предмет и звуки в hoitems/hosounds — /hogun install (OP), потом всё работает само.

# Урон другим игрокам (false — пули проходят сквозь игроков без урона, только искры).
pvp: true

# Урон мобам и другим живым сущностям.
damage-mobs: true

# Насколько направление выстрела от клиента может отличаться от взгляда игрока на сервере, градусов.
# Больше — выстрел отклоняется (защита от «стрельбы за спину»). Отдача и разброс в это не входят.
max-aim-deviation: 25

# Запас по темпу стрельбы: в «ведре» выстрелов столько штук сверх темпа (задержки сети приходят пачками).
rate-burst: 3

# Вакуум (модуль gravity): отдача относит стрелка назад (vacuum-recoil у оружия), звуки выстрела слышит только он сам.
vacuum:
  # Толчок цели при попадании в вакууме, блоков/с (0 — нет).
  target-impulse: 0.15
  # Кто слышит выстрел в вакууме: self — только стрелок (тише и глуше), none — никто, all — как на планете.
  sound: self
  # Сколько секунд летит пуля в вакууме (нет трения и тяжести, летит дальше). Не дальше прогруженных чанков.
  bullet-life: 3.0

# Частицы для всех (видны и без мода): крошка блока при попадании в блок, «сердечки урона» при попадании в цель.
particles: true

# Писать каждое попадание в лог сервера (кто, в кого, урон, расстояние) — для проверки и разбора жалоб.
log-hits: false

# Оружие за спиной: оружие в быстрой панели (не в руке) висит у игрока на спине — видят игроки с клиентским
# модулем guns (и он сам в F5). false — не рассылать.
back-gun: true

# Кто слышит выстрел на планете (блоков) — не дальше этого (сам звук ещё ограничен range в hosounds).
sound-range: 96

# Оружие. Ключ — id оружия (он же в custom_data предмета: hoka_gun=<id>).
guns:
  ak47:
    # Название и описание предмета (если предмета нет в hoitems — делаем свой с этим названием).
    name: "АКМ"
    lore: ["От Вьетнама до Афгана — он побывал везде.", "Модель и звуки: TACZ, CC BY-NC-ND 4.0"]
    # Предмет из hoitems (модель в руке и иконка). Нет hoitems или такого id — простой предмет из material.
    item: ak47
    material: iron_horse_armor
    # Патроны: предмет hoitems с этим id (или простой предмет с меткой hoka_ammo=<caliber>, если hoitems нет).
    ammo-item: ammo_762x39
    ammo-material: gold_nugget
    ammo-name: "Патроны 7,62×39"
    caliber: "762x39"
    # Бесконечные патроны (перезарядка без патронов в инвентаре). В креативе патроны тоже не тратятся.
    infinite-ammo: false
    # Магазин и патрон в патроннике (true — тактическая перезарядка даёт 30+1).
    magazine: 30
    chamber: true
    # Темп, выстрелов в минуту, и режимы огня (auto — очередь, пока зажата ЛКМ; semi — по одному).
    rpm: 600
    modes: [auto, semi]
    # Урон по расстоянию: до distance блоков — damage (последний — для всего дальше). Сердце = 2 урона.
    damage:
      - {distance: 30, damage: 9}
      - {distance: 60, damage: 7.5}
      - {distance: inf, damage: 6}
    # Множитель урона в голову (попадание в пределах ±0,25 блока от уровня глаз).
    headshot: 1.5
    # Пуля: скорость (блоков/с), время жизни (с), тяжесть (блоков/тик² вниз) и трение (доля скорости за тик),
    # сколько целей пробивает, отбрасывание цели (0 — нет), цвет трассера.
    bullet:
      speed: 500
      life: 0.8
      gravity: 0.15
      friction: 0.02
      pierce: 1
      knockback: 0
      tracer: "#FF8888"
    # Разброс, градусов (примерно): стоя, в движении (и в прыжке), присев, в прицеле, в вакууме без прицела.
    spread:
      stand: 4.5
      move: 5
      sneak: 2.5
      aim: 0.15
      vacuum: 4.5
    # Отдача камеры (рисует клиент): ключевые точки «время (с): [мин, макс] градусов», значение — случайное в
    # пределах. pitch > 0 — ствол вверх, yaw — вбок.
    recoil:
      pitch:
        - {time: 0, min: 0.8, max: 0.8}
        - {time: 0.1, min: 1.4, max: 1.4}
        - {time: 0.15, min: 0.8, max: 0.8}
        - {time: 0.45, min: -0.175, max: -0.175}
        - {time: 0.6, min: 0, max: 0}
      yaw:
        - {time: 0, min: -0.23, max: 0.18}
        - {time: 0.35, min: 0, max: 0}
    # Перезарядка, секунд: feed — когда патроны уже в магазине, total — когда снова можно стрелять.
    # tactical — в магазине ещё что-то есть, empty — магазин пуст (дольше: надо передёрнуть затвор).
    reload:
      tactical: {feed: 1.55, total: 2.0}
      empty: {feed: 2.25, total: 2.6}
    # Достать оружие (нельзя стрелять), секунд; время прицеливания; приближение в прицеле; скорость в прицеле.
    draw: 0.35
    aim-time: 0.22
    zoom: 1.33
    aim-speed: 0.8
    # Файлы для клиентского модуля (раздаёт этот модуль из jar, папка tacz/): модель в руке, силуэт для HUD,
    # вспышка у ствола, анимации тела от третьего лица (формат PlayerAnimator, как в TACZ).
    model: guns/ak47.bbmodel
    hud: guns/ak47_hud.png
    flash: guns/common_muzzle_flash.png
    player-animation: guns/rifle_default.player_animation.json
    # Звуки (id в hosounds, в игре hoka:<id>). Ставит /hogun install.
    sounds:
      shoot: ak47_shoot            # свой выстрел (стерео, слышит только стрелок)
      shoot3p: ak47_shoot_3p       # выстрел для остальных (из точки)
      draw: ak47_draw
      put_away: ak47_put_away
      dry_fire: gun_dry_fire
      fire_select: gun_fire_select
      flesh_hit: gun_flesh_hit
      head_hit: gun_head_hit
      kill: gun_kill
    # Звуки перезарядки, которые слышат остальные (на планете): секунда от начала → id звука.
    reload-sounds-3p:
      tactical: {"0.35": ak47_reload_magout, "1.4": ak47_reload_magin}
      empty: {"0.5": ak47_reload_empty_magout, "1.15": ak47_reload_empty_magin, "1.75": ak47_reload_empty_chamber}
    # Вид: rifle (за спиной), sniper (за спиной), pistol (в кобуре на бедре, поза тела pistol_default).
    type: rifle
    # Отдача в вакууме: на сколько блоков выстрел относит стрелка назад в свободном полёте (без опоры под
    # ногами; стоя на земле или у блока — не относит). Выстрелы складываются. 0 — без отдачи.
    vacuum-recoil: 1.0
    # Предмет hoitems, который ставит /hogun install: иконка в инвентаре ("" — в инвентаре модель) и модель.
    item-icon: tacz/ak47_slot.png
    item-model: tacz/ak47_lod.bbmodel
    ammo-icon: tacz/762x39.png

  # AWP (ai_awp из TACZ) с прицелом 8x (scope_standard_8x) — прицел часть винтовки, не снимается. Ручной затвор:
  # после каждого выстрела — передёргивание (bolt-time), в прицеле — чёрный экран и круг прицела с сеткой TACZ.
  ai_awp:
    name: "AWP"
    lore: ["Снайперская винтовка с прицелом 8x.", "Модель и звуки: TACZ, CC BY-NC-ND 4.0"]
    item: ai_awp
    material: iron_horse_armor
    ammo-item: ammo_338
    ammo-material: gold_nugget
    ammo-name: "Патроны .338 Lapua Magnum"
    caliber: "338"
    infinite-ammo: false
    magazine: 5
    chamber: true
    rpm: 171
    modes: [semi]
    # Ручной затвор: секунд на передёргивание после выстрела (TACZ bolt_action_time). 0 — нет затвора.
    bolt-time: 0.9
    damage:
      - {distance: 80, damage: 50}
      - {distance: 160, damage: 45}
      - {distance: inf, damage: 40}
    headshot: 2
    bullet:
      speed: 575
      life: 0.9
      gravity: 0.15
      friction: 0.015
      pierce: 4
      knockback: 0
      tracer: "#FF8888"
    # От бедра разброс большой (TACZ: 5°), в прицеле — 0,05°.
    spread:
      stand: 5
      move: 5.5
      sneak: 3
      aim: 0.05
      vacuum: 5
    recoil:
      pitch:
        - {time: 0, min: 3.5, max: 3.5}
        - {time: 0.07, min: 2.5, max: 2.5}
        - {time: 0.16, min: 3.25, max: 3.25}
        - {time: 0.24, min: 2, max: 2}
        - {time: 0.6, min: -0.5, max: -0.5}
        - {time: 0.71, min: 0.25, max: 0.25}
        - {time: 0.83, min: 0, max: 0}
        - {time: 0.88, min: 0, max: 0}
      yaw:
        - {time: 0, min: -0.75, max: -0.75}
        - {time: 0.08, min: 0.6, max: 0.6}
        - {time: 0.17, min: -0.35, max: -0.35}
        - {time: 0.28, min: 0.25, max: 0.25}
        - {time: 0.5, min: 0, max: 0}
        - {time: 0.8, min: 0, max: 0}
    reload:
      tactical: {feed: 2.05, total: 2.25}
      empty: {feed: 2.85, total: 3.25}
    draw: 0.35
    aim-time: 0.33
    # Оптика: в прицеле экран чёрный, кроме круга прицела; приближение 8x.
    scope: true
    zoom: 8
    aim-speed: 0.6
    model: guns/ai_awp.bbmodel
    hud: guns/ai_awp_hud.png
    flash: guns/common_muzzle_flash.png
    player-animation: guns/rifle_default.player_animation.json
    sounds:
      shoot: awp_shoot
      shoot3p: awp_shoot_3p
      draw: awp_draw
      put_away: awp_put_away
      dry_fire: gun_dry_fire
      fire_select: gun_fire_select
      flesh_hit: gun_flesh_hit
      head_hit: gun_head_hit
      kill: gun_kill
    reload-sounds-3p:
      tactical: {"0.55": awp_reload_magout, "1.98": awp_reload_magin}
      empty: {"0.58": awp_reload_empty_magout, "2.03": awp_reload_empty_magin, "2.62": awp_reload_empty_boltclose}
    # Звуки затвора, которые слышат остальные: секунда от начала передёргивания → id звука.
    bolt-sounds-3p: {"0.17": awp_rechamber_out, "0.62": awp_rechamber_in}
    type: sniper
    # Отдача в вакууме: на сколько блоков выстрел относит стрелка назад в свободном полёте (без опоры под
    # ногами; стоя на земле или у блока — не относит). Выстрелы складываются. 0 — без отдачи.
    vacuum-recoil: 3.0
    # В инвентаре — модель (с прицелом), а не плоская иконка TACZ без прицела.
    item-icon: ""
    item-model: tacz/ai_awp_lod.bbmodel
    ammo-icon: tacz/338.png

  # Glock 17 (glock_17 из TACZ): пистолет, одиночный огонь; поза тела — pistol_default TACZ.
  glock_17:
    name: "Glock 17"
    lore: ["Пистолет под 9×19.", "Модель и звуки: TACZ, CC BY-NC-ND 4.0"]
    item: glock_17
    material: iron_horse_armor
    ammo-item: ammo_9mm
    ammo-material: gold_nugget
    ammo-name: "Патроны 9×19"
    caliber: "9mm"
    infinite-ammo: false
    magazine: 17
    chamber: true
    rpm: 400
    modes: [semi]
    damage:
      - {distance: 18, damage: 7}
      - {distance: 45, damage: 5}
      - {distance: inf, damage: 4}
    headshot: 1.5
    bullet:
      speed: 150
      life: 0.8
      gravity: 0.15
      friction: 0.025
      pierce: 1
      knockback: 0
      tracer: "#FF8888"
    spread:
      stand: 2
      move: 2.5
      sneak: 1.5
      aim: 0.2
      vacuum: 2
    recoil:
      pitch:
        - {time: 0, min: 1, max: 1}
        - {time: 0.1, min: 1, max: 1}
        - {time: 0.25, min: 0.1, max: 0.1}
        - {time: 0.3, min: 0.05, max: 0.05}
        - {time: 0.35, min: 0, max: 0}
      yaw:
        - {time: 0, min: -0.5, max: 0.5}
        - {time: 0.2, min: 0, max: 0}
        - {time: 0.3, min: 0, max: 0}
    reload:
      tactical: {feed: 1.05, total: 1.5}
      empty: {feed: 1.63, total: 1.88}
    draw: 0.32
    aim-time: 0.16
    zoom: 1.2
    aim-speed: 1.0
    # Размер вспышки у ствола (TACZ muzzle_flash.scale; 1 — как у винтовок).
    flash-scale: 0.4
    model: guns/glock_17.bbmodel
    hud: guns/glock_17_hud.png
    flash: guns/common_muzzle_flash.png
    player-animation: guns/pistol_default.player_animation.json
    sounds:
      shoot: glock17_shoot
      shoot3p: glock17_shoot_3p
      draw: glock17_draw
      put_away: ""
      dry_fire: gun_dry_fire
      fire_select: gun_fire_select
      flesh_hit: gun_flesh_hit
      head_hit: gun_head_hit
      kill: gun_kill
    reload-sounds-3p:
      tactical: {"0.48": glock17_reload_magout, "0.87": glock17_reload_magin}
      empty: {"0.0": glock17_reload_empty_magout, "0.87": glock17_reload_empty_magin, "1.5": glock17_reload_empty_charge}
    type: pistol
    # Отдача в вакууме: на сколько блоков выстрел относит стрелка назад в свободном полёте (без опоры под
    # ногами; стоя на земле или у блока — не относит). Выстрелы складываются. 0 — без отдачи.
    vacuum-recoil: 0.5
    item-icon: tacz/glock_17_slot.png
    item-model: tacz/glock_17_lod.bbmodel
    ammo-icon: tacz/9mm.png
