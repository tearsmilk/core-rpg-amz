      tracer-length: 0.8
    spread:
      stand: 4.0
      move: 4.75
      sneak: 2.25
      aim: 0.15
      vacuum: 4.0
    recoil:
      pitch:
        - {time: 0, min: 0.55, max: 0.65}
        - {time: 0.08, min: 0.9, max: 1.0}
        - {time: 0.2, min: 0.35, max: 0.35}
        - {time: 0.4, min: -0.1, max: -0.1}
        - {time: 0.55, min: 0, max: 0}
      yaw:
        - {time: 0, min: -0.2, max: 0.2}
        - {time: 0.3, min: 0, max: 0}
    # Ячейка вставлена в 1,42 с; с пустой ещё рукоять заряжания (1,75–1,9 с).
    reload:
      tactical: {feed: 1.45, total: 1.9}
      empty: {feed: 1.45, total: 2.35}
    draw: 0.35
    aim-time: 0.22
    zoom: 1.33
    aim-speed: 0.8
    flash-scale: 0.7
    model: guns/plasma_rifle.bbmodel
    hud: guns/plasma_rifle_hud.png
    flash: guns/plasma_flash.png
    player-animation: guns/rifle_default.player_animation.json
    sounds:
      shoot: plasma_rifle_shoot
      shoot3p: plasma_rifle_shoot_3p
      draw: plasma_rifle_draw
      put_away: plasma_rifle_put_away
      dry_fire: gun_dry_fire
      fire_select: gun_fire_select
      flesh_hit: gun_flesh_hit
      head_hit: gun_head_hit
      kill: gun_kill
    reload-sounds-3p:
      tactical: {"0.5": plasma_rifle_cell_out, "1.4": plasma_rifle_cell_in}
      empty: {"0.5": plasma_rifle_cell_out, "1.4": plasma_rifle_cell_in, "1.74": plasma_rifle_charge}
    type: rifle
    vacuum-recoil: 0.8
    item-icon: hoka/plasma_rifle_slot.png
    item-model: hoka/plasma_rifle_lod.bbmodel
    ammo-icon: hoka/plasma_cell.png
    # Обвес: прицелы, рукояти, приклады и ЛЦУ — те же, что у M4A1; дульных устройств и удлинённых ячеек нет.
    # Встроенный приклад — свой каркасный (plasma_wire_stock), механический прицел прячется под оптикой.
    attachments:
      slots: ["scope", "stock", "laser", "grip"]
      allow: ["plasma_wire_stock", "#scope_scope", "#scope_sight", "#grip", "#stock", "#ar_laser", "#pistol_laser", "#adapter/pistol_riser", "#adapter/rail_mid"]
      builtin: {stock: ["plasma_wire_stock"]}
      default: {stock: "plasma_wire_stock"}
