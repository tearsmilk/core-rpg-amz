# gravity — вакуум/невесомость на выбранных картах. Автор: tearsmilk.
# На такой карте игрок не падает и сам не взлетает — висит в воздухе. Пробел — плавно вверх, Shift — плавно вниз,
# WASD — в стороны; отпустил клавиши — скорость гаснет постепенно (инерция), а не обрывается, как в креативном полёте.
# Если ничего не нажимать (ни WASD, ни пробел, ни Shift, ни бег) — вакуум медленно сносит игрока к ближайшей
# чёрной дыре (или по drift.direction, если дыр рядом нет). Нажал клавишу — управляешь сам, дрейф не мешает.
# Выброшенные предметы на таких картах не падают, а плывут по инерции и падают в чёрные дыры.
# Перечитать: /hograv reload (или homodule reload gravity). Включить/выключить карту: /hograv on|off <карта>.
# Чёрные дыры: /hograv hole list | add <имя> [горизонт] [радиус] | remove <имя> [карта].
#
# Как устроено: у игрока атрибут гравитации = 0 (клиент сам перестаёт падать), прыжок с земли отключён, а тягу
# сервер добавляет к скорости игрока небольшими толчками каждый тик. Движение считает клиент, поэтому с пингом
# ощущается как полёт на элитрах: тяга приходит с задержкой, но без рывков и откатов.

# Карты (папки в maps/), где действует вакуум. /hograv on|off правит этот список сам.
maps:
  - galaxy1

# Чёрные дыры: <карта>: <имя>: {x, y, z, horizon, reach, pull, max-speed}. Действуют только на картах из maps.
#   x, y, z    — центр дыры;
#   horizon    — радиус горизонта, блоков: предмет внутри исчезает (поглощён), игрока — см. player-on-horizon;
#   reach      — радиус действия, блоков: дальше дыра не притягивает;
#   pull       — ускорение притяжения у края горизонта, блоков/сек за секунду; дальше слабеет (см. hole-physics);
#   max-speed  — предел скорости падения предметов в дыру, блоков/сек (у игрока свой — player-max-drift-speed).
# /hograv hole add|remove правит этот раздел сам (комментарии внутри раздела при этом не сохраняются — пишите их тут);
# имена карт и дыр команда пишет в кавычках, чтобы «1» или «on» не стали числом/true.
black-holes:
  galaxy1:
    abyss: {x: 0.5, y: 65, z: -600, horizon: 6, reach: 1500, pull: 4, max-speed: 12}

# Значения для /hograv hole add (и для пропущенных полей дыр выше).
hole-defaults:
  horizon: 6
  reach: 1500
  pull: 4
  max-speed: 12

# Как притяжение слабеет с расстоянием d от центра: pull × (horizon / d) ^ falloff, но не меньше min-pull.
hole-physics:
  # 1 — мягко (вдвое дальше — вдвое слабее), 2 — как настоящая гравитация (быстро слабеет), 0 — везде как у горизонта.
  falloff: 1.0
  # Наименьшее притяжение на всём радиусе действия, блоков/сек за секунду: даже далеко от дыры всё медленно сносит к ней.
  min-pull: 0.05

# Дрейф игрока, когда он ничего не нажимает и рядом (в пределах reach) нет чёрных дыр.
drift:
  # Куда сносит (вектор, длина не важна): z -1 — на север. Все нули — дрейфа нет.
  direction: {x: 0, y: 0, z: -1}
  # Скорость дрейфа, блоков/сек. 0 — выключить (игрок без клавиш просто висит).
  speed: 0.3
  # Как быстро набирается эта скорость, блоков/сек за секунду.
  acceleration: 0.3

# Притяжение дыры для игрока без клавиш = притяжение для предметов × этот множитель (0 — дыры игрока не тянут).
player-pull-scale: 0.5
# Предел скорости, до которой дыра разгоняет игрока без клавиш, блоков/сек.
player-max-drift-speed: 1.5
# Что с игроком у горизонта: none — подтягивает к горизонту и там держит (внутрь не затягивает, тормозит заранее);
# spawn — переносит на точку появления карты (как /homap setspawn).
player-on-horizon: none

# Предметы (выброшенные вещи, ItemEntity) на картах с вакуумом. В зонах gravzones с обычной гравитацией (0.1…10)
# предметы падают с гравитацией зоны — дыры их не тянут и не поглощают.
items:
  # false — предметы падают как обычно.
  enabled: true
  # Затухание скорости: за сколько секунд скорость падает вдвое. Больше — дольше летят; 0 — не гаснет совсем.
  drag-half-life: 30
  # Раз во сколько тиков пересчитывать скорость предметов (1–20). Меньше — точнее, больше — меньше нагрузка.
  # С тем же шагом летящему предмету шлётся позиция игрокам (иначе раз в секунду — и он летит рывками).
  update-ticks: 2
  # Край мира: сервер не двигает предмет в незагруженный чанк (чанки грузятся только вокруг игроков). Если предмет
  # туда летит и его тянет дыра — он считается упавшим в неё и исчезает (тихо, рядом никого); если дыры нет —
  # останавливается и висит у края, пока его кто-нибудь не подберёт.
  # Частицы и звук, когда дыра поглощает предмет.
  absorb-effect: true

# Вверх/вниз (пробел/Shift).
vertical:
  # Разгон, блоков/сек за секунду: чем больше, тем быстрее набирается скорость.
  thrust: 8.0
  # Максимальная скорость подъёма/спуска, блоков/сек.
  max-speed: 4.0
  # Торможение без клавиш: за сколько секунд вертикальная скорость падает вдвое.
  # Меньше — резче останавливается, больше — дольше «плывёт».
  stop-half-life: 0.35

# Вперёд/назад/влево/вправо (WASD).
horizontal:
  # Добавочный разгон к обычному «воздушному» управлению клиента, блоков/сек за секунду. 0 — только клиентское
  # управление в воздухе (оно слабое: около 4 блоков/сек, с бегом — около 5).
  thrust: 2.4
  # Выше этой скорости (блоков/сек) добавочный разгон не даётся.
  max-speed: 7.0
  # Инерция без клавиш: за сколько секунд горизонтальная скорость падает вдвое (в воздухе).
  # Обычный Minecraft — около 0,37 с; 0 — не трогать, как в обычном воздухе.
  glide-half-life: 0.8

# Урон от падения в вакууме: false — нет урона (атрибут fall_damage_multiplier = 0).
fall-damage: false

# Прыжок с земли: false — пробел на земле не подбрасывает (иначе без гравитации игрок улетел бы на десятки блоков),
# а плавно поднимает тягой.
ground-jump: false

# Подсказка в action bar, когда игрок попадает на карту с вакуумом ("" — не показывать).
enter-hint: "Невесомость: пробел — вверх, Shift — вниз, WASD — в стороны"
