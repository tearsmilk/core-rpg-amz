# gravity — вакуум/невесомость на выбранных картах. Автор: tearsmilk.
# Перечитать: /hograv reload (или homodule reload gravity). Включить/выключить карту: /hograv on|off <карта>.
# Чёрные дыры: /hograv hole list | add <имя> [горизонт] [радиус] | remove <имя> [карта].
#
# НАСТОЯЩАЯ ФИЗИКА (по умолчанию на всех картах из maps): как в настоящем вакууме. Скорость не гаснет совсем —
# толкнулся и летишь, пока во что-нибудь не врежешься; ни «воздуха», ни дрейфа, ни предела скорости. Тянут
# тела карты (раздел bodies: планеты, станции, астероиды) и чёрные дыры — по закону всемирного тяготения (1/r²),
# так что можно выйти на настоящую орбиту. Пробел у стены/пола/потолка — оттолкнуться от неё (в сторону взгляда,
# если смотришь от стены). Ранец: WASD — вперёд/назад/вбок по взгляду, пробел/Shift — вверх/вниз, бег (Ctrl)
# без клавиш — гасить скорость. Сильный удар о блок ранит. На поверхности планеты ходишь как обычно, но с её
# притяжением. Выброшенные предметы летят по тем же законам.
# Сервер сам ведёт скорость игрока и каждый тик шлёт её клиенту (работает без мода). У кого стоит клиентский
# модуль spaceflight — физику считает его клиент (без задержки пинга), а сервер только присылает тела карты и
# проверяет, что игрок не летает быстрее, чем позволяет физика.
#
# СТАРАЯ ФИЗИКА (карты из physics.legacy-maps): пробел/Shift — плавно вверх/вниз, WASD — в стороны, отпустил —
# скорость гаснет постепенно; без клавиш вакуум медленно сносит к ближайшей чёрной дыре (или по drift.direction).
# Для неё — разделы hole-physics, drift, player-*, vertical, horizontal ниже.

# Карты (папки в maps/), где действует вакуум. /hograv on|off правит этот список сам.
maps:
  - galaxy1

# Настоящая физика вакуума.
physics:
  # Карты из maps со СТАРОЙ физикой (тяга с затуханием, дрейф к дырам). [] — на всех настоящая.
  legacy-maps: []
  # Ранец (реактивная тяга).
  thrust:
    # Ускорение, блоков/сек за секунду. 0 — ранца нет (двигаться можно только толчками от блоков).
    acceleration: 2.0
    # Запас изменения скорости, блоков/сек; пополняется, когда стоишь на земле. 0 — без ограничения.
    delta-v: 60
  # Скорость толчка от блока (пробел у стены/пола/потолка), блоков/сек. 0 — толкаться нельзя.
  push-off: 2.5
  # Удар о блок.
  impact:
    # Удар слабее этого (изменение скорости поперёк поверхности, блоков/сек) не ранит.
    threshold: 8.0
    # Урон (половинок сердца) за каждый блок/сек сверх порога. 0 — удары не ранят.
    damage: 1.0
    # Отскок: 0 — прилипает, 1 — отскакивает как мячик.
    restitution: 0.2
    # Трение в момент удара: сколько скорости вдоль поверхности «съедает» удар.
    friction: 0.3
  # Проверка игроков с модом spaceflight: движение быстрее, чем позволяет физика, — возврат назад.
  anti-cheat: true
  # Запас этой проверки у блоков, блоков/сек: с модом spaceflight можно ходить по стенам и потолку («магнитные
  # ботинки» — Shift у блока) и отталкиваться от них. Вместе с push-off и встроенным запасом 3 блока/сек должен
  # покрывать walk_speed + jump_speed клиентского модуля (по умолчанию 4.3 + 5).
  surface-walk: 8.0
  # Показывать скорость (блоков/сек) в action bar.
  speed-readout: false

# Притягивающие тела по картам: <карта>: <имя>: {type, x, y, z, radius, surface-gravity или mu, softening}.
#   type            — planet (планета, луна), star (звезда) или small (станция, астероид); по умолчанию planet;
#   x, y, z         — центр тела;
#   radius          — радиус шара, блоков: снаружи притяжение слабеет как 1/r², внутри — как у однородного шара
#                     (к центру — до нуля);
#   surface-gravity — ускорение на поверхности (на расстоянии radius от центра), блоков/сек за секунду
#                     (Земля — 9.8, Луна — 1.6);
#   mu              — вместо surface-gravity: «масса» μ = G·M, блоков³/с² (на расстоянии r ускорение μ/r²);
#   softening       — только для small: радиус «смягчения», чтобы у центра не было бесконечной силы
#                     (по умолчанию radius или 1).
# Пример: планета радиусом 40 с земной тяжестью и станция рядом — круговая орбита на высоте 60 над центром
# планеты: скорость √(μ/r) = √(9.8·40²/100) ≈ 12.5 блоков/сек.
#   galaxy1:
#     terra: {type: planet, x: 0, y: 0, z: 300, radius: 40, surface-gravity: 9.8}
#     station: {type: small, x: 0, y: 100, z: 300, mu: 20, softening: 4}
# Чёрные дыры (раздел black-holes) на картах с настоящей физикой тоже тянут по 1/r²: ускорение pull на
# расстоянии двух горизонтов от центра, дальше — слабее.
bodies: {}

# Чёрные дыры: <карта>: <имя>: {x, y, z, horizon, reach, pull, max-speed}. Действуют только на картах из maps.
#   x, y, z    — центр дыры;
#   horizon    — радиус горизонта, блоков: предмет внутри исчезает (поглощён), игрока — см. player-on-horizon;
#   reach      — радиус действия, блоков: дальше дыра не притягивает;
#   pull       — ускорение притяжения у края горизонта, блоков/сек за секунду; дальше слабеет (см. hole-physics);
#   max-speed  — предел скорости падения предметов в дыру, блоков/сек (у игрока свой — player-max-drift-speed).
# Вид в небе (рисует модуль spacesky шейдером неба — чёрный шар с огненным диском; на притяжение не влияет).
# Все поля необязательные, пропущенное — по умолчанию:
#   disk-tilt       — наклон диска к горизонтали, градусы: 0 — плоский, 90 — стоит ребром вверх (−90…90; 12);
#   disk-yaw        — в какую сторону опущен край диска, градусы по горизонту: 0 — к востоку (+x), 90 — к югу (+z) (0);
#   disk-size       — внешний радиус диска в горизонтах: 0 — без диска, только шар и кольцо (1.5…12; 6);
#   disk-spin       — скорость вращения диска: 0 — стоит, минус — в другую сторону (−5…5; 1);
#   disk-brightness — яркость диска и кольца (0…5; 1);
#   disk-temp       — «температура»: меньше 1 — краснее, больше — белее и голубее (0.2…3; 1).
#   Например: abyss: {x: 0.5, y: 65, z: -600, horizon: 6, disk-tilt: 20, disk-yaw: 90, disk-temp: 1.4}
# Небо рисует модуль spacesky (без него дыр в небе нет). Дыра видна в небе профиля своей карты (dimension в
# maps/<карта>/map.yml); дыры карт без профиля — в профиле space (при everywhere: true — во всех мирах без профиля).
# На ядре без патча dimension (docs/core-dimension.md) все карты — overworld, дыры — в space. Не больше 16 дыр в небе.
# /hograv hole add|remove правит этот раздел сам (комментарии внутри раздела при этом не сохраняются — пишите их тут);
# имена карт и дыр команда пишет в кавычках, чтобы «1» или «on» не стали числом/true.
black-holes:
  galaxy1:
    abyss: {x: 0.5, y: 65, z: -600, horizon: 3, reach: 100, pull: 0.5, max-speed: 4}

# Значения для /hograv hole add (и для пропущенных полей дыр выше).
hole-defaults:
  horizon: 3
  reach: 100
  pull: 0.5
  max-speed: 4

# (Старая физика.) Как притяжение слабеет с расстоянием d от центра: pull × (horizon / d) ^ falloff, но не меньше min-pull.
hole-physics:
  # 1 — мягко (вдвое дальше — вдвое слабее), 2 — как настоящая гравитация (быстро слабеет), 0 — везде как у горизонта.
  falloff: 1.0
  # Наименьшее притяжение на всём радиусе действия, блоков/сек за секунду: даже далеко от дыры всё медленно сносит к ней.
  min-pull: 0.03

# (Старая физика.) Дрейф игрока, когда он ничего не нажимает и рядом (в пределах reach) нет чёрных дыр.
drift:
  # Куда сносит (вектор, длина не важна): z -1 — на север. Все нули — дрейфа нет.
  direction: {x: 0, y: 0, z: -1}
  # Скорость дрейфа, блоков/сек. 0 — выключить (игрок без клавиш просто висит).
  speed: 0.3
  # Как быстро набирается эта скорость, блоков/сек за секунду.
  acceleration: 0.3

# (Старая физика.) Притяжение дыры для игрока без клавиш = притяжение для предметов × этот множитель (0 — дыры игрока не тянут).
player-pull-scale: 0.5
# Предел скорости, до которой дыра разгоняет игрока без клавиш, блоков/сек.
player-max-drift-speed: 0.6
# Что с игроком у горизонта: none — подтягивает к горизонту и там держит (внутрь не затягивает, тормозит заранее);
# spawn — переносит на точку появления карты (как /homap setspawn).
player-on-horizon: none

# Предметы (выброшенные вещи, ItemEntity) на картах с вакуумом. В зонах gravzones с обычной гравитацией (0.1…10)
# предметы падают с гравитацией зоны — дыры их не тянут и не поглощают.
items:
  # false — предметы падают как обычно.
  enabled: true
  # (Старая физика; при настоящей предметы не гаснут совсем, их тянут тела и дыры карты.)
  # Затухание скорости: за сколько секунд скорость падает вдвое. Больше — дольше летят; 0 — не гаснет совсем.
  drag-half-life: 30
  # Раз во сколько тиков пересчитывать скорость предметов (1–20). Меньше — точнее, больше — меньше нагрузка.
  # С тем же шагом летящему предмету шлётся позиция игрокам (иначе раз в секунду — и он летит рывками).
  update-ticks: 2
  # Край мира: сервер не двигает предмет в незагруженный чанк (чанки грузятся только вокруг игроков). Если предмет
  # туда летит и его тянет дыра — он считается упавшим в неё и исчезает (тихо, рядом никого); если дыры нет —
  # останавливается и висит у края, пока его кто-нибудь не подберёт.
  # Частицы и звук, когда дыра поглощает предмет.
  absorb-effect: true

# Вверх/вниз (пробел/Shift) — старая физика.
vertical:
  # Разгон, блоков/сек за секунду: чем больше, тем быстрее набирается скорость.
  thrust: 8.0
  # Максимальная скорость подъёма/спуска, блоков/сек.
  max-speed: 4.0
  # Торможение без клавиш: за сколько секунд вертикальная скорость падает вдвое.
  # Меньше — резче останавливается, больше — дольше «плывёт».
  stop-half-life: 0.35

# Вперёд/назад/влево/вправо (WASD) — старая физика.
horizontal:
  # Добавочный разгон к обычному «воздушному» управлению клиента, блоков/сек за секунду. 0 — только клиентское
  # управление в воздухе (оно слабое: около 4 блоков/сек, с бегом — около 5).
  thrust: 2.4
  # Выше этой скорости (блоков/сек) добавочный разгон не даётся.
  max-speed: 7.0
  # Инерция без клавиш: за сколько секунд горизонтальная скорость падает вдвое (в воздухе).
  # Обычный Minecraft — около 0,37 с; 0 — не трогать, как в обычном воздухе.
  glide-half-life: 0.8

# Урон от падения в вакууме: false — нет урона (атрибут fall_damage_multiplier = 0).
fall-damage: false

# Прыжок с земли: false — пробел на земле не подбрасывает (иначе без гравитации игрок улетел бы на десятки блоков),
# а плавно поднимает тягой.
ground-jump: false

# Подсказка в action bar, когда игрок попадает на карту с вакуумом ("" — не показывать).
enter-hint: "Невесомость: летишь по инерции. Пробел у стены — оттолкнуться, WASD/пробел/Shift — ранец, Ctrl — стоп"
