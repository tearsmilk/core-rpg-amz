# gravity — вакуум/невесомость на выбранных картах. Автор: tearsmilk.
# На такой карте игрок не падает и сам не взлетает — висит в воздухе. Пробел — плавно вверх, Shift — плавно вниз,
# WASD — в стороны; отпустил клавиши — скорость гаснет постепенно (инерция), а не обрывается, как в креативном полёте.
# Перечитать: /hograv reload (или homodule reload gravity). Включить/выключить карту: /hograv on|off <карта>.
#
# Как устроено: у игрока атрибут гравитации = 0 (клиент сам перестаёт падать), прыжок с земли отключён, а тягу
# сервер добавляет к скорости игрока небольшими толчками каждый тик. Движение считает клиент, поэтому с пингом
# ощущается как полёт на элитрах: тяга приходит с задержкой, но без рывков и откатов.

# Карты (папки в maps/), где действует вакуум. /hograv on|off правит этот список сам.
maps:
  - galaxy1

# Вверх/вниз (пробел/Shift).
vertical:
  # Разгон, блоков/сек за секунду: чем больше, тем быстрее набирается скорость.
  thrust: 8.0
  # Максимальная скорость подъёма/спуска, блоков/сек.
  max-speed: 4.0
  # Торможение без клавиш: за сколько секунд вертикальная скорость падает вдвое.
  # Меньше — резче останавливается, больше — дольше «плывёт».
  stop-half-life: 0.35

# Вперёд/назад/влево/вправо (WASD).
horizontal:
  # Добавочный разгон к обычному «воздушному» управлению клиента, блоков/сек за секунду. 0 — только клиентское
  # управление в воздухе (оно слабое: около 4 блоков/сек, с бегом — около 5).
  thrust: 2.4
  # Выше этой скорости (блоков/сек) добавочный разгон не даётся.
  max-speed: 7.0
  # Инерция без клавиш: за сколько секунд горизонтальная скорость падает вдвое (в воздухе).
  # Обычный Minecraft — около 0,37 с; 0 — не трогать, как в обычном воздухе.
  glide-half-life: 0.8

# Урон от падения в вакууме: false — нет урона (атрибут fall_damage_multiplier = 0).
fall-damage: false

# Прыжок с земли: false — пробел на земле не подбрасывает (иначе без гравитации игрок улетел бы на десятки блоков),
# а плавно поднимает тягой.
ground-jump: false

# Подсказка в action bar, когда игрок попадает на карту с вакуумом ("" — не показывать).
enter-hint: "Невесомость: пробел — вверх, Shift — вниз, WASD — в стороны"
