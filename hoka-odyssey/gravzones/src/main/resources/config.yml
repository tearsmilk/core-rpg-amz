# gravzones — зоны гравитации, выделяемые топориком. Автор: tearsmilk.
# /hozone axe — топорик: ЛКМ по блоку — точка 1, ПКМ — точка 2. /hozone create <имя> <сила> — зона из выделения.
# Сила зоны:
#   0.1 … 10 — во сколько раз гравитация сильнее обычной (0.08 блока/тик²): 0.1 — высокие плавные прыжки,
#              10 — прыжок короткий и тяжёлый. Зона главнее карты: на вакуумной карте (модуль gravity) в такой
#              зоне обычная физика с этой гравитацией.
#   11, 12, 13 — вакуумный выброс: при входе игрока подбрасывает вверх, дальше — невесомость, как на вакуумных
#              картах модуля gravity (пробел/Shift/WASD). Дробные значения между 11 и 13 тоже можно.
# Пересекающиеся зоны: действует меньшая по объёму, при равном объёме — созданная позже.
# Зоны хранятся в module/gravzones/zones.json. Перечитать этот файл: /hozone reload (или homodule reload gravzones).

# Прыжок. Чтобы в слабой гравитации прыжок был плавным, а не «выстрелом» на десятки блоков, сила прыжка
# (атрибут jump_strength) меняется вместе с гравитацией: × g^показатель. 0 — сила прыжка всегда обычная
# (при g = 0.1 — почти 7 блоков вверх), 1 — меняется так же, как гравитация.
# С этими значениями: g = 0.1 — прыжок ≈ 4.7 блока и 3.5 с в воздухе; 0.5 — 1.9 бл., 1 с; обычный — 1.25 бл., 0.6 с;
# 3 — 1 бл.; 10 — 0.9 бл. и 0.2 с (на блок уже не запрыгнуть). Точные цифры для зоны — /hozone info <имя>.
jump:
  # Показатель для слабой гравитации (g < 1).
  weak-exponent: 0.1
  # Показатель для сильной гравитации (g > 1).
  strong-exponent: 0.3

# Падение. Урон от падения считается по высоте падения, а не по скорости, поэтому сильная гравитация сама по себе
# не делает падение опаснее. (В Minestom сейчас урона от падения нет вовсе — это задел, если его включат.)
fall:
  # true — если прыжок в зоне выше обычного, во столько же раз растёт безопасная высота (safe_fall_distance),
  # чтобы приземление после своего же прыжка не ранило.
  scale-safe-distance: true
  # Множитель урона от падения в зонах 0.1…10 (1 — как обычно, 0 — без урона).
  damage-multiplier: 1.0

# Выброшенные предметы в зонах 0.1…10 падают с гравитацией зоны (на сервере; клиент может слегка поправлять
# их положение). В вакуумных зонах предметы не трогаем.
items: true

# Вакуумные зоны (сила больше 10).
vacuum:
  # Скорость выброса вверх при входе в зону, блоков/сек (дальше невесомость плавно гасит её, как отпущенный пробел).
  # Для дробной силы — между соседними значениями.
  launch-11: 12.0
  launch-12: 18.0
  launch-13: 24.0
  # Сколько секунд после выхода из зоны держится невесомость (0 — сразу обычная гравитация карты).
  linger-seconds: 3.0
  # true — прыжок (пробел) с земли внутри вакуумной зоны снова выбрасывает вверх.
  jump-launch: true
  # Не чаще раза в столько секунд.
  jump-cooldown-seconds: 1.5

# Рамки выделения и зон частицами — только у игрока с топориком в руке.
particles:
  # Раз во сколько тиков рисовать (20 тиков = 1 с).
  period-ticks: 10
  # Не больше стольких частиц за раз на игрока (на всё вместе; если рёбер много — частицы реже). 0 — не рисовать.
  max-per-player: 240
  # Рисовать только части рёбер ближе этого расстояния (блоков).
  radius: 40
  # Шаг частиц на ребре не меньше (блоков).
  min-step: 0.5
  # Размер частицы.
  size: 1.0
