# Космическое небо: шейдер неба рисует космос со всех сторон (и в пустоте снизу) вместо голубого неба.
# Общий план (тёмный фон, редкие звёзды) виден всегда и почти ничего не стоит. Млечный путь, туманности и
# звёздные скопления — только внутри областей ниже: когда игрок влетает в область, они плавно проявляются.
# Менять: /hosky add|remove (в игре) или здесь и /hosky reload. Каждое изменение пересобирает пак.
# /hosky add|remove переписывают только раздел zones (комментарии внутри него не сохраняются — пишите их над zones:),
# остальной файл и его комментарии остаются как есть.

# Где небо профилей (см. profiles ниже):
#   true  — во всех мирах с обычным небом (у Энда и Незера своё небо — их не трогает): миры без профиля — космос
#           профиля space, миры профилей (тип мира hoka:<профиль>) — свой профиль; туман дальности уходит в цвет
#           неба, солнце/луна/облака убираются прозрачными текстурами (hide-* ниже — во всех мирах, и у планет тоже).
#   false — только в мирах профилей; в остальных мирах небо, туман, облака, солнце — ванильные. Карте профиль
#           задаёт /hosky world <карта> <профиль> (ключ dimension в maps/<карта>/map.yml; нужен патч ядра
#           docs/core-dimension.md, применится при следующей загрузке карты).
#           В мире профиля закат и ванильные звёзды выключает сам тип мира, ванильные солнце и луну — шейдер.
# Погода в мирах профилей всегда ясная (модуль сам выключает дождь раз в секунду): дождь перекрашивает небо и туман,
# и небо профиля бы пропало. Не используйте BossBar с затемнением экрана там — вернётся ванильное небо.
everywhere: true

# Чёрные дыры в небе — не здесь, а в модуле gravity (black-holes в его config.yml, /hograv hole add|remove; вид —
# поля disk-*). Шейдер рисует чёрный шар, кольцо, огненный диск и искривление звёзд вокруг; дыра живёт сколько угодно
# (это картинка в небе, не сущность). Дыра видна в небе профиля СВОЕЙ КАРТЫ (dimension карты в map.yml); дыры карт
# без профиля — в профиле space (при everywhere: true — значит во всех мирах без профиля, как раньше). После
# /hograv hole add|remove|reload и смены неба карты пак пересобирается сам (через ~2 с, только если дыры изменились).
# Без модуля gravity дыр нет. Не больше 16 дыр.

# Убрать солнце, луну и облака. everywhere: true — прозрачными текстурами (во всех мирах, и у планет тоже);
# everywhere: false — ванильные солнце и луну прячет шейдер в мирах профилей-галактик (у планет — всегда: у них своё
# солнце), облака — тип мира (у галактик их нет, у планет — по clouds профиля).
hide-sun: true
hide-moon: true
hide-clouds: true

# Профили неба (не больше 16). Каждый профиль — свой тип мира "hoka:<имя>" (регистрируется при старте сервера:
# НОВЫЙ профиль появится только после перезапуска; цвета существующих меняет /hosky reload — кроме облаков: clouds,
# cloud-color и type — тоже после перезапуска, они в самом типе мира). Карта выбирает профиль:
# /hosky world <карта> <профиль> (dimension: "hoka:<профиль>" в maps/<карта>/map.yml). /hosky profiles — список.
# Шейдер узнаёт профиль по служебному цвету тумана мира (МЕТКЕ) — без ресурспака небо такого мира тёмно-зелёное.
# Имя — a-z, 0-9, _. Цвета — "#RRGGBB". Все поля необязательны (по умолчанию — как у space или земное небо).
#
#   type: galaxy — космос:
#     background, background-top — фон у горизонта и к зениту (очень тёмные цвета; по умолчанию как space)
#     stars — плотность звёзд (1 — как space, 0 — нет, до 3); star-brightness — яркость (1); star-tint — оттенок
#     milky-way — показывать области milky_way (true/false); nebula — цвет туманностей (областей nebula без color)
#     water-fog — туман под водой
#     Параллакс — ощущение полёта: фон, звёзды фона и Млечный путь на бесконечности стоят, а ближний космос вокруг
#     игрока — настоящие точки в мире (проход звёзд клиента, шейдер stars.vsh): при полёте ближние звёзды расходятся
#     от точки, куда летишь, сбоку уходят назад, пыль пролетает мимо; туманности медленно сдвигаются.
#     parallax — сила (1; 0 — частиц нет, 0.25–4): частицы лежат в повторяющихся плитках 256 / parallax (звёзды) и
#       24 / parallax (пыль) блоков — больше значение, ближе частицы и заметнее движение
#     near-stars — ближние звёзды (1; 0 — нет, до 2): доля из запаса (~440 точек; в звёздных скоплениях — больше) и яркость
#     dust — космическая пыль (1; 0 — нет, до 2): мелкие тусклые точки в 1–12 блоках
#     nebula-distance — даль туманностей областей, блоки (3000; 0 — на бесконечности, как раньше)
#     Частицы — в мирах профилей-галактик (тип мира hoka:<профиль>) и при everywhere: true в мирах без профиля (на ядре
#     без патча это все карты) — частицы профиля space: для этого модуль при старте сервера включает проход звёзд
#     типа мира minecraft:overworld всегда и без поворота по времени суток (смена everywhere — после перезапуска).
#     Включить, выключить, поменять параметры — /hosky reload.
#     Области (zones ниже) с profile: <имя> видны только в этом профиле, без profile — во всех галактиках.
#   type: planet — атмосфера (небо целиком рисует шейдер по времени суток; сутки — 24000 тиков, как в ванили):
#     zenith, horizon — небо днём; zenith-night, horizon-night — ночью; sunset — цвет заката у солнца
#     sun — цвет солнца; sun-size — угловой радиус солнца, градусы (3 — примерно как ванильное)
#     clouds — облака (true/false); cloud-color — их цвет днём (ночью темнее)
#     fog, fog-night — туман днём/ночью (по умолчанию = horizon / horizon-night); haze — дальность дымки
#       (блоки; 0 — без дымки, только туман края прорисовки); water-fog — туман под водой
#     stars, star-brightness, star-tint — звёзды ночью (сквозь атмосферу, у горизонта гаснут)
#     moon: соседняя планета/луна на небе — size (угловой радиус, градусы; 0 — нет), color, yaw (направление по
#       горизонту, градусы: 0 — восток +x, 90 — юг +z), pitch (высота над горизонтом); фаза — от положения солнца
profiles:
  space:                  # профиль по умолчанию (hoka:space) — космос как раньше (параллакс — по умолчанию)
    type: galaxy
  galaxy1:                # фиолетовая галактика: фон с фиолетовым оттенком, звёзд гуще, своя туманность galaxy1_glow
    type: galaxy
    background: "#07040E"
    background-top: "#100828"
    stars: 1.3
    star-tint: "#E8DCFF"
    nebula: "#B060FF"
    parallax: 1.2         # частицы чуть ближе — полёт заметнее
    dust: 1.3
  andromeda:              # тёплые и голубые звёзды гуще, без Млечного пути, голубая туманность
    type: galaxy
    background: "#030206"
    background-top: "#05040C"
    stars: 1.8
    star-brightness: 1.2
    star-tint: "#FFE2C4"
    milky-way: false
    nebula: "#3C9CFF"
    near-stars: 1.4       # ближних звёзд больше, пыли меньше
    dust: 0.7
    nebula-distance: 2000
  mars:                   # рыжая атмосфера, голубоватый закат, маленькое солнце, без облаков
    type: planet
    zenith: "#B0704A"
    horizon: "#D9A47C"
    zenith-night: "#050306"
    horizon-night: "#140C0C"
    sunset: "#6FA8FF"
    sun: "#F4F0FF"
    sun-size: 1.6
    clouds: false
    haze: 600
    stars: 1.3
  ocean:                  # бирюзовое небо, большое тёплое солнце, облака, вторая планета на небе
    type: planet
    zenith: "#1FA2B8"
    horizon: "#9FEADD"
    zenith-night: "#020A10"
    horizon-night: "#06202A"
    sunset: "#FF9A55"
    sun: "#FFD08A"
    sun-size: 5
    clouds: true
    cloud-color: "#F2FFFC"
    moon:
      size: 7
      color: "#E8C9A0"
      yaw: 200
      pitch: 35

# Области (не больше 32). Имя — a-z, 0-9, _.
#   type: milky_way (Млечный путь), nebula (туманность, цвет color — по умолчанию nebula профиля), stars (звёздное
#   скопление); x, z: центр (блоки); radius: радиус (блоки); fade: доля радиуса у края, где картинка плавно
#   проявляется (0–1); profile: профиль-галактика, где видна область (без него — во всех галактиках)
# andromeda_glow и galaxy1_glow — туманности только своего профиля; без color — цвет nebula профиля.
# /hosky add|remove переписывают этот раздел целиком — комментарии пишите здесь, над zones:.
zones:
  milky_way_home:
    type: milky_way
    x: 0
    z: 0
    radius: 1500
    fade: 0.3
  violet_nebula:
    type: nebula
    x: 4000
    z: 0
    radius: 2000
    fade: 0.3
    color: "#B060FF"
  cluster:
    type: stars
    x: -3000
    z: 2500
    radius: 1500
    fade: 0.3
  andromeda_glow:
    type: nebula
    x: 0
    z: 0
    radius: 3000
    fade: 0.4
    profile: andromeda
  galaxy1_glow:
    type: nebula
    x: 0
    z: 0
    radius: 2500
    fade: 0.4
    profile: galaxy1
