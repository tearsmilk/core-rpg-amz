# Космическое небо: шейдер неба рисует космос со всех сторон (и в пустоте снизу) вместо голубого неба.
# Действует на клиенте во всех мирах с обычным небом (у Энда и Незера своё небо — их не трогает).
# Общий план (тёмный фон, редкие звёзды) виден всегда и почти ничего не стоит. Млечный путь, туманности и
# звёздные скопления — только внутри областей ниже: когда игрок влетает в область, они плавно проявляются.
# Менять: /hosky add|remove (в игре) или здесь и /hosky reload. Каждое изменение пересобирает пак.
# (Сохранение через /hosky перезаписывает этот файл — комментарии пропадут, это нормально.)

# Убрать солнце, луну и облака (заменить их текстуры прозрачными).
hide-sun: true
hide-moon: true
hide-clouds: true

# Области (не больше 32). Имя — a-z, 0-9, _.
#   type: milky_way (Млечный путь), nebula (туманность, цвет color), stars (звёздное скопление)
#   x, z: центр (блоки); radius: радиус (блоки); fade: доля радиуса у края, где картинка плавно проявляется (0–1)
zones:
  milky_way_home:
    type: milky_way
    x: 0
    z: 0
    radius: 1500
    fade: 0.3
  violet_nebula:
    type: nebula
    x: 4000
    z: 0
    radius: 2000
    fade: 0.3
    color: "#B060FF"
  cluster:
    type: stars
    x: -3000
    z: 2500
    radius: 1500
    fade: 0.3
