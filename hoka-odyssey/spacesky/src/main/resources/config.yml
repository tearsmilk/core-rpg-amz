# Космическое небо: шейдер неба рисует космос со всех сторон (и в пустоте снизу) вместо голубого неба.
# Общий план (тёмный фон, редкие звёзды) виден всегда и почти ничего не стоит. Млечный путь, туманности и
# звёздные скопления — только внутри областей ниже: когда игрок влетает в область, они плавно проявляются.
# Менять: /hosky add|remove (в игре) или здесь и /hosky reload. Каждое изменение пересобирает пак.
# (Сохранение через /hosky перезаписывает этот файл — комментарии пропадут, это нормально.)

# Где космос:
#   true  — во всех мирах с обычным небом (у Энда и Незера своё небо — их не трогает); туман дальности уходит
#           в цвет космоса, солнце/луна/облака убираются прозрачными текстурами (hide-* ниже).
#   false — только в мирах типа "hoka:space" (модуль регистрирует его при старте сервера). Карте его задаёт
#           /hosky world on <карта> (ключ dimension в maps/<карта>/map.yml; нужен патч ядра docs/core-dimension.md,
#           применится при следующей загрузке карты). В остальных мирах небо, туман, облака, солнце — ванильные.
#           В космическом мире облака, закат и ванильные звёзды выключает сам тип мира, солнце и луну — шейдер.
#           Погода на картах hoka:space всегда ясная (модуль сам выключает дождь раз в секунду): дождь перекрашивает
#           небо и туман, и космос бы пропал. Не используйте BossBar с затемнением экрана в космосе — вернутся солнце и луна.
everywhere: true

# Убрать солнце, луну и облака. everywhere: true — прозрачными текстурами (во всех мирах);
# everywhere: false — солнце и луну прячет шейдер только в мирах hoka:space (облаков там нет всегда).
hide-sun: true
hide-moon: true
hide-clouds: true

# Области (не больше 32). Имя — a-z, 0-9, _.
#   type: milky_way (Млечный путь), nebula (туманность, цвет color), stars (звёздное скопление)
#   x, z: центр (блоки); radius: радиус (блоки); fade: доля радиуса у края, где картинка плавно проявляется (0–1)
zones:
  milky_way_home:
    type: milky_way
    x: 0
    z: 0
    radius: 1500
    fade: 0.3
  violet_nebula:
    type: nebula
    x: 4000
    z: 0
    radius: 2000
    fade: 0.3
    color: "#B060FF"
  cluster:
    type: stars
    x: -3000
    z: 2500
    radius: 1500
    fade: 0.3
