# Космическое небо: шейдер неба (sky.fsh) рисует звёзды, туманности и Млечный путь вместо голубого неба.
# Действует на клиенте во всех мирах с обычным небом (у Энда и Незера своё небо — их не трогает).
# После правки: homodule reload spacesky (пак пересоберётся и уйдёт игрокам).

# Убрать солнце, луну и облака (заменить их текстуры прозрачными).
hide-sun: true
hide-moon: true
hide-clouds: true
