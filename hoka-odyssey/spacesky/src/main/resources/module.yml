# Описание модуля. Обязательны id и main.
id: spacesky
name: Космическое небо
version: 0.4.0
main: ink.hoka.odyssey.spacesky.SpaceSkyModule
authors: [tearsmilk]
description: "Небо шейдером в ресурспаке — профили неба по мирам (галактики: звёзды, туманности, Млечный путь, чёрные дыры из gravity; планеты: атмосфера, сутки, солнце, облака, луна), у каждого свой тип мира hoka:<профиль>; во всех мирах или только в мирах профилей"
depends: [respack]                   # шейдер неба кладётся в общий ресурспак через ResourcePackApi
softdepends: [gravity]               # чёрные дыры в небе — из сервиса BlackHoles модуля gravity (без него дыр нет)
