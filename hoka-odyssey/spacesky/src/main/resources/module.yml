# Описание модуля. Обязательны id и main.
id: spacesky
name: Космическое небо
version: 0.3.0
main: ink.hoka.odyssey.spacesky.SpaceSkyModule
authors: [tearsmilk]
description: Космическое небо (звёзды, туманности, Млечный путь, чёрные дыры из gravity) шейдером в ресурспаке — во всех мирах или только в мирах типа hoka:space (модуль его регистрирует)
depends: [respack]                   # шейдер неба кладётся в общий ресурспак через ResourcePackApi
softdepends: [gravity]               # чёрные дыры в небе — из сервиса BlackHoles модуля gravity (без него дыр нет)
