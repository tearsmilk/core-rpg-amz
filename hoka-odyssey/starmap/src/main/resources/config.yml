# starmap — данные для карты-радара. Сама карта — клиентский модуль starmap (клавиша M у игрока с модом).
# Пока у игрока открыта карта, сервер ~2 раза в секунду шлёт ему корабли и игроков на той же карте (мире).
# Перечитать: homodule reload starmap.

# Как часто слать данные открытой карте, тиков (20 тиков = 1 секунда). 10 — два раза в секунду.
period-ticks: 10

# Игроки на той же карте — не дальше этого расстояния от игрока, блоков (по горизонтали и вертикали вместе).
player-radius: 2000

# Корабли на той же карте — не дальше этого расстояния, блоков. 0 — все корабли карты.
ship-radius: 0

# Показывать ли на карте других игроков (false — только корабли и свои точки).
show-players: true

# Показывать ли корабли из модуля ships (если модуля нет — кораблей просто не будет).
show-ships: true

# Показывать ли спрятанные корабли (призванные «в кармане», не стоящие в мире). Обычно false: их негде рисовать.
show-stowed: false

# Не больше стольких кораблей и игроков в одном сообщении (ближние — первыми).
max-contacts: 256

# Клиент, открывший карту, напоминает о себе раз в 5 секунд. Не было напоминания столько секунд — карта считается
# закрытой (клиент вылетел, модуль выгрузился).
open-timeout-seconds: 15
