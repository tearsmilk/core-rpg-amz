# oxygen — в космосе нет воздуха. На картах из списка maps у игрока без скафандра кончается кислород:
# показывается обычная шкала пузырьков (как под водой), она убывает, а когда кончилась — урон как от утопления.
# Надел скафандр или ушёл на обычную карту — воздух быстро восстанавливается (как в ванили, вынырнув из воды).
# Перечитать настройки: homodule reload oxygen. Выдать скафандр: /hosuit [ник] (только OP).
#
# Скафандр — блок стекла, надевается на голову вместо шлема: ПКМ с ним в руке (в воздух или по блоку — как блок
# он не ставится) или положить в слот шлема в инвентаре. Модуль узнаёт его по метке в предмете — обычное стекло
# на голове не помогает. Креатив и наблюдатель урона не получают.

# Карты (папки в maps/), где нет воздуха.
maps:
  - galaxy1

air:
  # На сколько секунд хватает воздуха без скафандра (полная шкала — 10 пузырьков). В ванили под водой — 15.
  supply-seconds: 15
  # За сколько секунд шкала восстанавливается с нуля до полной (в скафандре или на обычной карте). В ванили — 3.75.
  refill-seconds: 3.75

damage:
  # Урон, когда воздух кончился, в единицах здоровья (2 = одно сердце). В ванили при утоплении — 2; у нас 4 —
  # в вакууме задыхаешься быстрее, чем под водой (два сердца в секунду).
  amount: 4.0
  # Раз во сколько секунд бьёт этот урон. В ванили — 1 (то есть одно сердце в секунду).
  interval-seconds: 1.0

# Показывать ли убывающие пузырьки в креативе (урона в креативе нет в любом случае). В наблюдателе — никогда.
creative-bubbles: false

warning:
  # Предупреждение в action bar на карте без воздуха, пока на голове нет скафандра ("" — не показывать).
  # Показывается только тем, кому воздух может навредить (выживание и приключение).
  text: "&cЗдесь нет воздуха! Наденьте скафандр"
  # Раз во сколько секунд повторять (не чаще, чтобы не спамить).
  interval-seconds: 1.0

# Предмет «Скафандр» (/hosuit). Цвета — через &: &b голубой, &7 серый, &f белый и т.п.
# Название и описание ставятся новым скафандрам; уже выданные узнаются по метке, а не по тексту.
suit:
  name: "&bСкафандр"
  lore:
    - "&7Наденьте на голову вместо шлема:"
    - "&7ПКМ с ним в руке или в слот шлема."
    - "&7Даёт воздух там, где его нет."
