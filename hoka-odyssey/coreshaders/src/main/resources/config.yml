# coreshaders — «окна в другой мир»: куб или плоскость, в которых видна панорама 360°. Автор: tearsmilk.
# Перечитать: /hocs reload (или homodule reload coreshaders). Эффекты хранятся в module/coreshaders/effects/<карта>.json.

# Картинки: должны быть в паке (coreshaders:cube_<картинка>, coreshaders:plane_<картинка>). Свои картинки модуль
# дописывает сюда сам (/hocs upload, /hocs import).
images:
  - sky_sea
  - space
  - nether
  - aurora
  - end
  - sunset
  - volcano
  - hell_end
  - heaven
  - walk
  - rain
  - sea_sand

# Названия картинок для сообщений и описания жезла.
image-names:
  sky_sea: "Небо и море"
  space: "Космос"
  nether: "Незер"
  aurora: "Северное сияние"
  end: "Энд"
  sunset: "Закат"
  volcano: "Вулкан"
  hell_end: "Ад и Энд"
  heaven: "Рай"
  walk: "Прогулка"
  rain: "Дождь"
  sea_sand: "Море и песок"

defaults:
  shape: cube
  image: sky_sea
  color: "#FFFFFF"

# Дальность луча для команд и ЛКМ жезлом (в блоках).
max-distance: 8.0

# Отступ плоскости от грани блока (в блоках), чтобы не было мерцания.
plane-offset: 0.015

# Светящийся обод по краям граней и рамка вокруг плоскости. По умолчанию выключен: окна без линий, соседние кубы и
# плоскости сливаются в одну поверхность. Для эффекта: /hocs rim on|off [group]. Включённый обод рисуется только
# по внешнему краю группы соседних эффектов.
rim: false

# Яркость дисплеев (0–15). Шейдер светится сам, это влияет только на клиентов без пака.
brightness: 15

# Команды на эффектах (порталы, варпы).
commands:
  # Триггер по умолчанию при первой команде: enter (вошёл в блок эффекта), click (ПКМ без жезла), both.
  default-trigger: enter
  # Пауза между срабатываниями для игрока, секунды (защита от петель телепорта). /hocs cooldown меняет у эффекта.
  default-cooldown: 2.0
  # Максимум эффектов в группе (флаг group — все соседние эффекты, например стена портала).
  max-group: 1024

# Свои картинки: /hocs upload <имя> <https-ссылка>, /hocs import <имя> (файл module/coreshaders/images/<имя>.png|jpg|gif).
# Файлы пака пишутся в module/coreshaders/pack/ и передаются модулю respack, он пересобирает и рассылает пак.
custom-images:
  # Сколько своих картинок можно добавить (картинка — спрайт 1024x512 в атласе, 2 МБ видеопамяти).
  max: 24
  # Предел размера файла (МБ) и картинки (мегапиксели).
  max-download-mb: 16
  max-megapixels: 40
  timeout-seconds: 20
  # Номера картинок для шейдера (33–200). Заполняет модуль, руками не менять.
  kinds: {}
  # Анимированные GIF: кадры превращаются в панорамы и идут столбиком в одном PNG с .png.mcmeta.
  animation:
    # Не больше стольких кадров (время сохраняется: кадры прореживаются, frametime подбирается).
    max-frames: 32
    # Ширина кадра: 256, 512 или 1024 (высота — половина). Другие числа округляются до ближайшего.
    width: 512
    # Плавный переход между кадрами (interpolate в mcmeta).
    interpolate: false
    # Предел одной анимации в памяти клиента (ширина x высота x кадры x 4 байта), МБ.
    max-texture-mb: 16
    # Предел всех своих анимаций вместе в памяти клиента, МБ.
    total-texture-mb: 96
    # Предел размера PNG одной анимации в паке, МБ.
    max-file-mb: 8
    # Сколько кадров может быть в исходном GIF.
    max-source-frames: 1000

# Именованные цвета для /hocs color и /hocs give. Можно добавлять свои: имя: "#RRGGBB".
