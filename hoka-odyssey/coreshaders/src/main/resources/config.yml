  white: "#FFFFFF"
  red: "#FF5050"
  orange: "#FFA040"
  yellow: "#FFE060"
  green: "#70FF70"
  cyan: "#60FFFF"
  blue: "#6080FF"
  purple: "#C070FF"
  pink: "#FF80C0"
  gray: "#A0A0A0"
  dark: "#505050"
  белый: "#FFFFFF"
  красный: "#FF5050"
  оранжевый: "#FFA040"
  жёлтый: "#FFE060"
  желтый: "#FFE060"
  зелёный: "#70FF70"
  зеленый: "#70FF70"
  голубой: "#60FFFF"
  синий: "#6080FF"
  фиолетовый: "#C070FF"
  розовый: "#FF80C0"
  серый: "#A0A0A0"
  тёмный: "#505050"

