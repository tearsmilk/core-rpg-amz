# items — выбрасывание и подбор предметов как в обычном Minecraft (в Minestom из коробки этого нет).
# Q — выкинуть 1 предмет из руки, Ctrl+Q — весь стак, предмет курсором за окно инвентаря (ЛКМ — всё, ПКМ — 1),
# Q/Ctrl+Q над слотом в открытом инвентаре, выброс из креативного меню. Предмет вылетает из глаз игрока вперёд
# по взгляду. Подбор: подошёл к предмету — он в инвентаре; если места мало — берётся сколько влезает, остальное
# остаётся лежать. Наблюдатель (spectator) не подбирает.
#
# Лежащие предметы — обычные сущности ItemEntity: на них действует физика мира (в вакууме — модуль gravity).
# ВАЖНО: при выключении/перезагрузке модуля (homodule reload items, остановка сервера) все выброшенные через него
# предметы исчезают — модуль убирает созданные им сущности (правило проекта). Minestom сущности и так не сохраняет.
# Перечитать настройки: homodule reload items.

# Через сколько секунд выброшенный предмет можно подобрать (в ванили 2). Задержка общая для всех игроков —
# в ванили так же: только что выкинутый предмет сразу не поднять.
pickup-delay-seconds: 2.0

# Через сколько секунд лежащий предмет исчезает (в ванили 300 = 5 минут). 0 — никогда.
# Предмет, упавший ниже дна мира больше чем на 64 блока, удаляется всегда (как в ванили).
despawn-seconds: 300
# Карты (папки в maps/), где предметы НЕ исчезают по времени: в космосе они дрейфуют, пока их не поглотит
# чёрная дыра (или пока не уйдут ниже дна мира). На остальных картах действует despawn-seconds.
no-despawn-maps:
  - galaxy1

# Слияние одинаковых лежащих рядом предметов в одну стопку (как в ванили).
merge: true
# Радиус слияния, блоков: предметы ближе этого расстояния сливаются (в ванили — квадрат примерно ±0,75 по горизонтали).
merge-range: 1.0

# Скорость броска вперёд, блоков/тик (в ванили 0,3 — брошенный по горизонтали предмет пролетает около 3–4 блоков).
throw-speed: 0.3
# Небольшой случайный разброс броска, как в ванили (false — всегда точно по взгляду).
spread: true
