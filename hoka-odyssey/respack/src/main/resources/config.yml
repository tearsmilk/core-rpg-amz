# Ресурспак Hoka Odyssey. Пак собирается из файлов модулей (сервис ResourcePackApi) и папки module/respack/pack/
# (свои файлы администратора — кладутся поверх всего, например pack.png или свой pack.mcmeta).
# После правки: /hopack reload (перечитать конфиг и пересобрать) или homodule reload respack.

http:
  # Порт встроенного HTTP-сервера, с которого клиенты скачивают пак. Его нужно открыть на хосте
  # (в Pterodactyl — добавить порт в Network/Allocations сервера).
  port: 25574
  # На каком адресе слушать (0.0.0.0 — на всех).
  bind: "0.0.0.0"
  # Адрес пака для клиентов, без / в конце, например: "http://2.152.87.39:25574".
  # Пусто — адрес, по которому игрок зашёл на сервер, и порт выше (обычно подходит, если порт открыт на том же IP).
  public-url: ""

# Описание пака (pack.mcmeta) — видно в меню ресурспаков.
description: "Hoka Odyssey"

# Отправлять пак при входе (до появления в мире — как в ванили: игрок ждёт загрузки пака).
send-on-join: true
# Обязательный пак: клиент показывает «требуется», без него игрок не войдёт.
required: true
# Текст в окне запроса пака (& — цвета).
prompt: "&bРесурспак Hoka Odyssey&7: модели, шейдеры и интерфейс."

# Кикать, если игрок отказался от пака.
kick-on-decline: true
kick-message-decline: "&cБез ресурспака играть нельзя.\n&7Включите «Ресурспаки сервера: Включены» в настройках сервера и зайдите снова."
# Кикать, если пак не скачался или не применился (сеть, неверный адрес). Обычно выключено: игрок войдёт без пака.
kick-on-fail: false
kick-message-fail: "&cРесурспак не загрузился.\n&7Попробуйте зайти ещё раз."

# Сколько секунд ждать первую сборку пака при входе игрока (если сервер только что запустился).
wait-build-seconds: 15
# После пересборки сразу отправить новый пак всем, кто онлайн (если содержимое изменилось).
resend-on-rebuild: true
