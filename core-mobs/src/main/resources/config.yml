# core-mobs — общие настройки. Мобы — в mobs.yml, регионы — в regions.yml, лут — в папке drops/.
# После правки: /mobs reload (или amazake system reload core-mobs).

messages:
  prefix: "<dark_gray>[<green>CoreMobs</green>]</dark_gray> "

# Топорик региона (/mobs wand). Узнаётся по скрытой метке, а не по материалу: обычный золотой топор не сработает.
# Деревянный не берите — на нём висит топорик WorldEdit.
wand:
  material: GOLDEN_AXE
  name: "<green>Топорик региона</green>"
  lore:
    - "<gray>ЛКМ по блоку — поставить точку</gray>"
    - "<gray>ПКМ по блоку — убрать последнюю точку</gray>"
    - "<gray>Shift + ПКМ — сбросить выделение</gray>"
    - "<gray>/mobs region create <имя> — создать регион</gray>"

selection:
  # Сколько точек может быть в одном полигоне.
  max-points: 256

regions:
  # Высота нового региона: от самой низкой точки до самой высокой + столько блоков вверх.
  # Потом можно поменять: /mobs region expand <имя> up|down <блоков>.
  default-height: 5
  # Радиус деспавна нового региона: моб, отошедший от границы дальше этого, пропадает. -1 — не следить.
  default-despawn-radius: 5

# Частицы, пока в руке топорик: своё выделение и регионы рядом. Видит только сам игрок.
# Нижняя линия идёт по высоте поставленных точек, на вершинах — столбики до потолка региона.
particles:
  # Как часто обновлять, тиков. Чем чаще, тем ровнее (частица живёт ~10 тиков).
  interval-ticks: 4
  # Расстояние между частицами на контуре, блоков.
  spacing: 0.5
  # Дальше этого от игрока частицы не рисуются.
  view-distance: 48
  # Предел частиц за один раз (на большие регионы).
  max-per-draw: 1500
  size: 1.2
  region-color: "#00C853"
  selection-color: "#76FF03"
  vertex-color: "#FFFFFF"

# Контур региона для всех игроков: /mobs region show <имя> (ещё раз — убрать у всех).
# Рисуется тонкими линиями из блок-дисплеев: они стоят на месте и не мерцают.
display:
  # Блок, из которого сделана линия.
  block: LIME_CONCRETE
  # Толщина линии, блоков.
  thickness: 0.06
  # Свечение (контур виден сквозь блоки) и его цвет.
  glow: false
  glow-color: "#00C853"
  # Дальность прорисовки: 1.0 = 64 блока.
  view-range: 2.0
  # Длинные рёбра режутся на куски не длиннее этого (по куску на сущность).
  segment-length: 8
  # Столбики на вершинах от точки до потолка региона.
  posts: true

# Миры без ванильных мобов: /mobs world disable|enable <мир>, список — /mobs world list.
worlds:
  # Какие причины спавна пропускать в таких мирах. Мобы core-mobs проходят всегда.
  # CUSTOM — мобы других плагинов (MythicMobs и т. п.), COMMAND — /summon.
  # Все причины: NATURAL, SPAWNER, SPAWNER_EGG, BREEDING, CHUNK_GEN, REINFORCEMENTS, PATROL, RAID, ...
  allowed-spawn-reasons: [CUSTOM, COMMAND]
  # При выключении и при загрузке чанков убирать уже живых ванильных мобов.
  # Прирученных, с именем от бирки и на поводке не трогаем.
  remove-existing: true

spawning:
  # Как часто проверяются регионы (спавн и радиус деспавна), тиков. 20 = секунда.
  check-interval-ticks: 20

mobs:
  # Имя над мобом, у которого show-health: true. <name> — name моба, <health>/<max_health> — здоровье.
  name-format: "<name> <red>❤ <health>/<max_health></red>"
  # При включении системы мобы регионов вокруг игроков берутся на учёт в этом радиусе.
  adopt-radius: 128
