### AZERUS HUD - slate blue + gold. Generated by mythichud-azerus/tools/gen_yaml.py (edit there).
### Textures: source-pack/assets/mythichud/textures/assets/azerus/*.png (tools/gen_textures.py).

# =====================================================================================
#  AZERUS HUD (slate + gold) - top-left player panel: head portrait + currencies
# =====================================================================================
azerus_player:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    coin_value:  # plain balance (default)
      conditions:
        - placeholder{ph=%deluxemenus_meta_currency_BOOLEAN%;v=true;o==} false hide
      text: "<#ffd25a>%vault_eco_balance_fixed%"
      font: "mmohud-font"
      align: right
      offset:
        x: 55
        y: -5
    coin_value_formatted:  # formatted balance - same /menu toggle as the old HUD
      conditions:
        - placeholder{ph=%deluxemenus_meta_currency_BOOLEAN%;v=true;o==} true hide
      text: "<#ffd25a>%vault_eco_balance_formatted%"
      font: "mmohud-font"
      align: right
      offset:
        x: 55
        y: -5
    gem_value:  # 2nd currency: shown only while the placeholder returns a number (see GEMS in tools/gen_yaml.py)
      conditions:
        - placeholder{ph=%azerus_gems%;v=0;o=>=} true hide
      text: "<#cdb8ff>%azerus_gems%"
      font: "mmohud-font"
      align: right
      offset:
        x: 129
        y: -5
    gem_value_none:
      conditions:
        - placeholder{ph=%azerus_gems%;v=0;o=>=} false hide
      text: "<#5d7690>-"
      font: "mmohud-font"
      align: right
      offset:
        x: 129
        y: -5
    coin_icon:
      texture:
        path: assets/azerus/icon_coin.png
      offset:
        x: 44
        y: -4
    gem_icon:
      texture:
        path: assets/azerus/icon_gem.png
      offset:
        x: 118
        y: -4
    head:  # player's face (8x8 skin pixels x3 = 24x24), MythicHUD head layer
      head:
        size: 3
      offset:
        x: 7
        y: -8
    portrait:
      texture:
        path: assets/azerus/portrait_frame.png
      offset:
        x: 0
        y: -1
    panel:
      texture:
        path: assets/azerus/player_panel.png
      offset:
        x: 40
        y: 0

# top-left: MMOCore level / exp bar (listener mmoexp = %mmocore_experience% / %mmocore_next_level%)
azerus_player_xp:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    label:
      text: "MMO LV.%mmocore_level% : %math_1_{mmocore_experience}*100/{mmocore_next_level}%%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 120
        y: -18
    icon:
      texture:
        path: assets/azerus/icon_gem_green.png
      offset:
        x: 44
        y: -16
    fill:
      texture:
        path: assets/azerus/fill_wide_xp.png
      offset:
        x: 55
        y: -17
      function:
        listener: mmoexp
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame_wide.png
      offset:
        x: 54
        y: -16

# top-left: mana bar "MP.cur/max" (listener mana = %mmocore_mana% / %mmocore_stat_max_mana%);
# classes whose MMOCore resource is called 'Энергия' get the gold "EN." variant (same condition as the old HUD)
azerus_player_mana:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    label_mana:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} false hide
      text: "MP.%fill-value%/%fill-max%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 120
        y: -30
    label_energy:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} true hide
      text: "EN.%fill-value%/%fill-max%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 120
        y: -30
    icon_mana:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} false hide
      texture:
        path: assets/azerus/icon_potion.png
      offset:
        x: 44
        y: -28
    icon_energy:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} true hide
      texture:
        path: assets/azerus/icon_potion_energy.png
      offset:
        x: 44
        y: -28
    fill_energy:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} true hide
      texture:
        path: assets/azerus/fill_wide_energy.png
      offset:
        x: 55
        y: -29
      function:
        listener: mana
        increment: 65
        orientation: horizontal
    fill_mana:
      conditions:
        - placeholder{ph=%mmocore_mana_name%;v=Энергия} false hide
      texture:
        path: assets/azerus/fill_wide_mana.png
      offset:
        x: 55
        y: -29
      function:
        listener: mana
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame_wide.png
      offset:
        x: 54
        y: -28

# top-centre: compass + world name + block coordinates
azerus_location:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    text:
      text: "<#ffd25a>%player_world%<#5d7690> | <#dce6ef>%player_x% <#5d7690>/<#dce6ef> %player_y% <#5d7690>/<#dce6ef> %player_z%"
      font: "mmohud-font"
      align: center
      offset:
        x: 86
        y: -4
    icon:
      texture:
        path: assets/azerus/icon_compass.png
      offset:
        x: 3
        y: -2
    panel:
      texture:
        path: assets/azerus/location_panel.png
      offset:
        x: 0
        y: 0

# bottom-left plate (armor + health bars sit on it)
azerus_panel_left:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    panel:
      texture:
        path: assets/azerus/bottom_panel.png
      offset:
        x: 0
        y: 0

# bottom-right plate (mana/energy + hunger bars sit on it)
azerus_panel_right:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    panel:
      texture:
        path: assets/azerus/bottom_panel.png
      offset:
        x: 0
        y: 0

# bottom-left, upper bar: armor (listener armor40 = %mmocore_stat_armor% / 40)
azerus_armor:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    value:
      text: "%fill-value%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 45
        y: -2
    icon:
      texture:
        path: assets/azerus/icon_armor.png
      offset:
        x: 2
        y: -1
    fill:
      texture:
        path: assets/azerus/fill_armor.png
      offset:
        x: 13
        y: -3
      function:
        listener: armor40
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame.png
      offset:
        x: 12
        y: -2

# bottom-left, lower bar: health. Status variants (burning / freezing / poison / wither / absorption) use the
# same conditions and placeholders as the old Volya HUD; the first visible layer in the list wins.
azerus_health:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    value:
      text: "%player_health_rounded%/%player_max_health_rounded%"
      font: "mmohud-font-outline"
      align: ['placeholder{ph=%player_absorption%;v=0;o=>} false hide']
      offset:
        x: 45
        y: -10
    value_absorption:
      text: "<#ffe066>%math_0_{player_health_rounded}+{player_absorption}%<white>/%player_max_health_rounded%"
      font: "mmohud-font-outline"
      align: ['placeholder{ph=%player_absorption%;v=0;o=>} true hide']
      offset:
        x: 45
        y: -10
    icon_absorption:
      conditions:
        - placeholder{ph=%player_absorption%;v=0;o=>} true hide
      texture:
        path: assets/azerus/icon_heart_absorb.png
      offset:
        x: 2
        y: -9
    icon_burning:
      conditions:
        - placeholder{ph=%player-j17_is_burning%;v=yes} true hide
      texture:
        path: assets/azerus/icon_heart_burning.png
      offset:
        x: 2
        y: -9
    icon_freezing:
      conditions:
        - placeholder{ph=%player-j17_is_freezing%;v=yes} true hide
      texture:
        path: assets/azerus/icon_heart_frozen.png
      offset:
        x: 2
        y: -9
    icon_poison:
      conditions:
        - effect{e=poison} true hide
      texture:
        path: assets/azerus/icon_heart_poison.png
      offset:
        x: 2
        y: -9
    icon_wither:
      conditions:
        - effect{e=wither} true hide
      texture:
        path: assets/azerus/icon_heart_wither.png
      offset:
        x: 2
        y: -9
    icon:
      texture:
        path: assets/azerus/icon_heart.png
      offset:
        x: 2
        y: -9
    fill_absorption:  # gold 2px strip on top of the bar = absorption / max health
      conditions:
        - placeholder{ph=%player_absorption%;v=0;o=>} true hide
      texture:
        path: assets/azerus/fill_absorb_strip.png
      offset:
        x: 13
        y: -11
      function:
        listener: absorption
        increment: 65
        orientation: horizontal
    fill_burning:
      conditions:
        - placeholder{ph=%player-j17_is_burning%;v=yes} true hide
      texture:
        path: assets/azerus/fill_burning.png
      offset:
        x: 13
        y: -11
      function:
        listener: health
        increment: 65
        orientation: horizontal
    fill_freezing:
      conditions:
        - placeholder{ph=%player-j17_is_freezing%;v=yes} true hide
      texture:
        path: assets/azerus/fill_frozen.png
      offset:
        x: 13
        y: -11
      function:
        listener: health
        increment: 65
        orientation: horizontal
    fill_poison:
      conditions:
        - effect{e=poison} true hide
      texture:
        path: assets/azerus/fill_poison.png
      offset:
        x: 13
        y: -11
      function:
        listener: health
        increment: 65
        orientation: horizontal
    fill_wither:
      conditions:
        - effect{e=wither} true hide
      texture:
        path: assets/azerus/fill_wither.png
      offset:
        x: 13
        y: -11
      function:
        listener: health
        increment: 65
        orientation: horizontal
    fill:
      texture:
        path: assets/azerus/fill_health.png
      offset:
        x: 13
        y: -11
      function:
        listener: health
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame.png
      offset:
        x: 12
        y: -10

# bottom-right, upper bar: mana (blue)
azerus_mana:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
    - placeholder{ph=%mmocore_mana_name%;v=Энергия} false hide # energy classes use azerus_energy
  layers:
    value:
      text: "%fill-value%/%fill-max%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 35
        y: -2
    icon:
      texture:
        path: assets/azerus/icon_mana.png
      offset:
        x: 70
        y: -1
    fill:
      texture:
        path: assets/azerus/fill_mana.png
      offset:
        x: 3
        y: -3
      function:
        listener: mana
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame.png
      offset:
        x: 2
        y: -2

