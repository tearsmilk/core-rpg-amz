# bottom-right, lower bar: hunger (orange; olive while the Hunger effect is on)
azerus_food:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    value:
      text: "%fill-value%/20"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 35
        y: -10
    icon:
      conditions:
        - effect{e=hunger} true texture assets/azerus/icon_food_hunger.png
        - placeholder{ph=%deluxemenus_meta_foodicon_BOOLEAN%;v=true;o==} true hide
      texture:
        path: assets/azerus/icon_food.png
      offset:
        x: 70
        y: -9
    icon2:  # bread icon - the /menu food-icon toggle of the old HUD
      conditions:
        - effect{e=hunger} true texture assets/azerus/icon_food2_hunger.png
        - placeholder{ph=%deluxemenus_meta_foodicon_BOOLEAN%;v=true;o==} false hide
      texture:
        path: assets/azerus/icon_food2.png
      offset:
        x: 70
        y: -9
    fill_hunger:
      conditions:
        - effect{e=hunger} true hide
      texture:
        path: assets/azerus/fill_hungry.png
      offset:
        x: 3
        y: -11
      function:
        listener: food
        increment: 65
        orientation: horizontal
    fill:
      texture:
        path: assets/azerus/fill_hunger.png
      offset:
        x: 3
        y: -11
      function:
        listener: food
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame.png
      offset:
        x: 2
        y: -10

# bottom-centre XP bar right above the hotbar (RoyalQuestClasses exp, listener rqexp, as the old HUD)
azerus_xp:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    fill:
      texture:
        path: assets/azerus/fill_xp.png
      offset:
        x: 1
        y: -1
      function:
        listener: rqexp
        increment: 90
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/xp_frame.png
      offset:
        x: 0
        y: 0

# green level number between the two plates, above the XP bar (%hl_level% as the old HUD)
azerus_level:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    value:
      text: "<#80e848>%hl_level%"
      font: "mmohud-font"
      align: center
      offset:
        x: 10
        y: -3
    badge:
      texture:
        path: assets/azerus/level_badge.png
      offset:
        x: 0
        y: 0

# air bubbles under water: small bar under the crosshair (only while air < max)
azerus_air:
  conditions:
    - gamemode{gm=creative,spectator} false hide # hidden in creative/spectator (as the old HUD)
  layers:
    icon:
      conditions:
        - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
      texture:
        path: assets/azerus/icon_air.png
      offset:
        x: 0
        y: 0
    fill:
      conditions:
        - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
      texture:
        path: assets/azerus/fill_air.png
      offset:
        x: 10
        y: -2
      function:
        listener: air
        increment: 54
        orientation: horizontal
    frame:
      conditions:
        - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
      texture:
        path: assets/azerus/air_frame.png
      offset:
        x: 9
        y: -1

