  layers:
    value:
      text: "%fill-value%/%fill-max%"
      font: "mmohud-font-outline"
      align: center
      offset:
        x: 35
        y: -2
    icon:
      texture:
        path: assets/azerus/icon_energy.png
      offset:
        x: 70
        y: -1
    fill:
      texture:
        path: assets/azerus/fill_energy.png
      offset:
        x: 3
        y: -3
      function:
        listener: mana
        increment: 65
        orientation: horizontal
    frame:
      texture:
        path: assets/azerus/bar_frame.png
      offset:
        x: 2
