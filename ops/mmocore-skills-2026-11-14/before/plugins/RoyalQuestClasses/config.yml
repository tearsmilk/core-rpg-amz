# ============================================
# Royal Quest Classes - Конфигурация
# ============================================

messages:
  # Prefix removed at owner request. Was: "<gradient:#FFD700:#FFA500>[Royal Quest]</gradient> "
  prefix: ""
  # used in both MiniMessage and plain-text sends -> no tags. Was: "<red>У вас нет прав на это!</red>"
  no-permission: "У вас нет прав на это!"
  class-already-chosen: "<red>Вы уже выбрали класс! Смена невозможна.</red>"
  class-chosen: "<green>Вы выбрали класс: <yellow>{class}</yellow>!</green>"
  must-choose-class: "<red>Сначала выберите базовый класс командой /class</red>"
  level-too-low: "<red>Профессию можно выбрать только с {level} уровня!</red>"
  profession-already-chosen: "<red>Вы уже выбрали профессию! Смена невозможна.</red>"
  profession-chosen: "<green>Вы успешно стали <yellow>{profession}</yellow>!</green>"
  invalid-profession: "<red>Неверная профессия для вашего класса!</red>"
  need-profession: "<gold>Вы достигли {level} уровня!</gold>\n<yellow>Теперь нужно выбрать профессию.</yellow>\n<gray>Доступно: {professions}</gray>\n<aqua>Откройте меню: /profession</aqua>\n<red>Пока профессия не выбрана — опыт не начисляется.</red>"
  # sent by the plugin as plain §-text (not MiniMessage). Was: "<red>Опыт заблокирован!</red> <yellow>Выберите профессию:</yellow> <aqua>/profession</aqua>"
  exp-blocked: "\u00a7cОпыт заблокирован! \u00a7eВыберите профессию: \u00a7b/profession"
  info: "<gold>═══ Ваш персонаж ═══</gold>\n<yellow>Класс:</yellow> {class}\n<yellow>Профессия:</yellow> {profession}\n<yellow>Уровень:</yellow> {level}\n<yellow>Опыт:</yellow> {exp}/{exp-needed}"
  no-class: "<gray>Класс не выбран</gray>"
  no-profession: "<gray>Профессия не выбрана</gray>"
  level-up: "<green>★ Вы достигли <yellow>{level}</yellow> уровня! ★</green>"
  exp-gained: "<gray>+{amount} опыта</gray>"
  admin-reset: "<green>Данные игрока {player} сброшены ({type}).</green>"
  admin-setlevel: "<green>Уровень игрока {player} установлен на {level}.</green>"
  admin-giveexp: "<green>Игроку {player} выдано {amount} опыта.</green>"
  admin-reload: "<green>Конфиг перезагружен.</green>"
  player-not-found: "<red>Игрок не найден.</red>"
  player-reset-notify: "<yellow>Администратор сбросил ваши данные класса/профессии.</yellow>"

settings:
  # Блокировать получение опыта пока не выбрана профессия
  block-exp-until-profession: true
  # Минимальный уровень для выбора профессии
  profession-level: 20
  # Открывать GUI выбора класса при первом входе
  open-gui-on-first-join: true
  # Если за столько секунд после входа не пришло ни одного пака — открыть меню сразу
  class-menu-no-pack-grace-seconds: 2
  # Использовать кастомную систему уровней (true) или ванильный XP (false)
  use-custom-levels: true
  # Конвертировать ванильный опыт в кастомный (если use-custom-levels = true)
  convert-vanilla-exp: true
  # Множитель конвертации ванильного XP → кастомный
  vanilla-exp-multiplier: 1.0
  # Максимальный уровень (навыки MMOCore открываются до 50)
  max-level: 65
  # Показывать сообщение при получении опыта
  show-exp-gain-message: false

