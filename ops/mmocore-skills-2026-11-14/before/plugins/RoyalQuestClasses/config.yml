# ============================================
# Синхронизация с MMOCore (навыки)
# ============================================
# Класс/профессия RQ -> скрытый класс MMOCore с тем же ключом (plugins/MMOCore/classes/<key>.yml).
# Уровень RQ копируется в уровень класса MMOCore; навыки открываются по уровню из файла класса MMOCore.
mmocore-sync:
  enabled: true
  # Новые открывшиеся навыки сами ставятся в свободные слоты панели (игрок может перебиндить в /skills)
  auto-bind-new-skills: true
  # Режим каста (F): клавиша N всегда = навык N. Рука на время каста ставится в слот cast-hand-slot (7-9),
  # при выходе из каста возвращается обратно. Отключить: false  (нужен RoyalQuestClasses 1.0.4)
  cast-fixed-keys: true
  cast-hand-slot: 9
  # Класс MMOCore для игроков без класса RQ (пусто = класс по умолчанию MMOCore, т.е. human)
  no-class: ''
  messages:
    unlocked: '§aОткрыт навык §e{skill}§a! Слот: §e{slot}'
    unlocked-no-slot: '§aОткрыт навык §e{skill}§a! Свободных слотов нет — поставь его через §e/skills'
