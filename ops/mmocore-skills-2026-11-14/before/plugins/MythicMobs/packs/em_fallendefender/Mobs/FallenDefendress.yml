  - setvariable{var=caster.shielding;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.shieldstacks;value="0";t=integer} @Self ~onSpawn
#======== RUNNER PROTOCOL (Activate if you remove statue pose)
  - Aura{auraName=checkrunfdefender;onTick=fdefender_runprotocolcheck;interval=30;duration=99999} @self ~onSpawn 0 #=============== RUN MECHANICUS
  - skill{s=outrun_trigger_fdefender} @Trigger ~onDamaged 0.35
  - setvariable{var=caster.hitrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - message{m="Hitrec <caster.var.hitrec>"} @PlayersNearOrigin{r=75} ~onDamaged 0
  - message{m="&eCOMBOR &a<caster.var.combor>"} @PlayersNearOrigin{r=75} ~onDamaged 0 

# ======== Dodger/Sgh Protocol (activate here if you remove statue pose)
  - Aura{auraName=backstepdodgerfdefender;onTick=fdefender_bstpcheck;interval=7;duration=99999} @self ~onSpawn 0
  - sound{s=emaginationfallenheroes:custom.fallenhero.hitmetal;p=1;v=1} @selflocation ~onDamaged 1 #Hurtmechanic SOUND
  - sound{s=emaginationfallenheroes:custom.fallenhero.hitmetal;p=1;v=1} @selflocation ~onDeath 1 
  - setstance{stance=static} @self ~onSpawn
  - message{m="<caster.var.runstacks>"} @PlayersNearOrigin{r=35} ~onTimer:40 0
  - sound{s=emaginationfallenheroes:custom.fallenhero.death;p=1;v=1} @selflocation ~onDeath 1
  - Aura{auraName=staticfdefender;onTick=fdefenderstcheck;interval=20;duration=99999;delay=40} @self ~onSpawn

  Options:
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.18
    Interactable: true
    PreventOtherDrops: true
    KnockbackResistance: 0.9
