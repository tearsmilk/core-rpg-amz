spider_melee:
  Display: spider_melee
  Type: HUSK
  Health: 8
  Damage: 5
  Faction: spideys
  Options:
    Silent: true
    MovementSpeed: 0.26
    PreventSunburn: true
    PreventJockeyMounts: true
    KnockbackResistance: 0.25
    Collidable: true
    PreventOtherDrops: true
    Invisible: true
  Skills:
  - settarget{delay="<random.1to20>"} @NearestPlayer{r=16} ~onTimer:40 ?inCombat
  - model{mid=spider_melee_am} @self ~onSpawn
  - randomskill{s=spdr_s1,spdr_s2,spdr_s3} @self ~onSpawn
  - brightness{b=10;s=10;delay=1} @self ~onSpawn
  - cancelevent{sync=true} @self ~onAttack
  - sound{s=minecraft:entity.spider.step;v=1;p=1} @self ~onSpawn
  - sound{s=minecraft:entity.spider.ambient;v=1;p=0.8} @selflocation ~onTimer:205
  - sound{s=minecraft:entity.spider.death;v=1.2;p=0.8} @selflocation ~onDeath
  - sound{s=minecraft:entity.spider.hurt;v=0.8;p=0.8} @selflocation ~onDamaged
  - sound{s=minecraft:entity.spider.step;v=0.4;p=0.8} @self ~onTimer:12 ?ismoving
  - particles{p=poof;a=25;hs=0.4;vs=0.4;delay=50} @modelpart{p=torso} ~onDeath
  - particles{p=poof;size=0.5;a=15;hs=0.4;vs=0.4;delay=50} @modelpart{p=head} ~onDeath
  - randomskill{s=spdr_atk,spdr_dash} @self ~onTimer:20


