
# ~Written by RopeFire~

CancelEvent:
  Conditions:
  - incombat true
  Skills:
  - CancelEvent @self

#Common Chest Open
common_chest_open:
  TriggerConditions:
  - holding{m=common_key} true
  Conditions:
  - hasaura{n=commonChestOpened} false
  Skills:
  - state{model=common_chest;state=open} @self
  - consumeslot{slot=HAND;amount=1} @trigger
  - aura{auraName=commonChestOpened;duration=160} @self
  - delay 15
  - sound{s=entity.shulker.close;v=1;p=2;sc=HOSTILE} @self
  - delay 5
  - sound{s=block.wooden_door.open;v=1;p=2;sc=HOSTILE} @self
  - delay 8
  - sound{s=entity.allay.item_given;v=1;p=2;sc=HOSTILE} @self
  - delay 12
  - dropitem{i=iron_ingot 1-4} @selfLocation{y=0.5}
  - sound{s=entity.allay.item_taken;v=0.5;p=1.3;sc=HOSTILE} @self
  - delay 10
  - dropitem{i=gold_ingot 1-4} @selfLocation{y=0.5}
  - sound{s=entity.allay.item_taken;v=0.5;p=1.3;sc=HOSTILE} @self
  - delay 10
  - dropitem{i=diamond 1-4} @selfLocation{y=0.5}
  - sound{s=entity.allay.item_taken;v=0.5;p=1.3;sc=HOSTILE} @self
  - delay 100
  - particle{p=cloud;amount=50;x=5;z=20;s=0.07} @self
  - remove @self

#Common Chest Rotations
common_chest_rotation_0:
  Skills:
  - setrotation{relative=true;yaw=0} @self

common_chest_rotation_90:
  Skills:
  - setrotation{relative=true;yaw=90} @self

common_chest_rotation_180:
  Skills:
  - setrotation{relative=true;yaw=180} @self

common_chest_rotation_270:
  Skills:
  - setrotation{relative=true;yaw=270} @self

#Common Mimic Spawn
common_mimic_spawn:
  Skills:
  - setspeed{speed=0;type=WALKING} @self
  - setcollidable{c=false} @self
  - aura{auraName=commonMimicClosed;duration=999999;oE=common_mimic_stay_closed} @self
  - setAI{ai=false} @self

common_mimic_stay_closed:
  Conditions:
  - hasaura{n=commonMimicOpened} false
  Skills:
  - aura{auraName=commonMimicClosed;duration=999999;oE=common_mimic_stay_closed} @self  

#Common Mimic Rotations
common_mimic_rotation_0:
  Skills:
  - setrotation{relative=true;yaw=0} @self

common_mimic_rotation_90:
  Skills:
  - setrotation{relative=true;yaw=90} @self

common_mimic_rotation_180:
  Skills:
  - setrotation{relative=true;yaw=180} @self

common_mimic_rotation_270:
  Skills:
  - setrotation{relative=true;yaw=270} @self

#Common Mimic Open
common_mimic_open:
  TriggerConditions:
  - holding{m=common_key} true
  Conditions:
  - hasaura{n=commonMimicOpened} false
  Skills:
  - gcd{ticks=40}
  - setAI{ai=true} @self
  - state{model=common_mimic;state=open} @self
  - defaultstate{model=common_mimic;type=idle;state=aggro_idle} @self
  - consumeslot{slot=HAND;amount=1} @trigger
  - delay 15
  - sound{s=entity.shulker.close;v=1;p=2;sc=HOSTILE} @self
  - delay 5
  - sound{s=block.wooden_door.open;v=1;p=2;sc=HOSTILE} @self
  - delay 6
  - sound{s=entity.vex.ambient;v=1;p=1.3;sc=HOSTILE} @self
  - delay 14
  - settarget @trigger
  - setspeed{speed=1;type=WALKING} @self
  - aura{auraName=commonMimicOpened;duration=999999;oE=common_mimic_stay_open} @self
  - auraremove{aura=commonMimicClosed} @self

common_mimic_stay_open:
  Skills:
  - aura{auraName=commonMimicOpened;duration=999999;oE=common_mimic_stay_open} @self  

#Common Mimic Cut Tongue
common_mimic_cut_tongue:
  TriggerConditions:
  - holding{m=shears} true
  Conditions:
  - hasaura{n=commonMimicOpened} true
  - hasaura{n=commonMimicCutTongue} false
  Skills:
  - partvis{mid=common_mimic;part=tongue;child=true;v=false} @self
  - dropitem{i=mimic_tongue} @self
  - aura{auraName=commonMimicCutTongue;duration=999999;oE=common_mimic_cut_tongue_stay_cut} @self
  - delay 1
  - sound{s=entity.horse.death;v=0.5;p=2;sc=HOSTILE} @self
  - sound{s=entity.sheep.shear;v=1;p=1;sc=HOSTILE} @self
  
common_mimic_cut_tongue_stay_cut:
  Skills:
  - aura{auraName=commonMimicCutTongue;duration=999999;oE=common_mimic_cut_tongue_stay_cut} @self

#Common Mimic Bite  
common_mimic_bite:
  Conditions:
  - incombat true
  - targetwithin{d=16} true
  - hasaura{n=commonMimicClosed} false
  - hasaura{n=commonMimicCutTongue} false
  - offgcd true
  - varisset{var=caster.melee_queue} false
  Skills:
  - setvar{var=target.melee_queue;d=10} @EiR{r=4;targetplayers=false}
  - CancelEvent @self
  - gcd{ticks=20}
  - setspeed{speed=0;type=WALKING} @self
  - state{model=common_mimic;state=bite} @self
  - rootmotion{ov=true} @self
  - delay 6
  - sound{s=entity.evoker_fangs.attack;v=0.5;p=1.5;sc=HOSTILE} @self
  - delay 1
  - aura{auraName=commonMimicBiteD;duration=5;oT=common_mimic_bite_damage} @self
  - delay 13
  - rootmotion{ov=false} @self
  - setspeed{speed=1;type=WALKING} @self
  
common_mimic_bite_damage:
  Skills:
  - totem{md=2;oH=[ - damage{a=8} ];hnp=true;hp=true;hR=1.5;vR=1.5;i=1;drawhitbox=false} @ModelPart{mid=common_mimic;pid=tongue2}

