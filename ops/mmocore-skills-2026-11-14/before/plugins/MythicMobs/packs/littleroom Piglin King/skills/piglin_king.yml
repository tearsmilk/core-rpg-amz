  - delay 1
  - recoil{r=20;pitch=.6}
  - delay 1
  - recoil{r=20;pitch=-.4}
  - delay 1
  - recoil{r=20;pitch=.2}

## EAT GRAPES ##

LRD_PIGLINKING_eat_grapes:
  Cooldown: 10
  Conditions:
  - varequals{var=caster.stunned;val=true} false
  - offgcd true
  Skills:
  - gcd{ticks=80}
  - state{s=eat_grape;p=10} @self
  - sound{s=littleroom_piglinking:grunt;v=2;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - partvis{pid=grapes;v=true;delay=5} @self
  - partvis{pid=grapes;v=false;delay=65;lo=5} @self
  - e:p{p=block;m=PURPLE_CONCRETE;a=10;hs=.15;vs=.15;delay=65;repeat=2;repeati=5} @modelpart{pid=king_mouth}
  - e:p{p=composter;a=10;hs=1;vs=1;delay=65} @modelpart{pid=king_body}
  - healpercent{m=0.01;repeat=5;repeati=1;delay=65} @self
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID;repeat=4;repeati=1;delay=65} @self
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=RED;style=SOLID;delay=70} @self
  
  
  
  
  
### FAKE MOVEMENT ###

LRD_PIGLINKING_forward_movement:
  Conditions:
  - varequals{var=caster.stunned;val=true} false
  TargetConditions:
  - distance{d=<4} false
  #- fieldofview{angle=145} true
  Skills:
  - velocity{m=add;x=0;y=0;z=0.025;relative=true} @self

### SLOW ROTATION ###

LRD_PIGLINKING_stop_turn:
  Conditions:
  - varequals{var=caster.turning;v=true} false
  TargetConditions:
  - fieldofview{angle=90} true
  Skills:
  - state{s=turn_right;p=7;r=true} @self
  - state{s=turn_left;p=7;r=true} @self
  

LRD_PIGLINKING_turn_right:
  TargetConditions:
  - fieldofview{angle=180;r=270} true
  Skills:
  #- skill{s=LRD_PIGLINKING_turn_loco} @target
  - state{s=turn_right;cd=3;p=7;li=5;lo=5} @self
  - setvar{var=caster.turning;val=true;type=STRING;d=20} @self
  - setrotation{relative=true;yaw=1} @self

LRD_PIGLINKING_turn_left:
  TargetConditions:
  - fieldofview{angle=180;r=90} true
  Skills:
  #- skill{s=LRD_PIGLINKING_turn_loco} @target
  - state{s=turn_left;cd=3;p=7;li=5;lo=5} @self
  - setvar{var=caster.turning;val=true;type=STRING;d=20} @self
  - setrotation{relative=true;yaw=-1} @self


LRD_PIGLINKING_turn_loco:
  TargetConditions:
  - fieldofview{angle=90} false
  Skills:
  - velocity{m=add;x=0;y=0;z=0.01;relative=true} @self
  




