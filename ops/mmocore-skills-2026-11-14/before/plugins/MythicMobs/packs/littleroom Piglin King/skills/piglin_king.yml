## STUN ##



LRD_PIGLINKING_stun:
  Conditions:
  - varequals{var=caster.stunned;val=true} false
  - variableInRange{var=caster.servantsdead;val=>1} true
  Skills:
  - gcd{ticks=200}
  - partvis{pid=root_fire;child=true;v=false;repeat=60;repeati=1} @self
  - setvar{var=caster.flamecircle;val=false;type=STRING;repeat=60;repeati=1} @self
  - setvar{var=caster.stunned;val=true;type=STRING} @self
  - setvar{var=caster.stunned;val=false;type=STRING;delay=140} @self
  - setvar{var=caster.servantsdead;val=0;type=INTEGER;delay=140} @self
  - state{s=eat_grape;p=2;r=true} @self
  - state{s=back_left_down;p=3;r=true} @self
  - state{s=back_right_down;p=3;r=true} @self
  - state{s=front_left_down;p=3;r=true} @self
  - state{s=front_right_down;p=3;r=true} @self
  - state{s=stun;p=4} @self
  - sound{s=littleroom_piglinking:impact;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>;delay=25} @self
  - skill{s=LRD_PIGLINKING_recoil_big;delay=25} @pir{r=16}
  - setspeed{s=0} @self
  - setspeed{s=1;delay=200} @self
  - lockmodel{l=true} @self
  - lockmodel{l=false;delay=200} @self
  - e:p{p=poof;a=30;hs=.25;vs=.25;delay=40} @modelpart{pid=servant1_body}
  - e:p{p=poof;a=30;hs=.25;vs=.25;delay=50} @modelpart{pid=servant2_body}
  - e:p{p=poof;a=30;hs=.25;vs=.25;delay=50} @modelpart{pid=servant3_body}
  - e:p{p=poof;a=30;hs=.25;vs=.25;delay=50} @modelpart{pid=servant4_body}
  - partvis{pid=servant1_body;child=true;v=true;delay=120} @self
  - partvis{pid=servant2_body;child=true;v=true;delay=120} @self
  - partvis{pid=servant3_body;child=true;v=true;delay=120} @self
  - partvis{pid=servant4_body;child=true;v=true;delay=120} @self
