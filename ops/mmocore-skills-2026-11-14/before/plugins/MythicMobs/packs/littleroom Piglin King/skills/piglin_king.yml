### INVULNERABILITY HANDLER ###

LRD_PIGLINKING_INVULNERABLE:
  Conditions:
  - varequals{var=caster.stunned;val=true} false
  Skills:
  - potion{type=DAMAGE_RESISTANCE;duration=10;level=4} @self

LRD_PIGLINKING_protection_spell:
  Conditions:
  - varequals{var=caster.stunned;val=true} false
  TargetConditions:
  - entitytype{t=ARROW} true
  Skills:
  - remove
  - e:p{p=end_rod;a=15;vs=.15;hs=.15;s=0.1}

### BOSSBAR ###

LRD_PIGLINKING_bossbar_set:
  Skills:
  - barCreate{
    name="LRD_PIGLINKING";
    display="<caster.name>";
    value=<caster.hp>/<caster.mhp>;color=RED;
    style=SEGMENTED_6
    } @self

LRD_PIGLINKING_bossbar_damage:
  Conditions:
  - varequals{var=caster.stunned;val=true} true
  Skills:
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=RED;style=SOLID} @self
  - delay 2
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - barSet{name="LRD_PIGLINKING";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=RED;style=SOLID} @self

### RECOIL ###

LRD_PIGLINKING_recoil:
