LRD_PIGLINKING: 
  Type: HUSK
  Display: "Piglin King"
  Health: 250
  Damage: 1
  Faction: PIGLINKING
  AITargetSelectors:
  - players
  AIGoalSelectors:
  - clear
  Options:
    Silent: true
    PreventOtherDrops: true
    KnockbackResistance: 1
    FollowRange: 128
    Despawn: NEVER
    MovementSpeed: 0.2
    #NoAI: true
  Skills:
  - CancelEvent{sync=true} @self ~onInteract
  - CancelEvent{sync=true} @self ~onAttack
  - model{m=lrd_piglin_king;usm=true;d=false;lp=false;step=1;lyaw=true} @self ~onSpawn
  - model{m=lrd_piglin_king;usm=true;d=false;lp=false;step=1;lyaw=true} @self ~onLoad
  - state{s=fire_spin_layer;p=7} @self ~onSpawn
  - state{s=fire_spin_layer;p=7} @self ~onLoad
  - bodyrotation{mh=40;mb=40;rde=40;rdu=120} @self ~onSpawn
  - bodyrotation{mh=40;mb=40;rde=40;rdu=120} @self ~onLoad
  - setvar{var=caster.servantsdead;val=0;type=INTEGER} @self ~onSpawn
  - partvis{pid=grapes} @self ~onSpawn
  - partvis{pid=grapes} @self ~onLoad
  - partvis{pid=root_fire;child=true} @self ~onSpawn
  - partvis{pid=root_fire;child=true} @self ~onLoad
  - brightness{b=15;s=15;pid=fire;em=false} @self ~onSpawn
  - brightness{b=15;s=15;pid=fire;em=false} @self ~onLoad
  - brightness{b=15;s=15;pid=crystal} @self ~onSpawn
  - brightness{b=15;s=15;pid=crystal} @self ~onLoad
  - throw{v=3;vy=-1} @pir{r=24;conditions=[ - boundingboxesoverlap]} ~onTimer:1
  - skill{s=LRD_PIGLINKING_bossbar_set} @self ~onSpawn
  - skill{s=LRD_PIGLINKING_bossbar_damage} @self ~onDamaged
  - skill{s=LRD_PIGLINKING_eat_grapes} @self ~onTimer:20 <100%
  - skill{s=LRD_PIGLINKING_INVULNERABLE} @self ~onTimer:10
  ## MOVEMENT ##
  - skill{s=LRD_PIGLINKING_turn_right} @target ~onTimer:1
  - skill{s=LRD_PIGLINKING_turn_left} @target ~onTimer:1
  - skill{s=LRD_PIGLINKING_stop_turn} @target ~onTimer:20
  - skill{s=LRD_PIGLINKING_forward_movement} @target ~onTimer:1
  ## SERVANTS ##
  - bindHitbox{mid=lrd_piglin_king;p=ob_fl_servant;t=LRD_PIGLINKING_FL_SERVANT_HITBOX} @self ~onSpawn
  - hitboxconfig{mid=lrd_piglin_king;pid=ob_fl_servant;pass=0} @self ~onSpawn
  - bindHitbox{mid=lrd_piglin_king;p=ob_fr_servant;t=LRD_PIGLINKING_FR_SERVANT_HITBOX} @self ~onSpawn
  - hitboxconfig{mid=lrd_piglin_king;pid=ob_fr_servant;pass=0} @self ~onSpawn
  - bindHitbox{mid=lrd_piglin_king;p=ob_br_servant;t=LRD_PIGLINKING_BR_SERVANT_HITBOX} @self ~onSpawn
  - hitboxconfig{mid=lrd_piglin_king;pid=ob_br_servant;pass=0} @self ~onSpawn
  - bindHitbox{mid=lrd_piglin_king;p=ob_bl_servant;t=LRD_PIGLINKING_BL_SERVANT_HITBOX} @self ~onSpawn
  - hitboxconfig{mid=lrd_piglin_king;pid=ob_bl_servant;pass=0} @self ~onSpawn
  - skill{s=LRD_PIGLINKING_lose_frontleft_servant} @self ~onSignal:fl_servant_death
  - skill{s=LRD_PIGLINKING_damage_frontleft_servant} @self ~onSignal:fl_servant_damaged
  - skill{s=LRD_PIGLINKING_lose_frontright_servant} @self ~onSignal:fr_servant_death
  - skill{s=LRD_PIGLINKING_damage_frontright_servant} @self ~onSignal:fr_servant_damaged
  - skill{s=LRD_PIGLINKING_lose_backright_servant} @self ~onSignal:br_servant_death
  - skill{s=LRD_PIGLINKING_damage_backright_servant} @self ~onSignal:br_servant_damaged
  - skill{s=LRD_PIGLINKING_lose_backleft_servant} @self ~onSignal:bl_servant_death
  - skill{s=LRD_PIGLINKING_damage_backleft_servant} @self ~onSignal:bl_servant_damaged
  ## STUNNED ##
  - skill{s=LRD_PIGLINKING_stun_hit} @self ~onDamaged
  ## SPELLS ##
  - skill{s=LRD_PIGLINKING_spell_fire_circle} @self ~onTimer:20
  - skill{s=LRD_PIGLINKING_spell_fire_circle_damage} @eir{r=4} ~onTimer:5
  - skill{s=LRD_PIGLINKING_spell_AOE} @target ~onTimer:20
  - skill{s=LRD_PIGLINKING_protection_spell;origin=@modelpart{pid=protectionorigin};fromorigin=true} @ENO{r=4;l=false;conditions=[ - onground false]} ~onDamaged
  ## LOSE THRONE ##
  - skill{s=LRD_PIGLINKING_lose_throne} @self ~onDamaged <25%
  
