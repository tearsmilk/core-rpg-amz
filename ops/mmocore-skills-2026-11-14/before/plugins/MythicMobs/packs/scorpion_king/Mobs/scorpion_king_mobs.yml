  - effect:sound{s=scorpion_sounds:samus.scorpion_idle;volume=1;pitch=2} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Baby_Melee_Attack} ~onTimer:10
