
dyerftum2_em:
  Type: vindicator
  Display: 'Dyerftum'
  Modules:
    ThreatTable: true
  AITargetSelectors:
  - 0 clear
  - 1 players
  - 2 attacker
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  - randomstroll
  - randomlookaround
  - float
  Health: 36
  Faction: Dyerftum
  DamageModifiers:
  - FIRE 0
  - MAGIC 1.1
  - PROJECTILE 0.25
  Damage: 6 #This is the BASE damage. Applies for ALL skills Setting it to 12 will DOUBLE damage. Setting it to 3 will REDUCE damage in 50% from the original.
  KillMessages:
  - '<target.name> was killed by a Dyerftum.'
  - 'A Dyerftum slashed <target.name>.'
  - "<target.name> was slain by Dyerftums"
  - "A group of Dyerftum killed <target.name>."
  Equipment:
  - air:4
  - air:3
  - air:2
  - imboots_dyerftum2em:1
  - air:0
  - air:5
  Drops:
  - exp 10-25 1
  LevelModifiers:
    Health: 0.5
    Damage: 0.03
  Skills:
  - message{m="Hitrec <caster.var.hitrec> STACKS"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
#====== MODEL ASSIGNEMENT =============
  - model{m=em_dyerftum2;n=false;damagetint=false} @self ~onSpawn 1
  - setlevel{a=set;l=0} ~onSpawn
  - setvariable{var=caster.skillxd;value="none";t=string} @Self ~onSpawn
  - skill{s=dyerftum2_emhp_check} @Self ~onSpawn
  - setvariable{var=caster.eichpee;value="<caster.mhp>";t=integer} @Self ~onSpawn
  - DefaultState{type=WALK;state=walk_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=IDLE;state=idle_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=WALK;state=walk;li=3;lo=2} @self ~onDropCombat
  - DefaultState{type=IDLE;state=idle;li=3;lo=2} @self ~onDropCombat
  
  - potion{type=JUMP;duration=999999;lvl=0;p=true} @Self ~OnSpawn
#============ DISGUISE PROTOCOL =================
  - submodel{mid=em_dyerftum2;partid=chest2;subpartid=chest2;remove=true} @self ~onSpawn 1
  - submodel{mid=em_dyerftum2;partid=head2;subpartid=head2;remove=true} @self ~onSpawn 1

  - submodel{mid=em_dyerftum2;partid=chest2;subpartid=chest2;remove=true} @self ~onLoad 1
  - submodel{mid=em_dyerftum2;partid=head2;subpartid=head2;remove=true} @self ~onLoad 1

  - changepart{m=em_dyerftum2;pid=head;nm=em_dyerftum2;npid=head2} @self ~onSpawn 0.5
  - changepart{m=em_dyerftum2;pid=chest;nm=em_dyerftum2;npid=chest2} @self ~onSpawn 0.5

#============ ATTACK =================

  - skill{s=dyerftum2_emmeleetrigger} @Trigger ~onSignal:DEBUG_TEST 1
  - CancelEvent{sync=true} @self ~onAttack 1 #CANCEL ATTACKS
  
  - skill{s=[
      - skill{s=dyerftum2_emmeleetrigger;sync=false} @LivingInCone{a=160.0;r=12;rot=0.0;ignore=samefaction}
      - skill{s=dyerftum2_emmeleetrigger;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:14 0.8 ?!variableEquals{var=caster.rage;value="1"} ?incombat
  - skill{s=[
      - skill{s=dyerftum2_emmeleetrigger2;sync=false} @LivingInCone{a=160.0;r=5.5;rot=0.0;ignore=samefaction}
      - skill{s=dyerftum2_emmeleetrigger2;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:9 0.9 ?variableEquals{var=caster.rage;value="1"} ?incombat
  
  - skill{s=dyerftum2_emtossrocc;sync=false} @Target ~onTimer:70 0.4 ?incombat
  - skill{s=dyerftum2_emmeleetrigger;sync=false} @LivingInCone{a=160.0;r=4.5;rot=0.0;ignore=samefaction} ~onAttack
  - setvariable{var=caster.combor;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.comboa;value="0";t=integer} @Self ~onSpawn
  
  - skill{s=dyerftum2_emidlesounds_trigger;sync=false} ~onTimer:32 0.6 ?!incombat
  - skill{s=dyerftum2_emidlesounds_trigger;sync=false} ~onTimer:32 0.3 ?incombat
  
  - sound{s=emewoods1:custom.enchantedwoods1.wood_hit;p=<random.float.0.9to1.2>;v=1.2} @selflocation ~onDamaged 1 #Hurtmechanic SOUND
  - setstance{stance=normal} @self ~onSpawn
  - skill{s=hurt1dyerftum2em} @self ~onDamaged 0.92 #Hurtmechanic
  - setvariable{var=caster.vulnerable;value="0";t=integer} @Self ~onSpawn
  - velocity{m=set;x=0;y=0;z=0} @self ~onDamaged
  - setspeed{speed=1.3;type=walking} @self ~onEnterCombat
  - setspeed{speed=0.8;type=walking} @self ~onDropCombat
#================ RIP IN PEPSI PROTOCOL
  #LEAFS VFX
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8
    ;repeat=2to3;repeatinterval=1} @RandomLocationsNearOrigin{a=1;r=1;s=0.3;minr=0.3;y=-3.2} ~onDeath
  #
  - sound{s=emewoods1:custom.enchantedwoods1.dyerftum_death;p=<random.float.0.9to1.2>;v=1.5} @selflocation ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.wood_hit;p=<random.float.0.8to1>;v=1.2;delay=15} @selflocation ~onDeath
  - lockmodel{l=false;delay=0} @Self ~onDeath

  - effect:particles{particle=cloud;amount=150;hS=1.1;vS=0.55;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{m=em_dyerftum2;p=hip;offset=GLOBAL;y=0.2} ~onDeath
  - effect:particles{particle=cloud;amount=60;hS=0.6;vS=0.2;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{m=em_dyerftum2;p=head;offset=GLOBAL;y=0.2} ~onDeath


# ========= Anti-ranged protocol
  - setspeed{speed=0.8;type=walking;delay=1} @self ~onSpawn
  - skill{s=hurtgendyerftum2em;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIARROW
  - skill{s=hurtgendyerftum2em2;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIMMSkills

  - setvariable{var=caster.projrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - setvariable{var=caster.running;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.ragestacks;value="4";t=integer} @Self ~onSpawn
  - setvariable{var=caster.hurtened;value="0";t=integer} @Self ~onSpawn
#======== RUNNER PROTOCOL 
  - Aura{auraName=checkrundyerftum2em;onTick=dyerftum2_emrunprotocolcheck;interval=14;duration=99999} @self ~onSpawn 1 #=============== RUN MECHANICUS
  - setvariable{var=caster.hitrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - message{m="Hitrec <caster.var.hitrec>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
  - message{m="&eCOMBOR &a<caster.var.combor>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE

  Options:
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.32
    Interactable: true
    PreventOtherDrops: true
    KnockbackResistance: 0.9
    FollowRange: 24

# SUMMONED VERSION - This is a weakened version of the mob, with configurable health.
dyerftum2_em_summoned:
  Template: dyerftum2_em
  Health: 30
  Damage: 4.5
  Skills:
  - signal{s=DIESUMMON} @Parent ~onDeath
  Options:
    FollowRange: 45
dyerftum2_emroccprojectile:
  Type: silverfish
  Display: ''
  Faction: Dyerftum
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Health: 150
  Damage: 0
  Drops:
  Skills:
  - model{mid=em_roccxd;damagetint=false} @self ~onSpawn 1
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onSpawn
  - state{state=rotet;li=0} @self ~onSpawn
  - cancelEvent{sync=true} ~onAttack
  - look{headOnly=false;immediately=true;repeat=90;repeatInterval=1} @ProjectileForward{f=10} ~onSpawn
  Options:
    ApplyInvisibility: true
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.56
    MaxCombatDistance: 5
    PreventOtherDrops: true
    PreventItemPickup: true
    FollowRange: 50
    Despawn: true
    Interactable: false
    KnockbackResistance: 0
    Collidable: false
    NoGravity: true
    Invincible: true




