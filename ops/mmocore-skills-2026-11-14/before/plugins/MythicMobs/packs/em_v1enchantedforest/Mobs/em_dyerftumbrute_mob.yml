
dyerftumbrute_em:
  Type: vindicator
  Display: 'Dyerftum Brute'
  Modules:
    ThreatTable: true
  Health: 75
  Faction: Dyerftum
  DamageModifiers:
  - FIRE 0
  - MAGIC 1.1
  - PROJECTILE 0.25
  Damage: 12 #This is the BASE damage. Applies for ALL skills Setting it to 18 will DOUBLE damage. Setting it to 3 will REDUCE damage in 50% from the original.
  KillMessages:
  - '<target.name> was killed by a Dyerftum Brute.'
  - 'A Dyerftum brute stomped <target.name>.'
  - "<target.name> was slain by Dyerftums"
  - "A group of Dyerftum killed <target.name>."
  Equipment:
  - air:4
  - air:3
  - air:2
  - imboots_dyerftumbrute_em:1
  - iron_axe:air
  - air:5
  Drops:
  - exp 10-25 1
  LevelModifiers:
    Health: 0.5
    Damage: 0.03
  Skills:
  - message{m="Hitrec <caster.var.hitrec> STACKS"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
#====== MODEL ASSIGNEMENT =============
  - model{m=em_dyerftum4;n=false;damagetint=false} @self ~onSpawn 1
  - setlevel{a=set;l=0} ~onSpawn
  - setvariable{var=caster.skillxd;value="none";t=string} @Self ~onSpawn
  - skill{s=dyerftumbrute_em_hp_check} @Self ~onSpawn
  - setvariable{var=caster.eichpee;value="<caster.mhp>";t=integer} @Self ~onSpawn
  - DefaultState{type=WALK;state=walk_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=IDLE;state=idle_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=WALK;state=walk;li=3;lo=2} @self ~onDropCombat
  - DefaultState{type=IDLE;state=idle;li=3;lo=2} @self ~onDropCombat
  
  - potion{type=JUMP;duration=999999;lvl=0;p=true} @Self ~OnSpawn
#============ DISGUISE PROTOCOL =================
  - submodel{mid=em_dyerftum4;partid=chest2;subpartid=chest2;remove=true} @self ~onSpawn 1
  - submodel{mid=em_dyerftum4;partid=head2;subpartid=head2;remove=true} @self ~onSpawn 1

  - submodel{mid=em_dyerftum4;partid=chest2;subpartid=chest2;remove=true} @self ~onLoad 1
  - submodel{mid=em_dyerftum4;partid=head2;subpartid=head2;remove=true} @self ~onLoad 1

  - changepart{m=em_dyerftum4;pid=head;nm=em_dyerftum4;npid=head2} @self ~onSpawn 0.5
  - changepart{m=em_dyerftum4;pid=chest;nm=em_dyerftum4;npid=chest2} @self ~onSpawn 0.5
#============ ATTACK =================
  - skill{s=dyerftumbrute_em_bruttack1} @Trigger ~onSignal:DEBUG_TEST 1
  - CancelEvent{sync=true} @self ~onAttack 1 #CANCEL ATTACKS
  
  - skill{s=[
      - skill{s=dyerftumbrute_em_meleetrigger;sync=false} @LivingInCone{a=160.0;r=4;rot=0.0;ignore=samefaction}
      - skill{s=dyerftumbrute_em_meleetrigger;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:12 0.85 ?!variableEquals{var=caster.rage;value="1"} ?incombat
  - skill{s=[
      - skill{s=dyerftumbrute_em_meleetrigger2;sync=false} @LivingInCone{a=160.0;r=4;rot=0.0;ignore=samefaction}
      - skill{s=dyerftumbrute_em_meleetrigger2;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:8 0.95 ?variableEquals{var=caster.rage;value="1"} ?incombat

  - setvariable{var=caster.combor;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.comboa;value="0";t=integer} @Self ~onSpawn
  
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.8to0.9>;v=1.2} @selflocation ~onDamaged 1 #Hurtmechanic SOUND
  
  - skill{s=dyerftumbrute_em_idlesounds_trigger;sync=false} ~onTimer:32 0.6 ?!incombat
  - skill{s=dyerftumbrute_em_idlesounds_trigger;sync=false} ~onTimer:32 0.3 ?incombat
  
  - setstance{stance=normal} @self ~onSpawn
  - skill{s=hurt1dyerftumbrute_em} @self ~onDamaged 0.92 #Hurtmechanic
  - setvariable{var=caster.vulnerable;value="0";t=integer} @Self ~onSpawn
  - velocity{m=set;x=0;y=0;z=0} @self ~onDamaged
  - setspeed{speed=1.3;type=walking} @self ~onEnterCombat
  - setspeed{speed=1;type=walking} @self ~onDropCombat
#================ RIP IN PEPSI PROTOCOL

  #LEAFS VFX
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8;repeat=4to5;repeatinterval=1} @RandomLocationsNearOrigin{a=1;r=1;s=0.3;minr=0.3;y=-2.4} ~onDeath
  #
  #LEAFS VFX
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8;repeat=2;repeatinterval=1;delay=16} @RandomLocationsNearOrigin{a=1;r=1;s=0.3;minr=0.3;y=-3.2} ~onDeath
  #

  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.5} @selflocation ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.dyerftum_death;p=<random.float.0.5to0.6>;v=1.5} @selflocation ~onDeath
  - lockmodel{l=false;delay=0} @Self ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.2;delay=14} @selflocation ~onDeath 1
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.2;delay=14} @selflocation ~onDeath 1

  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.2;delay=32} @selflocation ~onDeath 1
  - sound{s=emewoods1:custom.enchantedwoods1.wood_impact1;p=<random.float.1.2to1.4>;v=1.2;delay=32} @selflocation ~onDeath 1


  - effect:particles{particle=cloud;amount=150;hS=1.1;vS=0.55;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{p=hip;offset=GLOBAL;y=0.2} ~onDeath
  - effect:particles{particle=cloud;amount=60;hS=0.6;vS=0.2;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{p=head;offset=GLOBAL;y=0.2} ~onDeath


# ========= Anti-ranged protocol
  - skill{s=hurtgendyerftumbrute_em;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIARROW
  - skill{s=hurtgendyerftumbrute_em2;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIMMSkills

  - setvariable{var=caster.projrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - setvariable{var=caster.running;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.ragestacks;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.hurtened;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.parrying;value="0";t=integer} @Self ~onSpawn
#======== RUNNER PROTOCOL 
  - Aura{auraName=checkrundyerftumbrute_em;onTick=dyerftumbrute_em_runprotocolcheck;interval=18;duration=99999} @self ~onSpawn 1 #=============== RUN MECHANICUS
  - setvariable{var=caster.hitrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - message{m="Hitrec <caster.var.hitrec>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
  - message{m="&eCOMBOR &a<caster.var.combor>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE

  Options:
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.24
    Interactable: true
    PreventOtherDrops: true
    KnockbackResistance: 0.9
    FollowRange: 32

dyerftumbrute_em_summoned:
  Template: dyerftumbrute_em
  Health: 35
  Damage: 7
  Skills:
  - signal{s=DIESUMMON} @Parent ~onDeath
  - signal{s=DIESUMMONBRUTE} @Parent ~onDeath
  Options:
    FollowRange: 45

