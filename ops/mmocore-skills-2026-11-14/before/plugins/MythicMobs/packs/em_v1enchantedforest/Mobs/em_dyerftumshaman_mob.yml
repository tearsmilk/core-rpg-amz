
dyerftumShaman_em:
  Type: vindicator
  Display: 'Dyerftum Shaman'
  Modules:
    ThreatTable: true
  Health: 400
  Faction: Dyerftum
  DamageModifiers:
  - FIRE 0
  - MAGIC 1.1
  - PROJECTILE 0.25
  Damage: 12 #This is the BASE damage. Applies for ALL skills Setting it to 24 will DOUBLE damage. Setting it to 3 will REDUCE damage in 50% from the original.
  KillMessages:
  - '<target.name> was killed by a Dyerftum Shaman.'
  - 'A Dyerftum shaman poisoned <target.name>.'
  - "<target.name> was slain by Dyerftums"
  - "A group of Dyerftum killed <target.name>."
  BossBar:
    Enabled: true
    Title: '&BDyerftum Shaman &A<caster.hp>/<caster.mhp>HP'
    Range: 30
    Color: GREEN
    Style: SEGMENTED_6
  Equipment:
  - air:4
  - air:3
  - air:2
  - imboots_dyerftumShaman_em:1
  - iron_axe:0
  - air:5
  Drops:
  - exp 10-25 1
  LevelModifiers:
    Health: 0.5
    Damage: 0.03
  Skills:
  - message{m="Hitrec <caster.var.hitrec> STACKS"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
#====== MODEL ASSIGNEMENT =============
  - model{m=em_dyerftum5;n=false;damagetint=false;save=true} @self ~onSpawn 1
  - model{m=em_dyerftum5;n=false;damagetint=false;save=true} @self ~onLoad 1
  - setlevel{a=set;l=0} ~onSpawn
  - setvariable{var=caster.skillxd;value="none";t=string} @Self ~onSpawn
  - skill{s=dyerftumShaman_em_hp_check} @Self ~onSpawn
  - setvariable{var=caster.eichpee;value="<caster.mhp>";t=integer} @Self ~onSpawn
  - DefaultState{type=WALK;state=walk_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=IDLE;state=idle_combat;li=3;lo=2} @self ~onEnterCombat
  - DefaultState{type=WALK;state=walk;li=3;lo=2} @self ~onDropCombat
  - DefaultState{type=IDLE;state=idle;li=3;lo=2} @self ~onDropCombat
  
  - potion{type=JUMP;duration=999999;lvl=0;p=true} @Self ~OnSpawn
#============ DISGUISE PROTOCOL =================
  - submodel{mid=em_dyerftum5;partid=chest2;subpartid=chest2;remove=true} @self ~onSpawn 1
  - submodel{mid=em_dyerftum5;partid=head2;subpartid=head2;remove=true} @self ~onSpawn 1
  - submodel{mid=em_dyerftum5;partid=left_forearm2;subpartid=left_forearm2;remove=true} @self ~onSpawn 1
  - submodel{mid=em_dyerftum5;partid=right_forearm2;subpartid=right_forearm2;remove=true} @self ~onSpawn 1

  - submodel{mid=em_dyerftum5;partid=chest2;subpartid=chest2;remove=true} @self ~onLoad 1
  - submodel{mid=em_dyerftum5;partid=head2;subpartid=head2;remove=true} @self ~onLoad 1
  - submodel{mid=em_dyerftum5;partid=left_forearm2;subpartid=left_forearm2;remove=true} @self ~onLoad 1
  - submodel{mid=em_dyerftum5;partid=right_forearm2;subpartid=right_forearm2;remove=true} @self ~onLoad 1

  - changepart{m=em_dyerftum5;pid=head;nm=em_dyerftum5;npid=head2} @self ~onSpawn 0.5
  - changepart{m=em_dyerftum5;pid=chest;nm=em_dyerftum5;npid=chest2} @self ~onSpawn 0.5
#============ ATTACK =================
  - skill{s=dyerftumShaman_em_bruttack1} @Trigger ~onSignal:DEBUG_TEST 1
#  - skill{s=dyerftumShaman_em_castpoison} @Trigger ~onSignal:DEBUG_TEST 1
  - CancelEvent{sync=true} @self ~onAttack 1 #CANCEL ATTACKS
  
  - skill{s=[
      - skill{s=dyerftumShaman_em_meleetrigger;sync=false} @LivingInCone{a=160.0;r=4;rot=0.0;ignore=samefaction}
      - skill{s=dyerftumShaman_em_meleetrigger;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:12 0.85 ?!variableEquals{var=caster.rage;value="1"} ?incombat
  - skill{s=[
      - skill{s=dyerftumShaman_em_meleetrigger2;sync=false} @LivingInCone{a=160.0;r=4;rot=0.0;ignore=samefaction}
      - skill{s=dyerftumShaman_em_meleetrigger2;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:8 0.95 ?variableEquals{var=caster.rage;value="1"} ?incombat
  
  - skill{s=dyerftumShaman_em_casthealing_sensor;sync=false} @EntitiesInRadius{r=15;ignore=players} ~onTimer:32 0.6 ?incombat
  
  - skill{s=dyerftumShaman_em_idlesounds_trigger;sync=false} ~onTimer:32 0.6 ?!incombat
  - skill{s=dyerftumShaman_em_idlesounds_trigger;sync=false} ~onTimer:32 0.3 ?incombat
  - skill{s=dyerftumShaman_em_castsummoning_sensor;sync=false} @EntitiesInRadius{r=15} ~onTimer:30 <36% 0.8 ?incombat
  - skill{s=dyerftumShaman_em_castsummoning_sensor;sync=false} @EntitiesInRadius{r=15} ~onTimer:40 =36%-75% 0.5 ?incombat
  - skill{s=dyerftumShaman_em_castertrigger1;sync=false} @LivingInCone{a=160.0;r=10;rot=0.0;ignore=samefaction} ~onTimer:32 0.75 ?incombat

  # SUMMON CONTROLLERS
  - skill{s=dyerftumShaman_em_parsesummonings} ~onSignal:DIESUMMON
  - variablesubtract{var=caster.brutesummonsamount;amount=1} @self ~onSignal:DIESUMMONBRUTE
  - setvariable{var=caster.summonsamount;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.brutesummonsamount;value="0";t=integer} @Self ~onSpawn

  - setvariable{var=caster.combor;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.comboa;value="0";t=integer} @Self ~onSpawn
  
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.8to0.9>;v=1.2} @selflocation ~onDamaged 1 #Hurtmechanic SOUND
  - setstance{stance=normal} @self ~onSpawn
  - skill{s=hurt1dyerftumShaman_em} @self ~onDamaged 0.92 #Hurtmechanic
  - setvariable{var=caster.vulnerable;value="0";t=integer} @Self ~onSpawn
  - velocity{m=set;x=0;y=0;z=0} @self ~onDamaged
  - setspeed{speed=1.3;type=walking} @self ~onEnterCombat
  - setspeed{speed=1;type=walking} @self ~onDropCombat
  - skill{s=dyerftumShaman_em_target_check} ~onEnterCombat
#================ RIP IN PEPSI PROTOCOL
  
  #LEAFS VFX
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8;repeat=4to5;repeatinterval=1} @RandomLocationsNearOrigin{a=1;r=1;s=0.3;minr=0.3;y=-2} ~onDeath
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8;repeat=2;repeatinterval=1;delay=18} @RandomLocationsNearOrigin{sideoffset=0.7;a=1;r=1;s=0.3;minr=0.3;y=-3.6} ~onDeath
  - summon{mob=dyerftum_leafs_1;amount=1;noise=2;yr=0.8;repeat=2;repeatinterval=1;delay=36} @RandomLocationsNearOrigin{a=1;r=1;s=0.3;minr=0.3;y=-4.2;z=3} ~onDeath
  #
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.5} @selflocation ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.shaman_death;p=<random.float.0.9to1.2>;v=1.5} @selflocation ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.wood_impact1;p=<random.float.0.8to1.2>;v=2} @selflocation ~onDeath
  - lockmodel{l=false;delay=0} @Self ~onDeath
  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.2;delay=13} @selflocation ~onDeath 1
  - sound{s=emewoods1:custom.enchantedwoods1.wood_impact1;p=<random.float.0.9to1.2>;v=1.2;delay=13} @selflocation ~onDeath 1

  - sound{s=emewoods1:custom.enchantedwoods1.heavy_wood_hit;p=<random.float.0.9to1.2>;v=1.2;delay=37} @selflocation ~onDeath 1
  - sound{s=emewoods1:custom.enchantedwoods1.wood_impact1;p=<random.float.0.9to1.2>;v=1.2;delay=37} @selflocation ~onDeath 1
  - sound{s=emewoods1:custom.enchantedwoods1.wood_impact1;p=<random.float.0.9to1.2>;v=1.2;delay=37} @selflocation ~onDeath 1

  - effect:particles{particle=cloud;amount=150;hS=1.1;vS=0.55;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=120} @ModelPart{p=hip;offset=GLOBAL;y=0.2} ~onDeath
  - effect:particles{particle=cloud;amount=60;hS=0.6;vS=0.2;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=120} @ModelPart{p=head;offset=GLOBAL;y=0.2} ~onDeath

# ========= Anti-ranged protocol
  - skill{s=hurtgendyerftumShaman_em;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIARROW
  - skill{s=hurtgendyerftumShaman_em2;sync=true} @self ~onDamaged 1 #Hurtmechanic ANTIMMSkills

  - setvariable{var=caster.projrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - setvariable{var=caster.running;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.ragestacks;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.hurtened;value="0";t=integer} @Self ~onSpawn
  - setvariable{var=caster.parrying;value="0";t=integer} @Self ~onSpawn
#======== RUNNER PROTOCOL 
  - Aura{auraName=checkrundyerftumShaman_em;onTick=dyerftumShaman_em_runprotocolcheck;interval=18;duration=99999} @self ~onSpawn 1 #=============== RUN MECHANICUS
  - setvariable{var=caster.hitrec;value="0";t=integer} @Self ~OnSpawn #Hurtmechanic ANTIARROW
  - message{m="Hitrec <caster.var.hitrec>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
  - message{m="&eCOMBOR &a<caster.var.combor>"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE

  Options:
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.24
    Interactable: true
    PreventOtherDrops: true
    KnockbackResistance: 0.9
    FollowRange: 24
    Despawn: PERSISTENT

