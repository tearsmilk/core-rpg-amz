# DRAWBACKS

dyerftumbrute_em_drawback_antilunge1:
  Conditions:
  - variableEquals{var=caster.skillxd;value="drawback"} true
  - variableEquals{var=caster.hurtened;value="1"} false
  - variableEquals{var=caster.skillxd;value="hurtedvbad"} false
  Skills:
  - lunge{v=<skill.lungeintensity>} @forward{f=-10}
dyerftumbrute_em_drawback_antilunge2:
  Conditions:
  - variableEquals{var=caster.skillxd;value="drawback"} true
  - variableEquals{var=caster.skillxd;value="bruttack1"}
  - variableEquals{var=caster.hurtened;value="1"} false
  - variableEquals{var=caster.skillxd;value="hurtedvbad"} false
  Skills:
  - lunge{v=<skill.lungeintensity>} @forward{f=-10}

dyerftumbrute_em_drawback1:
  Cooldown: 2
  Conditions:
  - variableEquals{var=caster.rage;value="1"} castinstead dyerftumbrute_em_meleetrigger
  - hasaura{n=backstepB} false
  - stance{s=normal} true
  - stance{s=casting} false
  - incombat true
  TargetConditions:
  - distance{d=0to8}
  Skills:
  - lockmodel{l=false;delay=0} @Self ?!variableEquals{var=caster.hurtened;value="1"}
  - message{m="&e<caster.name> &bcast &cdyerftumbrute_em_drawback1 &e@<target.name>"} @PlayersNearOrigin{r=75} 0 #DEBUGMESSAGE
#  - setstance{stance=casting} @self
#  - setvariable{var=caster.casting;value="1";t=integer} @Self
  - BodyClamp{maxbody=0;stable=0;rdelay=0;rduration=4} @self #BODYCLAMP START
  - setvariable{var=caster.skillxd;value="drawback";t=string} @Self
  - Aura{auraName=backstepA;interval=10;duration=60} @self
  - Aura{auraName=ShieldennblockA;refreshDuration=true;duration=60} @self
  - state{remove=true;s=drawback1;lo=3} @self
  - state{remove=true;s=drawback2;lo=3} @self
  - randomskill{s=[
      - state{state=drawback1;li=3;lo=8} @self
    ],
      [
      - state{state=drawback2;li=3;lo=8} @self
    ];sync=true}

