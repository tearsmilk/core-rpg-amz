  Conditions:
  - damagecause{cause=POISON} true
  Skills:
  - message{m="&bPoisoned Activating"} @PlayersNearOrigin{r=75} 0 #DEBUGMESSAGE
  - message{m="&bPoisoned Activating"} @Self 0 #DEBUGMESSAGE
  # MODIFY HERE FOR BALANCE
  - basedamage{m=0.6;ignorearmor=false;preventknockback=true;preventimmunity=true} @TargetedTarget
  - effect:particles{particle=SNEEZE;amount=1;hS=0.5;vS=0.2;speed=0.4;directional=true;y=1.5;repeat=14;repeatinterval=1;origin=@TargetedTarget{y=1}} @Self
  - delay 10
  - setvariable{var=skill.healthtick;type=float;val=(<caster.mhp>/<caster.var.targets>)*0.02}
  - heal{a=<skill.var.healthtick>} @self
  - healpercent{m=0.02} @self
  - effect:particles{particle=VILLAGER_HAPPY;amount=5;hS=0.5;vS=1;speed=0.3;y=1.5;repeat=2;repeatinterval=1} @Self

