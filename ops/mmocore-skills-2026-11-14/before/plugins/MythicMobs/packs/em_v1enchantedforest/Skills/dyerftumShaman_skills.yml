dyerftumShaman_em_hp_check:
  Cooldown: 9999
  Conditions:
  - playersinradius{a=>2;r=60} true
  Skills:
  - delay 5
  - skill{s=dyerftumShaman_em_hp_checkB} @pir{r=80} #MODIFY THE RANGE TO CHECK FOR PLAYERS
# GUIDE TO CUSTOMIZE HEALTH SCALING
dyerftumShaman_em_hp_checkB:
  Conditions:
  Skills:
  - setvariable{var=skill.amount_targets;val=<skill.targets>}
  - setmaxhealth{amount=<caster.var.eichpee>+100*<skill.var.amount_targets>;mode=SCALE} @self
# AMOUNT = (BASE HEALTH, modified in mob's hp) + (ADDITIONAL NET HEALTH PER PLAYER IN RANGE) * <skill.var.amount_targets>
# (The last argument is just the variable for number of players, don't touch it.)

dyerftumShaman_em_target_check:
  Cooldown: 9999
  Skills:
  - delay 5
  - skill{s=dyerftumShaman_em_target_checkB} @pir{r=140} #MODIFY THE RANGE TO CHECK FOR PLAYERS
# GUIDE TO CUSTOMIZE HEALTH SCALING
dyerftumShaman_em_target_checkB:
  Conditions:
  Skills:
  - setvariable{var=caster.targets;type=float;val=<skill.targets>}
  - variablesubtract{var=caster.targets;amount=1} @self ?targets{a=3}
  - variablesubtract{var=caster.targets;amount=2} @self ?targets{a=4to6}
  - variablesubtract{var=caster.targets;amount=3} @self ?targets{a=7to9}
  - variablesubtract{var=caster.targets;amount=5} @self ?targets{a=>10}


