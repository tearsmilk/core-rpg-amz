  - Aura{auraName=dyerftum2_emrage_aura;onTick=dyerftum2_emrage_trigger_execute;interval=5;duration=300;mergeSameCaster=true} @self
dyerftum2_emrage_trigger_execute:
  Cooldown: 10
  Conditions:
  - incombat true
  - variableEquals{var=caster.skillxd;value="hurtedvbad"} false
