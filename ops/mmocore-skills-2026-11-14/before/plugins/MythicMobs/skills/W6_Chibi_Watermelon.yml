  - effect:sound{s=entity.slime.squish;volume=1.0;pitch=0.8} @origin
  - effect:sound{s=block.amethyst_block.break;volume=0.8;pitch=1.2} @origin
  - effect:particles{particle=block;material=GOLD_BLOCK;amount=20;hS=.4;vS=.2;speed=0.1;y=0.3} @origin
  - effect:particles{particle=block;material=REDSTONE_BLOCK;amount=12;hS=.5;vS=.1;speed=0.1;y=0.1} @origin
  - effect:particles{p=end_rod;amount=8;hS=.4;vS=.4;speed=0.05;y=0.4} @origin
