cancel_damage:
  Skills:
  - CancelEvent

w6_chibi_step:
  Skills:
  - effect:sound{s=entity.wolf.step;volume=0.5;pitch=2.0} @self

w6_chibi_interact:
  Cooldown: 3
  Skills:
  - effect:particles{particle=HEART;amount=2;s=0.1;hs=0.1;vs=0.1;delay=5;repeat=2;repeatInterval=10;} @SelfLocation{y=1.1} ~onInteract
  - state{s=interact} @self ~onInteract
  - effect:sound{s=entity.allay.item_given;volume=1.0;pitch=1.0} @self

w6_chibi_fidget:
  Cooldown: 5
  Conditions:
  - incombat false
  - moving false
  Skills:
  - effect:sound{s=entity.allay.item_given;volume=1.0;pitch=1.0} @self
  - state{s=fidget;speed=1.5} @self

w6_chibi_knight_attack:
  Skills:
  - CancelEvent
  - skill{s=w6_chibi_knight_attack2}

w6_chibi_knight_attack2:
  Cooldown: 3
  Skills:
  - effect:sound{s=entity.allay.item_taken;volume=1.0;pitch=1.0} @self 0.5
  - effect:sound{s=item.trident.throw;volume=0.7;pitch=0.8;delay=15} @self 
  - setAI{ai=false} @self
  - setAI{ai=true;delay=30} @self
  - state{s=attack;delay=5} @self
  - totem{ch=5;oH=w6_chibi_knight_damage;int=1;hR=2;vR=1;md=2;hnp=true;delay=18;hp=false} @forward{f=1}

w6_chibi_knight_damage:
  Skills:
  - potion{type=SLOW;duration=15;level=6;p=false}
  - effect:particles{particle=CRIT;amount=5;hS=.2;vS=.2;speed=1;y=0.5}
  - damage{a=<mob.damage>}

w6_chibi_archer_attack:
  Skills:
  - CancelEvent
  - skill{s=w6_chibi_archer_attack2}

w6_chibi_archer_attack2:
  Cooldown: 3
  Skills:
  - effect:sound{s=entity.allay.item_taken;volume=1.0;pitch=1.0} @self 0.5
  - state{s=attack} @self
  - setAI{ai=false} @self
  - setAI{ai=true;delay=30} @self
  - effect:sound{s=item.crossbow.quick_charge_2;volume=0.7;pitch=1.0} @self
  - effect:sound{s=entity.skeleton.shoot;volume=0.7;pitch=1.0;delay=22} @self
  - shoot{type=ARROW;velocity=3;damage=<mob.damage>;delay=22} @target

w6_chibi_wizard_attack:
  Skills:
  - CancelEvent
  - skill{s=w6_chibi_wizard_attack2}

w6_chibi_wizard_attack2:
  Cooldown: 8
  Skills:
  - effect:particles{particle=portal;amount=15;hS=0.3;vS=0.3;speed=0;forwardOffset=0;sideOffset=0;y=0} @ModelPart{m=w6_chibi_wizard;p=staff_cube} @ModelPart{m=w6_chibi_wizard;p=staff_cube}
  - effect:sound{s=entity.allay.item_taken;volume=1.0;pitch=1.0} @self 0.5
  - state{s=attack} @self
  - setAI{ai=false} @self
  - setAI{ai=true;delay=30} @self
  - effect:sound{s=entity.illusioner.cast_spell;volume=0.7;pitch=1.3;delay=10} @self
  - missile{oT=w6_chibi_wizard_missile;onHit=w6_chibi_wizard_damage;in=6;v=3;i=1;hR=1;vR=1;md=100;mr=25;hnp=true;hO=0;vO=0;sE=true;sB=true;hs=false;hfs=0;syo=1.1;tyo=1.5;delay=10} @target
  - effect:sound{s=entity.illusioner.cast_spell;volume=0.7;pitch=1.3;delay=20} @self
  - missile{oT=w6_chibi_wizard_missile;onHit=w6_chibi_wizard_damage;in=6;v=3;i=1;hR=1;vR=1;md=100;mr=25;hnp=true;hO=0;vO=0;sE=true;sB=true;hs=false;hfs=0;syo=1.1;tyo=1.5;delay=20} @target

w6_chibi_wizard_missile:
  Skills:
  - effect:particles{p=witch;amount=5;speed=0;hS=0.1;vS=0.1} @origin

w6_chibi_wizard_damage:
  Skills:
  - effect:particles{particle=witch;amount=5;hS=.2;vS=.2;speed=1;y=0.5}
  - damage{a=<mob.damage>}
