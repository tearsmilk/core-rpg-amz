###################################################
# PvP Mode
###################################################
pvp-mode:
  cooldown: '&cПодождите {remaining} с, прежде чем снова использовать эту команду.'

  # When you cannot hit another player
  cannot-hit:
    high-level-difference: '&cСлишком большая разница в уровнях, чтобы сражаться с этим игроком.'
    low-level-target: '&cВы не можете сражаться с этим игроком: его уровень слишком низок.'
    low-level-self: '&cВаш уровень слишком низок, чтобы сражаться с другими игроками.'
    pvp-mode-disabled-target: '&cУ этого игрока выключен режим PvP.'
    pvp-mode-disabled-self: '&cУ вас выключен режим PvP.'
    invulnerable-self: '&cВы ещё неуязвимы {left} с.'
    invulnerable-target: '&cЭтот игрок ещё в неуязвимости {left} с.'

  # When using /pvpmode
  toggle:
    on-safe: '&aТеперь вы сможете сражаться с игроками в специальных зонах.'
    on-invulnerable: '&aВы сможете сражаться с игроками через {time} с.'
    off-safe: '&cВы больше не можете сражаться с другими игроками.'

  # Entering/leaving regions
  leave:
    pvp-allowed: '&cВы покинули зону PvP, но ещё уязвимы {remaining} с!'
    pvp-denied: '&cВы покинули зону PvP.'
  enter:
    pvp-mode-on: '&aВы вошли в зону PvP и получили неуязвимость на {time} с!'
    pvp-mode-off: '&aВы вошли в зону PvP. Введите /pvpmode, чтобы сражаться с игроками.'

