###################################################
# Level & Experience
###################################################

level-up:
  sound: ENTITY_PLAYER_LEVELUP,1,2
  # Runs a script on level up. This script is implemented
  # inside file MythicLib/scripts/mmocore_scripts.yml
  script: mmocore_level_up_effect
  message:
    - ''
    - '&eПоздравляем, вы достигли &6{level}&e уровня!'
    - '&eВведите &6/p&e, чтобы посмотреть новые характеристики!'
    - ''
profession-level-up:
  sound: ENTITY_PLAYER_LEVELUP,1,2
  message:
    - ''
    - '&eТеперь ваш уровень в профессии &6{profession}&e — &6{level}&e!'
    - ''
exp-notification:
  message: '&f{profession} &e{progress} &e{ratio}%'
  action-bar: true
  #sound: ENTITY_EXPERIENCE_ORB_PICKUP # Not recommended, can be spammy
death-exp-loss:
  - ''
  - '&4Вы умерли и потеряли {loss} опыта.'
  - ''

# Experience boosters
new-exp-booster-main:
  message:
    - '&e'
    - '&eАктивирован множитель опыта &6×{multiplier}&e!'
    - '&e'
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
new-exp-booster-profession:
  message:
    - '&e'
    - '&eАктивирован множитель опыта &6×{multiplier}&e для профессии &6{profession}&e!'
    - '&e'
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

