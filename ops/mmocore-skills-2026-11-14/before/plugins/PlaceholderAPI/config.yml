# PlaceholderAPI
# Version: 2.12.3
# Created by: extended_clip
# Contributors: https://github.com/PlaceholderAPI/PlaceholderAPI/graphs/contributors
# Issues: https://github.com/PlaceholderAPI/PlaceholderAPI/issues
# Expansions: https://placeholderapi.com/ecloud
# Wiki: https://wiki.placeholderapi.com/
# Discord: https://helpch.at/discord
# If you're seeing performance issues with plugins that use component replacement, or things don't look quite right,
# switch to the replacer provided by adventure itself by changing use_adventure_provided_replacer to true
# No placeholders are provided with this plugin by default.
# Download placeholders: /papi ecloud
check_updates: true
cloud_enabled: true
cloud_sorting: name
boolean:
  'true': 'yes'
  'false': 'no'
date_format: MM/dd/yy HH:mm:ss
detect_malicious_expansions: true
use_adventure_provided_replacer: false
debug: false
expansions:
  vault:
    formatting:
      thousands: k
      millions: M
      billions: B
      trillions: T
      quadrillions: Q
  player:
    ping_value:
      high: 100
      medium: 50
    direction:
      north: N
      south: S
      north_west: NW
      north_east: NE
      east: E
      south_east: SE
      west: W
      south_west: SW
    ping_color:
      medium: '&e'
      high: '&c'
      low: '&a'
  math:
    Disable-Warnings: false
    Rounding: half-up
    Decimals: 3
    Debug: false
  # --- Volya's Skill Casting HUD (added by Mia) ---
  utils:
    shortcuts:
      othermath: '%utils_parseother:[{0}]_math_{1}+1%'
      mana_check: '%utils_uncolor:each_changeoutput_equals_input:{mmocore_bound_{0}}_matcher:noskill_ifmatch:0_else:{utils_trycatch:0_mmocore_skill_parameter_mana:{string_replacecharacters_skill_{mmocore_bound_{0}}}}%'
      # Party HUD: party member N name, or own name when the slot is empty (ParseOther throws on empty names)
      pm: '%changeoutput_equals_input:{mmocore_party_member_{0}}_matcher:_ifmatch:{player_name}_else:{mmocore_party_member_{0}}%'
      noskillcd_check: '%changeoutput_equals_input:{mmocore_bound_{0}}_matcher:noskill_ifmatch:0_else:{mmocore_cooldown_bound_{0}}%'
  string:
    replacements:
      nospace:
        ' ': _
      skill:
        ' ': ''
        é: e
        è: e
        ê: e
        ï: i
        à: a
        ö: o
        ô: o
      small-numbers:
        '0': ₀
        '1': ₁
        '2': ₂
        '3': ₃
        '4': ₄
        '5': ₅
        '6': ₆
        '7': ₇
        '8': ₈
        '9': ₉
    separator: _
