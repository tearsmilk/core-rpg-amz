prefix: "<gray>[</gray><rainbow>MythicHUD</rainbow><gray>]</gray> "

version: "<green>Running MythicHUD <aqua><plugin_version></aqua> (<gold>#<plugin_vcs_branch></gold> - <gold><plugin_vcs_commit></gold>), built <aqua><plugin_build_type></aqua> on <aqua><plugin_build_timestamp>."

info-header: "<gray>Commands, also under /hud and /mh:"
info-version: "<aqua>/mythichud version <dark_gray>- <gray>The version and build this server runs"
info-reload: "<aqua>/mythichud reload [-s] <dark_gray>- <gray>Reload the configs and rebuild the pack"
info-layout: "<aqua>/mythichud layout player|* add|remove|reset layout [-s] <dark_gray>- <gray>Give a player a layout, take one away, or forget it was ever set"
info-popup: "<aqua>/mythichud popup player|* popup 5s [text|text for arg-2] <dark_gray>- <gray>Show a popup for a while, timed in ticks or units such as 20t, 5s or 1m30s"

reload:
  - "<green> MythicHUD has been successfully reloaded."
  - "<bold><red> MAKE SURE TO RELOAD YOUR RESOURCE PACK!"

reload-failed: "<red>MythicHUD could not be reloaded, check the console for details."

layout-add-success: "<green>Successfully added layout '<layout>' to <holder>."
layout-add-fail: "<red><holder> already has layout '<layout>'."

layout-remove-success: "<green>Successfully removed layout '<layout>' from <holder>."
layout-remove-fail: "<red>Could not remove layout '<layout>' from <holder>."

layout-reset-success: "<green>Successfully reset layout '<layout>' on <holder>."

layout-invalid-option: "<red>That option is not valid."

error-hud-holder: "<red>Could not set hud for <holder>."
enabled-hud-holder: "<green>Enabled huds for <holder>."
disabled-hud-holder: "<red>Disabled huds for <holder>"
