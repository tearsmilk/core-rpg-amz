# rezusmenu — меню /menuses и RPG-инвентарь. После правки: /menuses reload (или amazake system reload rezusmenu).
# Тексты — MiniMessage.

messages:
  prefix: "<dark_gray>[<gold>Меню</gold>]</dark_gray> "

# Родная панель Minecraft по /menuses.
dialog:
  title: "<gold>Меню сервера</gold>"
  body: "<gray>Выберите, что открыть.</gray>"

# Кнопки панели — все кастомные меню: rpg и profiles.
menus:
  rpg:
    label: "<gold>RPG-инвентарь</gold>"
    tooltip: "<gray>Персонаж, снаряжение и инвентарь</gray>"
  profiles:
    label: "<aqua>Профили</aqua>"
    tooltip: "<gray>Персонажи: выбрать, создать новый</gray>"

# RPG-меню во весь экран: на время меню игрок — наблюдатель высоко над миром и стоит на месте, мышь двигает курсор,
# ЛКМ — нажать, пробел — курсор в центр, Shift — выйти. При первом входе — калибровка экрана (око Края в угол).
# Картинки меню — из ресурспака (assets/rezusmenu и assets/minecraft/shaders, см. pack/ в исходниках системы):
# без него — пустые квадраты, а шейдерный курсор идёт против мыши.
rpg:
  # Скорость курсора-глифа (art.shader-cursor: false) и ока при калибровке: сколько экрана за градус поворота мыши.
  cursor-speed: 0.045
  # Пока меню открыто, игрок не получает урона.
  invulnerable: true
  # Как часто обновлять предметы и значения, тиков.
  refresh-ticks: 10
  # Писать в консоль каждый клик: откуда пришёл (spectate — ЛКМ наблюдателя, right-click, swing), где курсор
  # (пиксели холста 704×400) и какая кнопка под ним.
  debug-clicks: false
  # Значения из PlaceholderAPI. По умолчанию — RoyalQuestClasses (%hl_…%) и MMOCore (%mmocore_…%), как в MythicHUD.
  # Не подставилось — «—» (уровень и опыт — ванильные).
  placeholders:
    level: "%hl_level%"
    exp: "%hl_exp%"
    exp-needed: "%hl_exp_needed%"
    class: "%hl_class%"
    class-key: "%hl_class_key%"
    profession: "%hl_profession%"
    profession-key: "%hl_profession_key%"
    needs-profession: "%hl_needs_profession%"
    skill-points: "%mmocore_skill_points%"
    attribute-points: "%hl_stats_available%"
  # Третья полоска — мана или энергия, как в MythicHUD. Сначала по ключу класса (class-key), иначе по имени ресурса
  # MMOCore: равно energy-name — энергия, иначе мана.
  resource:
    name: "%mmocore_mana_name%"
    energy-name: "Энергия"
    classes:
      swordsman: energy
      archer: energy
      thief: energy
      mage: mana
    types:
      mana: {label: "Мана", current: "%mmocore_mana%", max: "%mmocore_stat_max_mana%"}
      energy: {label: "Энергия", current: "%mmocore_mana%", max: "%mmocore_stat_max_mana%"}
  # Параметры слева внизу (2 × 2). default — подпись, если плейсхолдер названия не подставился.
  stats:
    - {name: "%hl_stats_primary_name%", default: "Сила", value: "%hl_stats_primary%"}
    - {name: "Ловкость", value: "%hl_stats_agility%"}
    - {name: "Выносливость", value: "%hl_stats_stamina%"}
    - {name: "Удача", value: "%hl_stats_luck%"}
  # Классы RoyalQuestClasses (ключ = %hl_class_key%): название, иконка в левом крыле и профессии.
  classes:
    swordsman: {name: "Мечник", icon: IRON_SWORD, professions: [crusader, dark_knight]}
    archer: {name: "Стрелок", icon: BOW, professions: [hunter, sniper]}
    mage: {name: "Маг", icon: BLAZE_ROD, professions: [wizard, warlock]}
    thief: {name: "Вор", icon: GOLDEN_SWORD, professions: [rogue, assassin]}
  professions:
    crusader: "Крестоносец"
    dark_knight: "Тёмный рыцарь"
    hunter: "Охотник"
    sniper: "Снайпер"
    wizard: "Волшебник"
    warlock: "Чернокнижник"
    rogue: "Разбойник"
    assassin: "Ассасин"
  # Иконка в левом крыле, пока класс не выбран.
  no-class-icon: BOOK
  # Слоты бижутерии (амулет, два кольца, тотем, артефакт): что в них можно положить. types — типы MMOItems
  # (MMOITEMS_ITEM_TYPE), materials — материалы; подходит что-то одно. Оба списка пустые — что угодно.
  # Предметы хранятся в данных игрока и не выпадают. Характеристики бижутерии считает seal-magic 1.2.0 (seals.yml → jewelry).
  # Подстроки azerus_*_ / relicitems: ловят Nexo-предметы (их id и модель есть в NBT). Кольца — только 24 оставленных (id + путь модели). Тотемы — azerus_artifact_001–006 (items/azerus_totems.yml), артефакты — 007–011, 015–017.
  # Кольца MMOItems (тип ACCESSORY, AZERUS_RING_NNN — 24 шт. в accessory.yml) проходят по типу ACCESSORY и по MMOITEMS_ITEM_ID; удалённые кольца seal-magic
  # всё равно не считает (detect: none). ACCESSORY убран из амулета: кольцо MMOItems не должно влезать в слот амулета.
  # Слоты бижутерии: что в них можно положить. types — типы MMOItems, materials — материалы, nbt — подстрока
  # в NBT предмета (для обычных предметов, настроенных через NBT): например 'jewel:"ring"' для предмета с
  # custom_data {jewel:"ring"} или 'myplugin:ring' для PDC-метки плагина. Подходит хоть одно правило — можно.
  jewelry:
    amulet: {types: [AMULET, NECKLACE], materials: [], nbt: ['jewel:"amulet"', 'azerus_amulet_', 'azerus_amulets/amulet_']}
    ring: {types: [RING, ACCESSORY], materials: [], nbt: ['jewel:"ring"', 'azerus_ring_049', 'azerus_ring_050', 'azerus_ring_051', 'azerus_ring_052', 'azerus_ring_054', 'azerus_ring_057', 'azerus_ring_058', 'azerus_ring_060', 'azerus_ring_062', 'azerus_ring_065', 'azerus_ring_067', 'azerus_ring_070', 'azerus_ring_072', 'azerus_ring_074', 'azerus_ring_075', 'azerus_ring_080', 'azerus_ring_081', 'azerus_ring_082', 'azerus_ring_083', 'azerus_ring_085', 'azerus_ring_091', 'azerus_ring_095', 'azerus_ring_098', 'azerus_ring_099', 'rings_azerus/ring_049', 'rings_azerus/ring_050', 'rings_azerus/ring_051', 'rings_azerus/ring_052', 'rings_azerus/ring_054', 'rings_azerus/ring_057', 'rings_azerus/ring_058', 'rings_azerus/ring_060', 'rings_azerus/ring_062', 'rings_azerus/ring_065', 'rings_azerus/ring_067', 'rings_azerus/ring_070', 'rings_azerus/ring_072', 'rings_azerus/ring_074', 'rings_azerus/ring_075', 'rings_azerus/ring_080', 'rings_azerus/ring_081', 'rings_azerus/ring_082', 'rings_azerus/ring_083', 'rings_azerus/ring_085', 'rings_azerus/ring_091', 'rings_azerus/ring_095', 'rings_azerus/ring_098', 'rings_azerus/ring_099', 'AZERUS_RING_049', 'AZERUS_RING_050', 'AZERUS_RING_051', 'AZERUS_RING_052', 'AZERUS_RING_054', 'AZERUS_RING_057', 'AZERUS_RING_058', 'AZERUS_RING_060', 'AZERUS_RING_062', 'AZERUS_RING_065', 'AZERUS_RING_067', 'AZERUS_RING_070', 'AZERUS_RING_072', 'AZERUS_RING_074', 'AZERUS_RING_075', 'AZERUS_RING_080', 'AZERUS_RING_081', 'AZERUS_RING_082', 'AZERUS_RING_083', 'AZERUS_RING_085', 'AZERUS_RING_091', 'AZERUS_RING_095', 'AZERUS_RING_098', 'AZERUS_RING_099']}
    totem: {types: [TOTEM], materials: [TOTEM_OF_UNDYING], nbt: ['jewel:"totem"', 'azerus_artifact_001', 'azerus_artifact_002', 'azerus_artifact_003', 'azerus_artifact_004', 'azerus_artifact_005', 'azerus_artifact_006', 'azerus_artifacts/artifact_001', 'azerus_artifacts/artifact_002', 'azerus_artifacts/artifact_003', 'azerus_artifacts/artifact_004', 'azerus_artifacts/artifact_005', 'azerus_artifacts/artifact_006']}
    artifact: {types: [ARTIFACT, RELIC, ORNAMENT, TALISMAN], materials: [], nbt: ['jewel:"artifact"', 'azerus_artifact_007', 'azerus_artifact_008', 'azerus_artifact_009', 'azerus_artifact_010', 'azerus_artifact_011', 'azerus_artifact_015', 'azerus_artifact_016', 'azerus_artifact_017', 'azerus_artifacts/artifact_007', 'azerus_artifacts/artifact_008', 'azerus_artifacts/artifact_009', 'azerus_artifacts/artifact_010', 'azerus_artifacts/artifact_011', 'azerus_artifacts/artifact_015', 'azerus_artifacts/artifact_016', 'azerus_artifacts/artifact_017', 'relicitems:relic_']}
    # 1.0.1: класс и уровень при надевании в 5 слотов. Сначала NBT MMOItems
    # (MMOITEMS_REQUIRED_CLASS, MMOITEMS_LEVEL), иначе этот список — для Nexo-предметов без NBT.
    # Пустой список классов = для всех. Ключи — id Nexo / MMOItems в нижнем регистре.
    # Settings.jewelry читает только amulet/ring/totem/artifact, этот блок ему не мешает.
    bind:
      item-classes:
        azerus_ring_051: [swordsman, crusader, dark_knight]
        azerus_ring_074: [swordsman, crusader, dark_knight]
        azerus_ring_052: [crusader]
        azerus_ring_067: [crusader]
