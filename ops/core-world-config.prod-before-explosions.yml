# core-world — правила мира. Каждый раздел — отдельный модуль со своим переключателем.
# После правки: amazake system reload core-world (или /coreworld reload).

# Голод.
hunger:
  # true — голода нет: еда не убывает, шкала всегда полная, здоровье восстанавливается как у сытого игрока.
  # false — обычный ванильный голод.
  disabled: true
  # Миры, где голод выключен. Пустой список — во всех мирах. Например: [world, world_nether]
  worlds: []
  # true — держать насыщение полным (20): быстрая регенерация, как сразу после еды.
  # false — насыщение не трогается (регенерация медленнее, но шкала еды всё равно не падает).
  keep-saturation: true

# Появление мобов.
spawn:
  # Какие мобы не появляются (имена EntityType). Пустой список — модуль ничего не делает.
  blocked: [BAT]
  # Миры, где запрещено. Пустой список — во всех мирах.
  worlds: []
  # Причины появления, которые всё равно пропускаются: COMMAND — /summon, CUSTOM — плагины.
  # Добавьте SPAWNER_EGG, чтобы работали яйца призыва.
  allow-reasons: [COMMAND, CUSTOM]
  # true — уже живущие такие мобы (без своего имени) убираются при загрузке их чанка.
  remove-existing: true

# Погода.
weather:
  # true — дождя (снегопада) и грозы нет: начало дождя отменяется, идущий дождь снимается сразу.
  # Команда /weather rain тоже не сработает, пока модуль включён.
  disabled: true
  # Миры, где дождя нет. Пустой список — во всех мирах.
  worlds: []
