# Посох Лунного Странника: объёмная модель (source/Посох-лунного-странника.bbmodel, собирается tools/moon_staff.py).
# item_model указывает на своё определение pack/assets/azerus/items/moon_staff.json: в слоте/на земле/в рамке — основа,
# в руках при использовании (using_item) — поза «колдует» moon_staff_cast (самоцвет светится ярче).
# consumable даёт ванильное «удержание ПКМ» с анимацией лука: 3600 с, без звука/частиц/эффектов — посох не тратится
# (core_magic отменяет использование раньше, а PlayerItemConsumeEvent отменяет на всякий случай; он же восстанавливает
# компонент, если его нет). Магический круг и луч — система core-python/scripts/core_magic (по id azerus_moon_staff),
# их вид — модели moon_staff_circle / moon_staff_beam и шейдерный хук azerus:moonstaff_* (nexo-items/README.md).
azerus_moon_staff:
  itemname: <gradient:#ffd36a:#ff4a5a:#7fd8ff>Посох Лунного Странника</gradient>
  material: DIAMOND_SWORD
  lore:
    - "<gray>Посох странника, что ходит"
    - "<gray>лунными дорогами между мирами."
    - ""
    - "<#7fd8ff>✦ <white>Луч</white><gray>: зажмите <white>ПКМ</white> на <white>3 с</white> — магический круг;"
    - "<gray>   отпустите — <white>луч света</white> пронзит всех на пути:"
    - "<gray>   <#ff6a6a>10 урона</#ff6a6a>, до <white>29 блоков</white>, перезарядка <white>3 с</white>."
    - "<#7fd8ff>✦ <white>Барьер</white><gray>: зажмите <white>ПКМ</white> на <white>1 с</white> — стена"
    - "<gray>   из шестигранников на <white>10 с</white>, гасит лучи магии;"
    - "<gray>   перезарядка <white>15 с</white>."
    - "<#7fd8ff>✦ <white>Shift + ЛКМ</white><gray> — сменить заклинание."
  Pack:
    model: azerus:item/moon_staff
  Components:
    item_model: azerus:moon_staff
    consumable:
      animation: BOW
      sound: minecraft:intentionally_empty
      consume_particles: false
      consume_duration: 3600.0s
