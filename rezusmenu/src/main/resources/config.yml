# rezusmenu — меню /menuses и RPG-инвентарь. После правки: /menuses reload (или amazake system reload rezusmenu).
# Тексты — MiniMessage.

messages:
  prefix: "<dark_gray>[<gold>Меню</gold>]</dark_gray> "

# Родная панель Minecraft по /menuses.
dialog:
  title: "<gold>Меню сервера</gold>"
  body: "<gray>Выберите, что открыть.</gray>"

# Кнопки панели — все кастомные меню. Готово пока одно: rpg.
menus:
  rpg:
    label: "<gold>RPG-инвентарь</gold>"
    tooltip: "<gray>Персонаж, снаряжение и инвентарь</gray>"

# RPG-меню во весь экран: на время меню игрок — наблюдатель и стоит на месте, мышь двигает курсор,
# ЛКМ — нажать, пробел — курсор в центр, Shift — выйти. При первом входе — калибровка экрана (око Края в угол).
# Картинки меню — из ресурспака (assets/rezusmenu, см. pack/ в исходниках системы): без него — фиолетово-чёрные квадраты.
rpg:
  # Скорость курсора: сколько экрана проходит курсор за градус поворота мыши.
  cursor-speed: 0.045
  # Насколько точка «пассажиров» игрока выше его глаз (1.8 − 1.62). Если меню съехало вверх или вниз — поправить.
  eye-offset: 0.18
  # Размер игрока на время меню (0.0625..1). Экран крепится над головой, а камера — в глазах; чем меньше игрок,
  # тем меньше этот зазор и тем неподвижнее меню, когда водишь мышью вверх-вниз. 0.0625 — минимум.
  player-scale: 0.0625
  # Пока меню открыто, игрок не получает урона.
  invulnerable: true
  # Как часто обновлять предметы и значения, тиков.
  refresh-ticks: 10
  # Значения из PlaceholderAPI (core-rpg). Пусто или не подставилось — берётся ванильное или «—».
  placeholders:
    level: "%core_level%"
    exp: "%core_exp%"
    exp-needed: "%core_exp_needed%"
    class: "%core_class%"
    # Маны в core-rpg пока нет: полоска покажет «Мана —».
    mana: ""
    mana-max: ""
  # Параметры в левой колонке (по два в строке).
  stats:
    - {name: "%core_stat_primary_name%", value: "%core_stat_primary_total%"}
    - {name: "%core_stat_agility_name%", value: "%core_stat_agility_total%"}
    - {name: "%core_stat_stamina_name%", value: "%core_stat_stamina_total%"}
    - {name: "%core_stat_luck_name%", value: "%core_stat_luck_total%"}
  # Вкладка «Снаряжение»: строки характеристик. Строка, чей плейсхолдер не подставился, скрывается.
  equipment-lines:
    - {name: "Урон (бонус)", value: "%core_aspect_attack_damage%"}
    - {name: "Броня (бонус)", value: "%core_aspect_armor%"}
    - {name: "Здоровье (бонус)", value: "%core_aspect_max_health%"}
    - {name: "Шанс крита, %", value: "%core_crit_chance%"}
    - {name: "Урон крита, %", value: "%core_aspect_crit_damage%"}
    - {name: "Точность", value: "%core_aspect_accuracy%"}
    - {name: "Уклонение", value: "%core_aspect_evasion%"}
    - {name: "Сопротивление", value: "%core_aspect_resistance%"}
    - {name: "Заточка в руке", value: "%core_sharpen_text%"}
    - {name: "Печать в руке", value: "%core_seal%"}

# Чужой HUD (например, MythicHUD на боссбарах) поверх меню: спрятать на время меню и вернуть после.
# Команды консоли, {player} — ник. Выполняются при открытии меню и при закрытии (выход, выключение системы,
# возврат после падения сервера). Пусто — ничего не делать.
# Чужой HUD (MythicHUD — боссбары с модельками) прячется, пока открыто меню: меню нарисовано в мире и не может
# перекрыть интерфейс клиента. Команды консоли, {player} — ник. Если игрок вышел посреди меню, HUD вернётся при входе.
hud:
  hide-commands:
    - "mythichud layout {player} remove mmohud-layout -s"
    - "mythichud layout {player} remove partyhud-mmo-layout -s"
    - "mythichud layout {player} remove skill_casting_bar-layout -s"
  show-commands:
    - "mythichud layout {player} add mmohud-layout -s"
    - "mythichud layout {player} add partyhud-mmo-layout -s"
    - "mythichud layout {player} add skill_casting_bar-layout -s"

# Картинка меню — шрифт rezusmenu:ui из ресурспака Nexo. Если картинка в игре съехала на пиксель-два относительно
# надписей и иконок, подвинуть её здесь (пиксели картинки; x — вправо, y — вверх).
art:
  glyph-offset-x: 0.5
  glyph-offset-y: 2.0
