# core_items — используемые предметы Nexo (ключ — id предмета Nexo).
# Свиток телепортации: ПКМ → под ногами фиолетовый круг, отсчёт «Телепортация через N» (двигаться нельзя —
# сдвинулся больше чем на move-tolerance блока, и всё отменяется), затем экран темнеет, игрок переносится командой,
# затемнение уходит. Свиток тратится только при успешном переносе.
scrolls:
  azerus_teleport_scroll:
    seconds: 5                      # активация (секунд неподвижно)
    command: "warp 123"             # куда переносит: команда без «/»
    run-as: player                  # player — от имени игрока; console — из консоли ({player} — ник)
    place: "Зиркония"               # подпись на затемнении
    consume: true                   # тратить свиток
    cooldown-seconds: 3             # пауза после отмены/переноса
    move-tolerance: 0.35            # насколько можно сдвинуться (блоков), прежде чем телепорт отменится
    dark-fade-in-ticks: 10          # экран темнеет за столько тиков, затем перенос
    dark-hold-ticks: 30             # сколько держится чернота после переноса
    dark-fade-out-ticks: 20         # затемнение уходит
    circle-diameter: 3.2            # диаметр круга (блоков)

messages:
  countdown: "<green>Телепортация через <n>"
  dont-move: "<red>Не двигайтесь!"
  cancelled: "<red>Телепортация отменена — вы сдвинулись."
  busy: "<gray>Телепортация уже идёт."
  cooldown: "<gray>Подождите <s> с."
  moving-title: "<#4f8dff>Перемещение"
