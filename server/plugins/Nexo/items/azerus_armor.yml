# Кастомная броня AZERUS — Python-система custom_armor (core-python). Выдать: /carmor give <комплект> [часть|all] [игрок]
# (или /nexo give <ник> <id>: характеристики система повесит сама при надевании).
# Вид — Nexo CustomArmor (как nexo_defaults/nexo_armor.yml): слои 64x32 у нагрудника комплекта, Nexo сам собирает
# equipment-модель azerus:<комплект>; у каждой части equippable с этим asset_id. Иконки — Pack.texture.
# Характеристики (броня, здоровье, бонусы комплекта) — НЕ здесь, а в systems/core-python/scripts/custom_armor/sets.yml.
# Текстуры рисует nexo-items/tools/armor_textures.py; пиксели с альфой 251 светятся (шейдер брони entity.fsh).


# ---- guren (紅蓮) ----
azerus_guren_helmet:
  itemname: "<#d4334a>Багровый шлем"
  material: NETHERITE_HELMET
  lore:
  - "<gray>Выкован в том же пламени,"
  - "<gray>что и Багровая коса."
  Pack:
    texture: azerus:item/armor/guren_helmet
  CustomArmor:
    id: guren
  Components:
    equippable:
      slot: HEAD
      asset_id: azerus:guren
    tooltip_style: royaltooltips:guardian
azerus_guren_chestplate:
  itemname: "<#d4334a>Багровый нагрудник"
  material: NETHERITE_CHESTPLATE
  lore:
  - "<gray>Выкован в том же пламени,"
  - "<gray>что и Багровая коса."
  Pack:
    texture: azerus:item/armor/guren_chestplate
  CustomArmor:
    id: guren
    layer1: azerus:item/armor/guren_armor_layer_1
    layer2: azerus:item/armor/guren_armor_layer_2
  Components:
    equippable:
      slot: CHEST
      asset_id: azerus:guren
    tooltip_style: royaltooltips:guardian
azerus_guren_leggings:
  itemname: "<#d4334a>Багровые поножи"
  material: NETHERITE_LEGGINGS
  lore:
  - "<gray>Выкован в том же пламени,"
  - "<gray>что и Багровая коса."
  Pack:
    texture: azerus:item/armor/guren_leggings
  CustomArmor:
    id: guren
  Components:
    equippable:
      slot: LEGS
      asset_id: azerus:guren
    tooltip_style: royaltooltips:guardian
azerus_guren_boots:
  itemname: "<#d4334a>Багровые сапоги"
  material: NETHERITE_BOOTS
  lore:
  - "<gray>Выкован в том же пламени,"
  - "<gray>что и Багровая коса."
  Pack:
    texture: azerus:item/armor/guren_boots
  CustomArmor:
    id: guren
  Components:
    equippable:
      slot: FEET
      asset_id: azerus:guren

