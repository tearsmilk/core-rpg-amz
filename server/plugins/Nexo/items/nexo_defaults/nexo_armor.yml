# Items sharing a CustomArmor.id share one equipment-model, so the layers only need defining once per set.
# The helmet is a 3D model worn on the head, it defines the equippable-slot without an asset-id so no
# armor-texture renders underneath it.
forest_helmet:
  itemname: Forest Helmet
  material: CHAINMAIL_HELMET
  Pack:
    model: nexo:item/nexo_armor/forest_helmet
  Components:
    equippable:
      slot: HEAD
    tooltip_style: royaltooltips:guardian
forest_chestplate:
  itemname: Forest Chestplate
  material: CHAINMAIL_CHESTPLATE
  Pack:
    texture: nexo:item/nexo_armor/forest_chestplate
  CustomArmor:
    id: forest
    layer1: nexo:item/nexo_armor/forest_armor_layer_1
    layer2: nexo:item/nexo_armor/forest_armor_layer_2
  Components:
    equippable:
      slot: CHEST
      asset_id: nexo:forest
    tooltip_style: royaltooltips:guardian
forest_leggings:
  itemname: Forest Leggings
  material: CHAINMAIL_LEGGINGS
  Pack:
    texture: nexo:item/nexo_armor/forest_leggings
  CustomArmor:
    id: forest
  Components:
    equippable:
      slot: LEGS
      asset_id: nexo:forest
    tooltip_style: royaltooltips:guardian
forest_boots:
  itemname: Forest Boots
  material: CHAINMAIL_BOOTS
  Pack:
    texture: nexo:item/nexo_armor/forest_boots
  CustomArmor:
    id: forest
  Components:
    equippable:
      slot: FEET
      asset_id: nexo:forest

# An elytra needs its own id, wings sharing a model with armor-layers would render on the chestplate too
    tooltip_style: royaltooltips:guardian
forest_elytra:
  itemname: Forest Elytra
  material: ELYTRA
  Pack:
    texture: nexo:item/nexo_armor/forest_elytra_icon
  CustomArmor:
    id: forest_elytra
    elytra: nexo:item/nexo_armor/forest_elytra
  Components:
    equippable:
      slot: CHEST
      asset_id: nexo:forest_elytra
    tooltip_style: royaltooltips:guardian
forest_wolf_armor:
  itemname: Forest Wolf Armor
  material: WOLF_ARMOR
  Pack:
    texture: nexo:item/nexo_armor/forest_wolf_armor_icon
  CustomArmor:
    id: forest_wolf_armor
    wolf_armor: nexo:item/nexo_armor/forest_wolf_armor
  Components:
    equippable:
      slot: BODY
      asset_id: nexo:forest_wolf_armor
      allowed_entity_types:
      - WOLF
# PAPER has no equippable-component of its own, the slot and allowed entities come from the defined layer
    tooltip_style: royaltooltips:guardian
forest_llama_armor:
  itemname: Forest Llama Carpet
  material: PAPER
  Pack:
    texture: nexo:item/nexo_armor/forest_llama_armor_icon
  CustomArmor:
    id: forest_llama_armor
    llama_armor: nexo:item/nexo_armor/forest_llama_armor
  Components:
    equippable:
      slot: BODY
      asset_id: nexo:forest_llama_armor
      allowed_entity_types:
      - LLAMA
      - TRADER_LLAMA
    tooltip_style: royaltooltips:guardian
forest_horse_armor:
  itemname: Forest Horse Armor
  material: DIAMOND_HORSE_ARMOR
  Pack:
    texture: nexo:item/nexo_armor/forest_horse_armor_icon
  CustomArmor:
    id: forest_horse_armor
    horse_armor: nexo:item/nexo_armor/forest_horse_armor
  Components:
    equippable:
      slot: BODY
      asset_id: nexo:forest_horse_armor
      allowed_entity_types:
      - HORSE
    tooltip_style: royaltooltips:guardian
