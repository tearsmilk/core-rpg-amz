# ---------------------------------------------------------------- TNT_THROW (Бросок динамита)
# No vanilla TNT entity any more: a thrown "dynamite" projectile that, on
# impact (enemy or block), plays explosion particles/sound and deals AoE
# damage <modifier.damage> in <modifier.radius>. No block damage, no fire,
# no self-damage, allies/PvP-protected players are skipped by can_target.
rq_tnt_throw:
  public: true
  mechanics:
    - 'sound{sound=ENTITY_TNT_PRIMED;volume=1;pitch=1.3}'
    - 'sound{sound=ENTITY_SNOWBALL_THROW;volume=1;pitch=0.6}'
    - 'projectile{speed=20;life_span=24;size=0.4;offense=true;hits=1;stop_on_block=true;ignore_passable=true;tick=rq_tnt_tick;hit_entity=rq_tnt_ent;hit_block=rq_tnt_boom}'
rq_tnt_tick:
  mechanics:
    - 'particle{particle=SMOKE;amount=2;x=0.05;y=0.05;z=0.05}'
    - 'particle{particle=FLAME;amount=1}'
rq_tnt_ent:
  mechanics:
    - 'script{name=rq_tnt_boom;target_location={type=target;position=BODY}}'
rq_tnt_boom:
  mechanics:
    - 'sound{sound=ENTITY_GENERIC_EXPLODE;volume=1.5;pitch=1}'
    - 'particle{particle=EXPLOSION_EMITTER;amount=1}'
    - 'particle{particle=EXPLOSION;amount=8;x=1.2;y=0.6;z=1.2}'
    - 'particle{particle=LARGE_SMOKE;amount=25;x=1.2;y=0.6;z=1.2;speed=0.05}'
    - 'particle{particle=FLAME;amount=30;x=1;y=0.5;z=1;speed=0.08}'
    - 'script{name=rq_tnt_hit;target={type=nearby_entities;radius="<modifier.radius>"}}'
rq_tnt_hit:
  conditions:
    - 'can_target'
  mechanics:
    - 'damage{amount="<modifier.damage>";damage_type="SKILL,PHYSICAL"}'

# ---------------------------------------------------------------- BLINK (Скачок)
# Horizontal blink of <modifier.range> blocks (~5) in the facing direction.
# Safe landing: 9 block ray traces (feet/waist/head height x left/center/right
# edge of the player's hitbox). The blink stops 0.5 block before the first
# obstacle, so the player can never end up inside a block. Yaw/pitch kept.
# Not cast (no mana/cooldown) when looking straight up/down.
rq_blink:
  public: true
  conditions:
    - 'boolean{formula="sqrt((<caster.eye_direction.x>)^2 + (<caster.eye_direction.z>)^2) > 0.05"}'
  mechanics:
    - 'set_double{variable=rq_bl_h;value="sqrt((<caster.eye_direction.x>)^2 + (<caster.eye_direction.z>)^2)"}'
    - 'set_double{variable=rq_bl_dx;value="(<caster.eye_direction.x>) / (<rq_bl_h>)"}'
    - 'set_double{variable=rq_bl_dz;value="(<caster.eye_direction.z>) / (<rq_bl_h>)"}'
    - 'set_double{variable=rq_bl_r;value="<modifier.range>"}'
    - 'set_double{variable=rq_bl_d;value="<rq_bl_r> + 0.5"}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28)";y=0.1;z="(<rq_bl_dx>) * (-0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28) + (<rq_bl_dx>)";y=0.1;z="(<rq_bl_dx>) * (-0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="0";y=0.1;z="0"};target={type=custom;relative=true;source=true;x="(<rq_bl_dx>)";y=0.1;z="(<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28)";y=0.1;z="(<rq_bl_dx>) * (0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28) + (<rq_bl_dx>)";y=0.1;z="(<rq_bl_dx>) * (0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28)";y=0.9;z="(<rq_bl_dx>) * (-0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28) + (<rq_bl_dx>)";y=0.9;z="(<rq_bl_dx>) * (-0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="0";y=0.9;z="0"};target={type=custom;relative=true;source=true;x="(<rq_bl_dx>)";y=0.9;z="(<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28)";y=0.9;z="(<rq_bl_dx>) * (0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28) + (<rq_bl_dx>)";y=0.9;z="(<rq_bl_dx>) * (0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28)";y=1.8;z="(<rq_bl_dx>) * (-0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (0.28) + (<rq_bl_dx>)";y=1.8;z="(<rq_bl_dx>) * (-0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="0";y=1.8;z="0"};target={type=custom;relative=true;source=true;x="(<rq_bl_dx>)";y=1.8;z="(<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'ray_trace{mode=BLOCKS;range="<rq_bl_r> + 0.5";ignore_passable=true;source={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28)";y=1.8;z="(<rq_bl_dx>) * (0.28)"};target={type=custom;relative=true;source=true;x="(<rq_bl_dz>) * (-0.28) + (<rq_bl_dx>)";y=1.8;z="(<rq_bl_dx>) * (0.28) + (<rq_bl_dz>)"};hit_block=rq_blink_wall}'
    - 'set_double{variable=rq_bl_t;value="max(0, min(<rq_bl_r>, (<rq_bl_d>) - 0.5))"}'
    - 'particle{particle=PORTAL;amount=40;x=0.3;y=0.8;z=0.3;speed=0.4;target={type=caster}}'
    - 'sound{sound=ENTITY_ENDERMAN_TELEPORT;volume=1;pitch=1.2}'
    - 'teleport{target={type=caster};target_location={type=custom;relative=true;source=true;x="(<rq_bl_dx>) * (<rq_bl_t>)";y=0.01;z="(<rq_bl_dz>) * (<rq_bl_t>)"}}'
    - 'particle{particle=REVERSE_PORTAL;amount=40;x=0.3;y=0.8;z=0.3;speed=0.1;target={type=caster}}'
rq_blink_wall:
  mechanics:
    - 'set_double{variable=rq_bl_d;value="min(<rq_bl_d>, ((<target_location.x>) - (<caster.location.x>)) * (<rq_bl_dx>) + ((<target_location.z>) - (<caster.location.z>)) * (<rq_bl_dz>))"}'
