    azerus_ring_083: [sniper]
    azerus_ring_049: [mage, wizard, warlock]
    azerus_ring_062: [mage, wizard, warlock]
    azerus_ring_057: [wizard]
    azerus_ring_080: [wizard]
    azerus_ring_072: [warlock]
    azerus_ring_082: [warlock]
    azerus_ring_060: [thief, rogue, assassin]
    azerus_ring_095: [thief, rogue, assassin]
    azerus_ring_050: [rogue]
    azerus_ring_091: [rogue]
    azerus_ring_098: [assassin]
    azerus_ring_099: [assassin]
    azerus_artifact_002: [mage, wizard, warlock]
    azerus_artifact_003: [swordsman, crusader, dark_knight, archer, hunter, sniper, thief, rogue, assassin]
    azerus_artifact_006: [thief, rogue, assassin]
    azerus_artifact_008: [swordsman, crusader, dark_knight, thief, rogue, assassin]
