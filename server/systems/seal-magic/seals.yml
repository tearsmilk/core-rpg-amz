    azerus_artifact_016: [mage, wizard, warlock]
    azerus_artifact_017: [mage, wizard, warlock]

  # Минимальный уровень предмета. Нужен, потому что в живых yml Алекса стоит ключ required-level,
  # а MMOItems читает только level → NBT MMOITEMS_LEVEL (required-level игнорируется).
