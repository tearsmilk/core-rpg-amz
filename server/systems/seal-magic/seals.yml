# Магические печати Seal Magic (модуль печатей core-rpg отдельной системой).
# После правки: /seals reload (или /amazake system reload seal-magic).
# 57 печатей перенесены из плагина MagicSeals, 87 добавлены из Royal Quest (royalquest.info) — итого 144.
# Значения перебалансированы по единому бюджету очков (см. docs/economy.html, раздел «Печати»).
#
# Поля печати:
#   name     — название (в лоре: «Печать <name>»)
#   origin   — plugin (из MagicSeals) или royal-quest
#   types    — WEAPON, ARMOR, SHIELD, ACCESSORY (у аксессуаров нет слота в Minecraft: такие типы игнорируются)
#   classes  — any или ключи классов/профессий: swordsman, archer, mage, thief, crusader, dark_knight, sniper, hunter,
#              wizard, warlock, rogue, assassin (как в RoyalQuestClasses). Работает при settings.class-filter: true
#   enabled  — false: печать в каталоге, но не выпадает (бонусы на системах, которых пока нет: опыт, золото, проки)
#   bonuses  — ключ: [зелёная, синяя, фиолетовая, оранжевая]; пустое значение (~) — у этого цвета бонуса нет
#
# Ключи бонусов и как они действуют в этой системе:
#   атрибуты игрока (временные модификаторы, пересчёт при смене экипировки):
#     attack_damage, armor, max_health (2 = сердце), movement_speed (база 0.1), attack_speed (база 4.0),
#     knockback, knockback_resistance (0..1), range (блоки досягаемости до сущностей)
#   бой (раздел combat ниже): resistance (доля 0..1), resistance:<цель> (fire, chaos, undead, humanoid, water, air,
#     earth, poison, animal, arthropod), resistance_pvp, crit_chance (%), crit_damage (%), lifesteal (%),
#     regen (HP/с), heal_on_kill (HP), accuracy, evasion, status_bleed, status_poison, status_burn (шанс %),
#     damage_vs:<цель> (%; fire, air, earth, water, monster)
#   очки параметров core-rpg: stat_primary, stat_agility, stat_stamina, stat_luck — пересчитываются в бонусы выше по
#     разделу stat-conversion
#   мана / энергия MMOCore (у магов ресурс зовётся «Мана», у остальных классов «Энергия» — это одна и та же мана
#     MMOCore): max_mana (% к максимуму, стат MythicLib MAX_MANA), mana_regen (% к восстановлению, MANA_REGENERATION).
#     Старый ключ resource читается как max_mana. Нужен MythicLib (с MMOCore); без него не действуют.
#   не действуют (такие печати выключены): exp_bonus, gold_bonus, proc

# ---------------------------------------------------------------------------------------------------------------------
# Настройки печатей. Неверное значение — предупреждение в консоли и значение по умолчанию.
# ---------------------------------------------------------------------------------------------------------------------
settings:
  # Веса цветов при наложении (камень) и смене (кристалл крови) печати. Относительные: шанс цвета = вес / сумма.
  # Целые 0..1000000; если все нули — берутся 60/27/10/3 (60% / 27% / 10% / 3%).
  roll-weights:
    green: 60
    blue: 27
    purple: 10
    orange: 3

  # Шанс (0..100 %), что арконитовый сургуч вместе с кристаллом крови перебросит цвет печати (название остаётся).
  # Если не сработал — оба расходника тратятся, цвет не меняется (Сердце Аркона при этом не тратится).
  arkonite-reroll-chance: 100

  # true — печать выбирается только из подходящих классу или профессии игрока (поле classes у печати, any — всем).
  # Класс и профессия берутся из RoyalQuestClasses (без него — из скрытого класса MMOCore, который ставит RQ);
  # профессия считается вместе со своим базовым классом (crusader → swordsman + crusader). Игрок без класса
  # (human) получает только печати «any». Дополнительно можно явно выдать право core.seals.class.<ключ>
  # (у операторов эти права по умолчанию не считаются). Если по классу ничего не подошло — только печати «any».
  # false — из всех печатей этого типа предмета.
  class-filter: true

  # Имя сущности (NPC Citizens, житель, стойка для брони…), правый клик по которой открывает меню мастера.
  # Цвета и регистр не важны. Пустая строка — NPC выключен.
  npc-name: "Мастер зачарования"

  # Заголовок меню мастера (MiniMessage).
  menu-title: "<dark_purple>Наложение печати"

  # Расходники: материал предмета (имя Material, например AMETHYST_SHARD, EMERALD) и название (MiniMessage).
  # Расходник узнаётся по скрытой метке, а не по виду, поэтому смена материала или названия старые предметы не ломает
  # (но новые не будут складываться со старыми в одну стопку).
  #   stone_c / stone_b / stone_a — камни для первого наложения на предметы грейда C / B (алмаз, золото) / A (незерит)
  #   blood_crystal — смена печати; arkonite_wax — вместе с кристаллом меняет только цвет
  #   wax — оранжевый цвет; account_wax — оранжевый цвет и привязка предмета к игроку
  #   heart — вместе с камнем или кристаллом: цвет не ниже синего
  # Выдать: /seals give <ник> <расходник|all|stones|wax> [1..64]
  # item-model / tooltip-style (1.1.1) — модель (Nexo sealforge:*) и рамка подсказки; применяются к новым и уже выданным
  #   расходникам (при входе игрока / в меню), скрытые метки не меняются. Пусто — вид материала.
  consumables:
    stone_c:
      material: AMETHYST_SHARD
      name: "<light_purple>Изумрудный камень (C)</light_purple>"
      item-model: "sealforge:emerald"
      tooltip-style: "royaltooltips:material"
    stone_b:
      material: AMETHYST_SHARD
      name: "<light_purple>Сапфировый камень (B)</light_purple>"
      item-model: "sealforge:sapphire"
      tooltip-style: "royaltooltips:material"
    stone_a:
      material: AMETHYST_SHARD
      name: "<light_purple>Морионовый камень (A)</light_purple>"
      item-model: "sealforge:morion"
      tooltip-style: "royaltooltips:material"
    blood_crystal:
      material: AMETHYST_SHARD
      name: "<light_purple>Кристалл крови</light_purple>"
      item-model: "sealforge:blood_crystal"
      tooltip-style: "royaltooltips:material"
    wax:
      material: AMETHYST_SHARD
      name: "<light_purple>Сургуч Черепа Ахи</light_purple>"
      item-model: "sealforge:akhi_skull_wax"
      tooltip-style: "royaltooltips:material"
    account_wax:
      material: AMETHYST_SHARD
      name: "<light_purple>Особый сургуч</light_purple>"
      item-model: "sealforge:akhi_special_wax"
      tooltip-style: "royaltooltips:material"
    arkonite_wax:
      material: AMETHYST_SHARD
      name: "<light_purple>Арконитовый сургуч</light_purple>"
      item-model: "sealforge:arconite_wax"
      tooltip-style: "royaltooltips:material"
    heart:
      material: AMETHYST_SHARD
      name: "<light_purple>Сердце Аркона</light_purple>"
      item-model: "sealforge:arkon_heart"
      tooltip-style: "royaltooltips:material"

# ---------------------------------------------------------------------------------------------------------------------
# Сообщения.
# ---------------------------------------------------------------------------------------------------------------------
messages:
  # Префикс сообщений (MiniMessage).
  prefix: "<dark_gray>[<light_purple>Печати</light_purple>]</dark_gray> "

# ---------------------------------------------------------------------------------------------------------------------
# Очки параметров. В core-rpg stat_* добавляли очки к параметрам персонажа (Главный, Ловкость, Выносливость, Удача),
# а те превращались в урон, здоровье и крит формулами класса. Без core-rpg параметров нет, поэтому одно очко
# пересчитывается в обычные бонусы по этой таблице: «бонус: значение за очко» (любые ключи бонусов, кроме stat_* и
# недействующих). Значения по умолчанию — линейная часть формул core-rpg (progression.yml, раздел stats); удача там
# даёт шанс крита по формуле с уровнем — здесь приближение 0.8% за очко.
# Не указанный здесь параметр не действует; «stat-conversion: {}» — очки параметров не действуют вовсе
# (в лоре такие строки помечаются «пока не действует»).
# ---------------------------------------------------------------------------------------------------------------------
stat-conversion:
  stat_primary:
    attack_damage: 0.5
  stat_agility:
    attack_speed: 0.01
  stat_stamina:
    max_health: 2
  stat_luck:
    crit_chance: 0.8

# ---------------------------------------------------------------------------------------------------------------------
# Бой: как действуют боевые бонусы печатей. Перенесено из combat.yml core-rpg (без заточки и пассивок классов).
#  Атака игрока (атакующий — игрок или снаряд из его лука, арбалета, трезубца):
#    1. урон по монстрам (damage_vs:monster) и стихийный урон (damage_vs:fire|air|earth|water), уменьшенный
#       сопротивлением цели-игрока той же стихии;
#    2. крит: шанс = crit_chance (не выше потолка), урон × (1 + (base-damage-percent + crit_damage) / 100);
#    3. статусы с шансом status_bleed / status_poison / status_burn;
#    4. вампиризм (lifesteal) от итогового урона и здоровье за убийство (heal_on_kill).
#  Защита игрока:
#    5. уворот: шанс = (evasion цели − accuracy атакующего) / 100, не выше потолка;
#    6. сопротивление: урон × (1 − min(потолок, resistance + resistance:<цель> + resistance_pvp)).
#  Регенерация: regen HP в секунду.
#
#  Причины урона (DamageCause): ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE, FIRE, FIRE_TICK, LAVA, HOT_FLOOR,
#  CAMPFIRE, MAGIC, WITHER, DRAGON_BREATH, SONIC_BOOM, DROWNING, FALL, FLY_INTO_WALL, LIGHTNING, FALLING_BLOCK,
#  SUFFOCATION, CONTACT, POISON, THORNS, BLOCK_EXPLOSION, ENTITY_EXPLOSION, VOID, STARVATION, SUICIDE, KILL, CUSTOM,
#  WORLD_BORDER, FREEZE, CRAMMING, DRYOUT, MELTING.
#  Звуки — ключи ресурсов Minecraft (entity.player.attack.crit); пустая строка — без звука.
#  Сообщения — MiniMessage; пустая строка — не показывать. Раздел можно выключить коротко: «bleed: false».
# ---------------------------------------------------------------------------------------------------------------------
combat:
  attack:
    # Какие удары игрока получают атакующие бонусы печатей (шаги 1–4). Шипы, взрывы и прочее не трогаем.
    causes: [ ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE ]

  damage-vs:
    # damage_vs:monster (%) работает против монстров.
    monster: true
    # Стихии damage_vs:<стихия> (%) работают против всех целей; если цель — игрок, бонус уменьшается на его
    # resistance:<та же стихия> (доля): 10% и 0.04 → +6%.
    elements: [ fire, air, earth, water ]

  crit:
    enabled: true
    # Потолок шанса крита, % (Royal Quest — 57%).
    cap-percent: 57
    # Базовая сила крита, % — в core-rpg её все получали от формулы удачи (crit-damage-base: 50). crit_damage печатей
    # прибавляется к ней: ×(1 + (50 + crit_damage)/100).
    base-damage-percent: 50
    # Частица у цели (имя Particle без данных, например CRIT, ENCHANTED_HIT; none — без частиц).
    particle: CRIT
    particle-count: 12
    sound:
      key: entity.player.attack.crit
      volume: 1.0
      pitch: 1.0
    # Action bar атакующему.
    message: "<gold>Критический удар!</gold>"

  # Статусы при ударе (шанс — бонусы status_bleed / status_poison / status_burn, %).
  statuses:
    # Кровотечение — эффект иссушения.
    bleed:
      enabled: true
      effect: wither
      duration-ticks: 60 # 3 с
      amplifier: 0
    poison:
      enabled: true
      effect: poison
      duration-ticks: 60
      amplifier: 0
    # Ожог — поджог цели на duration-ticks.
    burn:
      enabled: true
      duration-ticks: 60

  # Уворот (защищается игрок).
  evasion:
    enabled: true
    # Потолок шанса уворота, доля (0.85 = 85%).
    cap: 0.85
    # От каких ударов можно увернуться.
    causes: [ ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE ]
    sound:
      key: entity.player.attack.nodamage
      volume: 1.0
      pitch: 1.4
    # Action bar увернувшемуся и промахнувшемуся игроку.
    message: "<green>Уворот!</green>"
    attacker-message: "<gray>Промах!</gray>"

  # Сопротивление.
  resistance:
    enabled: true
    # Потолок суммарного сопротивления, доля.
    cap: 0.40
    # Причины, на которые сопротивление не действует.
    ignore-causes: []
    # Цели resistance:<цель>: срабатывают по причине урона (causes) или по тому, кто нанёс урон (attackers; для
    # снаряда — стрелок). В attackers — типы сущностей (EntityType) или группы: #undead (нежить, тег «Небесная кара»),
    # #arthropod (членистоногие, тег «Бич членистоногих»), #humanoid (игроки, жители, иллагеры, ведьмы, пиглины),
    # #animal (животные и волки), #monster, #player. Если подходит несколько целей, их сопротивления складываются.
    targets:
      fire:
        causes: [ FIRE, FIRE_TICK, LAVA, HOT_FLOOR, CAMPFIRE ]
        attackers: [ BLAZE, MAGMA_CUBE ]
      chaos:
        causes: [ MAGIC, WITHER, DRAGON_BREATH, SONIC_BOOM ]
      undead:
        attackers: [ "#undead" ]
      humanoid:
        attackers: [ "#humanoid" ]
      water:
        causes: [ DROWNING ]
        attackers: [ DROWNED, GUARDIAN, ELDER_GUARDIAN ]
      air:
        causes: [ FALL, FLY_INTO_WALL, LIGHTNING ]
        attackers: [ PHANTOM, BREEZE, GHAST ]
      earth:
        causes: [ FALLING_BLOCK, SUFFOCATION, CONTACT ]
      poison:
        causes: [ POISON ]
        attackers: [ SPIDER, CAVE_SPIDER, BEE ]
      animal:
        attackers: [ "#animal" ]
      arthropod:
        attackers: [ "#arthropod" ]

  # Вампиризм.
  lifesteal:
    enabled: true
    # Потолок вампиризма, % от итогового урона.
    cap-percent: 20
    # false — от всего итогового урона. true — урон для вампиризма не больше оставшегося здоровья цели.
    limit-to-target-health: false

  # Здоровье за убийство (бонус heal_on_kill, HP).
  heal-on-kill:
    enabled: true

  # Регенерация (бонус regen, HP в секунду).
  regen:
    enabled: false
    # Как часто лечить, тиков (20 = раз в секунду). За раз — regen × period / 20.
    period-ticks: 20

