# ---------------------------------------------------------------------------------------------------------------------
# Бижутерия (seal-magic 1.2.1): предметы в слотах rezusmenu (амулет, 2 кольца, тотем, артефакт) дают статы, на них
# можно накладывать печати типа ACCESSORY. rezusmenu хранит слоты в PDC игрока rezusmenu:jewel_*, seal-magic их только
# читает (раз в poll-ticks сверяет отпечаток — так ловится и смена слота в меню, и смена профиля). После правки: /seals reload.
# Нет раздела или enabled: false — бижутерия ничего не даёт, печати на неё не ставятся (поведение 1.1.1).
# ---------------------------------------------------------------------------------------------------------------------
jewelry:
  enabled: true
  poll-ticks: 20
  nexo-id-key: "nexo:id"
  slots-pdc: [rezusmenu:jewel_amulet, rezusmenu:jewel_ring_1, rezusmenu:jewel_ring_2, rezusmenu:jewel_totem, rezusmenu:jewel_artifact]

  # 1.2.1: MMOItems-предметы в слотах отдаются самому MMOItems как слоты ACCESSORY (мост).
  # Кольца (AZERUS_RING_NNN, тип ACCESSORY), тотемы (AZERUS_ARTIFACT_001–006, тип TOTEM на базе ACCESSORY)
  # и артефакты (AZERUS_ARTIFACT_007–011 и 015–017, тип ARTIFACT на базе ACCESSORY): статы считает MMOItems
  # с проверкой required-class/level и снимает, когда предмет убрали из слота или сменили профиль.
  # seal-magic базовых статов колец/тотемов/артефактов НЕ даёт (stats.* пусты) — двойного счёта нет.
  # У MMOItems-предмета без nexo:id его id берётся из MMOITEMS_ITEM_ID в нижнем регистре (AZERUS_RING_051 → azerus_ring_051),
  # поэтому detect/rarity/no-seals ниже работают и для него. bridge: false — мост выключен.
  mmoitems:
    bridge: true
    # Какие типы MMOItems пускать в слот каждого вида (нет вида в списке — любой тип). Предмет всё равно должен
    # распознаться как бижутерия этого вида (detect) и не быть none.
    types:
      ring: [ACCESSORY, RING]
      amulet: [AMULET, NECKLACE]
      totem: [TOTEM]
      artifact: [ARTIFACT, RELIC, ORNAMENT, TALISMAN]

  # Тип предмета: сначала точный Nexo-id (ids; none — не бижутерия), потом префикс id, потом custom_data jewel:"тип".
  # Предмет считается только в «своём» слоте (кольцо — в слоте кольца и т. д.).
  detect:
    # Тотемы Azerus (items/azerus_totems.yml) сохранили id azerus_artifact_001–006 — поэтому точные id.
    ids:
      azerus_artifact_001: totem
      azerus_artifact_002: totem
      azerus_artifact_003: totem
      azerus_artifact_004: totem
      azerus_artifact_005: totem
      azerus_artifact_006: totem
      azerus_artifact_007: artifact
      azerus_artifact_008: artifact
      azerus_artifact_009: artifact
      azerus_artifact_010: artifact
      azerus_artifact_011: artifact
      azerus_artifact_015: artifact
      azerus_artifact_016: artifact
      azerus_artifact_017: artifact
      azerus_artifact_012: none     # удалены Алексом 18.11
      azerus_artifact_013: none     # удалены Алексом 18.11
      azerus_artifact_014: none     # удалены Алексом 18.11
      # Кольца: оставлены 24 (049, 050, 051, 052, 054, 057, 058, 060, 062, 065, 067, 070, 072, 074, 075, 080, 081, 082, 083, 085, 091, 095, 098, 099), остальные 78 — не бижутерия.
      azerus_ring_001: none
      azerus_ring_002: none
      azerus_ring_003: none
      azerus_ring_004: none
      azerus_ring_005: none
      azerus_ring_006: none
      azerus_ring_007: none
      azerus_ring_008: none
      azerus_ring_009: none
      azerus_ring_010: none
      azerus_ring_011: none
