  rarity:
    default: common
    # Кольца: явный список 24 оставленных (Nexo azerus_ring_NNN и MMOItems AZERUS_RING_NNN), все — common = грейд C
    # (уровни 1–20). Диапазонов по номеру больше нет.
    ids:
      azerus_ring_049: common
      azerus_ring_050: common
      azerus_ring_051: common
      azerus_ring_052: common
      azerus_ring_054: common
      azerus_ring_057: common
      azerus_ring_058: common
      azerus_ring_060: common
      azerus_ring_062: common
      azerus_ring_065: common
      azerus_ring_067: common
      azerus_ring_070: common
      azerus_ring_072: common
      azerus_ring_074: common
      azerus_ring_075: common
      azerus_ring_080: common
      azerus_ring_081: common
      azerus_ring_082: common
      azerus_ring_083: common
      azerus_ring_085: common
      azerus_ring_091: common
      azerus_ring_095: common
      azerus_ring_098: common
      azerus_ring_099: common
    #  azerus_amulet_025: epic
    ranges: []

  # Грейд для камня наложения печати (C — изумрудный, B — сапфировый, A — морионовый).
  grade-by-rarity: {common: C, rare: B, epic: A, legendary: A}

  # Классы с магическим уроном: damage -> MAGIC_DAMAGE; у остальных -> PHYSICAL_DAMAGE,
  # а magic_damage у не-магов превращается в skill_damage (чтобы артефакт был одинаково полезен).
  magic-classes: [mage, wizard, warlock]

  # Классы, у которых ресурс называется «Мана»: CUSTOM_MANA_BONUS → MAX_MANA (плоско).
  # У остальных ресурс «Энергия»: CUSTOM_ENERGY_BONUS → тот же MAX_MANA. Неподходящий бонус = 0.
  # Список не заменяет magic-classes (тот — развилка урона). По умолчанию совпадает с кастерами.
  mana-classes: [mage, wizard, warlock]

  # Базовые статы по типу и редкости (за ОДИН предмет; колец два).
  # Ключи печатей (действуют как печати): crit_chance, crit_damage (%), armor, max_health (2 = сердце),
  #   resistance (доля), resistance:<цель>, accuracy, evasion, max_mana / mana_regen (% к мане/энергии), lifesteal…
  # Ключи MythicLib (FLAT, ключ модификатора seal-magic:jewel): damage (физ./маг. по классу, %), magic_damage (%),
  #   skill_damage (% урона навыков), cooldown_reduction (%), physical_damage (%), ml:<СТАТ> — любой стат MythicLib.
  stats:
    ring: {}     # кольца базовых статов НЕ дают (статы колец — MMOItems, Алекс); печати на кольца работают
    amulet:      # выживание: HP, броня, сопротивления
      common:    {max_health: 2, armor: 1, resistance: 0.02}
      rare:      {max_health: 4, armor: 1.5, resistance: 0.03}
      epic:      {max_health: 6, armor: 2, resistance: 0.04, "resistance:chaos": 0.03}
      legendary: {max_health: 8, armor: 3, resistance: 0.05, "resistance:chaos": 0.05, "resistance:fire": 0.03}
    artifact: {} # 1.2.1: статы артефактов 007–011, 015–017 — MMOItems, Алекс
    totem: {}    # 1.2.1: статы тотемов 001–006 — MMOItems, Алекс

  # Классовый бонус тотема (за common), умножается на class-bonus-multiplier по редкости.
  # Профессия важнее базового класса. 1.2.1: выключен, чтобы не дублировать статы MMOItems.
  class-bonus-enabled: false
  class-bonus:
    swordsman:   {max_health: 1}
    crusader:    {max_health: 1, resistance: 0.01}
    dark_knight: {lifesteal: 0.5}
    archer:      {accuracy: 1}
    hunter:      {accuracy: 1}
    sniper:      {crit_damage: 2}
    mage:        {mana_regen: 3}
    wizard:      {mana_regen: 3}
    warlock:     {max_mana: 3}
    thief:       {evasion: 1}
    rogue:       {evasion: 1}
    assassin:    {crit_chance: 0.5}
  class-bonus-multiplier: {common: 1, rare: 1.5, epic: 2, legendary: 2.5}

  # Потолки СУММЫ базовых статов всей бижутерии (печати на бижутерии сюда не входят — у них свои потолки combat).
  caps:
    physical_damage: 10
    magic_damage: 12        # 2 кольца + артефакт у мага
    skill_damage: 12
    cooldown_reduction: 5
    crit_chance: 5
    crit_damage: 16
    resistance: 0.06

  # Какие печати НЕ выпадают на бижутерию данного типа (по ключам бонусов; «damage_vs:*» — все такие).
  # Чтобы бижутерия не стала ещё 4 источниками атаки: урон через печати — только на кольцах.
  deny-seal-bonuses:
    ring:     []
    amulet:   [attack_damage, attack_speed, crit_chance, crit_damage, "damage_vs:*"]
    totem:    [attack_damage, attack_speed, crit_chance, crit_damage, "damage_vs:*"]
    artifact: [attack_damage, attack_speed]

  # Полный запрет печатей по id. Пусто: по решению Haiato печати на тотемы и артефакты ставятся и работают.
  no-seals: []

  # Привязка предмета к классу (id как у RoyalQuestClasses / MMOCore).
  # 1.2.2: действует на ВСЕ 5 слотов — без подходящего класса/уровня с предмета не идёт ничего
  # (мост MMOItems, печати, мана/энергия, stats.*). Сначала этот список, иначе NBT MMOITEMS_REQUIRED_CLASS.
  # Вещи «для всех» (001, 004, 005, 007, 011) сюда не входят. Кольца — из живого accessory.yml 18.11.
  item-classes:
    azerus_ring_051: [swordsman, crusader, dark_knight]
    azerus_ring_074: [swordsman, crusader, dark_knight]
