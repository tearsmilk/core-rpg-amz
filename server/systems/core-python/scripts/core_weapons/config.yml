# core-weapons — эффекты кастомного оружия. Оружие узнаётся по id предмета Nexo (PDC nexo:id) или по своей
# метке coreweapons:id. Каждое оружие собирает себе нужные поведения: orbit, swing, crit-tremor (любое можно
# убрать или выключить enabled: false). Перечитать: /cweapons reload.

prefix: "<dark_gray>[<#ff4a3a>Оружие</#ff4a3a>]</dark_gray> "

weapons:
  azerus_crimson_scythe:
    # Предмет для проверки без Nexo (/cweapons give): тот же item_model и метка nexo:id.
    test-item:
      material: NETHERITE_SWORD
      item-model: "azerus:crimson_scythe"
      name: "<gradient:#ff3b2f:#b3121f:#ff8a3d>Багровая коса</gradient>"

    # Частицы по кругу вокруг лезвия, пока оружие в основной руке (видят все до 32 блоков). У косы выключено:
    # кольцо угольков теперь в самой модели (crimson_scythe_held + анимированная текстура crimson_scythe_fx).
    orbit:
      enabled: false
      period: 2              # раз в столько тиков
      points: 3              # частиц на кольце за раз
      radius: 0.75           # радиус кольца, блоки
      degrees-per-tick: 14   # скорость вращения
      tilt: 25               # наклон кольца, градусы
      bob: 0.12              # покачивание вверх-вниз
      # центр кольца от ног игрока: вправо, вверх, вперёд (лезвие в руке стоит над плечом)
      center: [0.45, 2.15, 0.45]
      colors: ["#ff3b2f", "#ff9a3d"]   # DUST_COLOR_TRANSITION: из какого в какой
      size: 0.75
      flame-every: 2         # каждая n-я точка — ещё и SMALL_FLAME (светится в темноте); 0 — без огня
      hand-ember: true       # искорка у ладони раз в 4 тика

    # Замах: при взмахе рукой предмет на несколько тиков получает строку custom_model_data (кадр), определение
    # предмета в паке (items/crimson_scythe.json) показывает по ней модель кадра. Потом строка снимается.
    swing:
      enabled: true
      frames: ["cw_swing_1:1", "cw_swing_2:2", "cw_swing_3:3"]   # кадр:тиков
      min-interval: 6        # не чаще раза в столько тиков (кликер, копание)
      trail: true            # огненный след по дуге перед игроком
      trail-points: 5        # точек за тик
      trail-radius: 1.35
      trail-distance: 1.25   # дуга — на таком расстоянии перед глазами
      trail-colors: ["#ff2a1f", "#ffb347"]
      sound: "entity.player.attack.sweep:0.7:0.6"

    # Крит (Paper isCritical — удар в падении): по земле от цели расходится кольцо дрожи.
    crit-tremor:
      enabled: true
      radius: 6.0            # конечный радиус, блоки
      duration: 12           # за столько тиков кольцо доходит до края
      cooldown: 30           # тиков между дрожью одного игрока
      particles: 3           # BLOCK-частиц на блок кольца
      dust-pillar: true      # ещё DUST_PILLAR (столбик пыли блока)
      shake-blocks: true     # BlockDisplay-копии верхних блоков подпрыгивают (мир не меняется)
      shake-height: 0.22     # на сколько блоков подпрыгивают
      max-displays: 90       # не больше стольких копий за одну дрожь
      kick: 0.12             # толчок вверх игрокам на кольце (0 — без толчка)
      kick-attacker: false
      damage: 0.0            # урон существам на кольце (0 — только эффект)
      sounds:
        - "entity.warden.step:1.2:0.5"
        - "entity.generic.explode:0.5:0.55"
        - "block.deepslate.break:1.0:0.6"

# Палка (ванильная STICK, любая — не только предметы Nexo): два приёма, код — bou.py, вид — шейдер moonstaff (пак
# nexo-items: модели azerus:stick_slash, azerus:stick_ember_orb, azerus:stick_ember_beam). Перечитать: /cweapons reload.
#   ПКМ (в воздух, по блоку или по существу)  — «Удар в спину»
#   Shift + ПКМ                               — «Угли»
stick:
  enabled: true
  material: STICK
  nexo-ids: []             # пусто — любая палка; иначе только предметы с этими nexo:id (например [azerus_stick])
  permission: ""           # пусто — всем; иначе право на оба приёма
  disabled-worlds: []      # миры, где приёмы не работают
  pvp: true                # бить игроков (если ещё и в мире включён PvP; защита регионов решает сама)
  double-click-ms: 250     # клик по существу шлёт два события — второе в эти мс молча пропускается
  denied-sounds: ["block.note_block.bass:0.5:0.6"]   # отказ (перезарядка), только себе

  # «Удар в спину»: удар без замаха (0 с) по первой живой цели впереди. Со спины цели — урон ×2 и крит-вид.
  backstab:
    enabled: true
    cooldown: 6.0            # перезарядка, с (после попадания)
    miss-cooldown: 1.0       # перезарядка после промаха, с (серп всё равно виден)
    range: 3.5               # дальность, блоки (от глаз)
    cone: 20.0               # конус вокруг взгляда, градусы (кроме точного луча)
    ray-margin: 0.2          # луч взгляда «толще» на столько блоков
    damage: 6.0
    damage-type: "minecraft:player_attack"   # тип урона (реестр); виновник — атакующий (PvP, защита — как обычно)
    back-angle: 60.0         # «со спины»: угол между взглядом цели и направлением атакующий → цель меньше этого
    back-multiplier: 2.0     # урон со спины ×
    ignore-invulnerability: true   # не ждать кадров неуязвимости цели после чужого удара
    slash-size: 2.6          # серп, блоки
    crit-slash-size: 3.2     # серп при ударе со спины
    slash-start-scale: 0.7   # серп появляется в такой доле размера и за 4 тика дорастает
    slash-roll: 28.0         # наклон серпа вокруг взгляда, градусы (знак — случайный)
    slash-roll-swing: 14.0   # серп доворачивается за время роста
    slash-before-target: 0.45  # серп стоит на столько ближе цели
    life-ticks: 8            # серп живёт (шейдер гасит его к 9-му тику)
    view-range: 1.0          # дальность видимости дисплея (×64 блока)
    sounds: ["entity.player.attack.sweep:1.0:1.2", "item.firecharge.use:0.6:1.5"]
    crit-sounds: ["entity.player.attack.crit:1.0:0.8", "entity.blaze.shoot:0.8:1.3", "entity.player.attack.strong:1.0:0.7"]

  # «Угли»: Shift+ПКМ — перед магом 1 с растёт красная руническая сфера (ходить можно; смена предмета, смерть,
  # выход, другой мир — отмена), потом дымный тёмно-красный луч до первой цели: урон и поджог.
  embers:
    enabled: true
    cast-seconds: 1.0        # время сотворения
    cooldown: 10.0           # перезарядка после выстрела, с
    cancel-cooldown: 1.0     # после отмены, с
    range: 16.0              # дальность луча (блоки останавливают)
    piece-length: 4.0        # шаг проверки «путь в нашем регионе»
    damage: 8.0
    damage-type: "minecraft:magic"
    fire-seconds: 3.0        # поджог цели (только если урон прошёл)
    hit-radius: 0.3          # луч «толще» на столько при поиске цели
    pierce: false            # false — первая цель; true — все на пути
    ignore-invulnerability: true
    orb-size: 1.15           # сфера при полном заряде, блоки
    orb-start-scale: 0.35
    orb-forward: 1.3         # сфера перед глазами
    orb-down: 0.15           # и ниже глаз
    orb-update-ticks: 4      # яркость сферы (заряд) обновляется раз в столько тиков
    beam-width: 0.9
    beam-start-width: 0.3    # доля ширины в момент появления
    beam-grow-ticks: 2
    beam-hold-ticks: 4
    beam-fade-ticks: 4
    impact-size: 1.8         # вспышка-круг у цели
    impact-ticks: 4
    view-range: 1.5
    start-sounds: ["block.respawn_anchor.charge:0.8:1.4", "block.fire.ambient:1.0:0.8"]
    charge-sounds: ["block.fire.ambient:0.6:1.2"]
    fire-sounds: ["entity.blaze.shoot:1.0:0.7", "entity.ghast.shoot:0.5:0.6"]
    impact-sounds: ["entity.generic.burn:0.9:0.8", "entity.blaze.hurt:0.6:0.6"]
    cancel-sounds: ["block.fire.extinguish:0.6:1.2"]

messages:
  usage: "<gray>/cweapons give <оружие> [игрок] | list | reload"
  reloaded: "<green>Настройки перечитаны."
  no-player: "<red>Игрок <white><player></white> не в сети."
  no-weapon: "<red>Нет оружия <white><weapon></white> в config.yml."
  given: "<green>Выдано: <white><weapon></white> → <white><player></white>."
  list: "<gray>Оружие: <white><list></white>"
  console: "<red>Укажите игрока."
  stick-backstab-cooldown: "<#ff6a3a>Удар в спину</#ff6a3a> <gray>— перезарядка <white><s> с</white>"
  stick-embers-cooldown: "<#d0302a>Угли</#d0302a> <gray>— перезарядка <white><s> с</white>"
  stick-backstab-crit: "<#ff4a6a>✦ Удар в спину!</#ff4a6a> <gray>урон <white><dmg></white>"
  stick-embers-cast: "<#d0302a>Угли</#d0302a> <gray>— <bar>"
  stick-embers-cancelled: "<gray>Угли угасли."
