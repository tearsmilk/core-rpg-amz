# Python-система «Зелья» (ポーション). Вид зелий — Nexo (пак skulpt/basic_potions), механика — здесь.
name: core_potions
version: 1.1.0
main: main.py
enabled: true
言語: 日本語          # японский режим: main.py написан японскими знаками (docs/japanese-mode-vocabulary.md)
description: "Механика зелий Nexo: эффекты, прибавка к здоровью, бутылка не остаётся"
commands:
  cpotions:
    permission: corepotions.admin
    aliases: [ポーション]
    description: "Зелья: список и перечитать potions.yml"
    usage: "/cpotions list | reload"
