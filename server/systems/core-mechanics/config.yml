# core-mechanics — рэгдоллы и куклы-статуи. Команда /rd (право coremechanics.admin).
# После правки: amazake system reload core-mechanics (раздел physics — после disable/enable системы).

# Рэгдоллы (физические куклы на Jolt).
ragdoll:
  on-death: true                  # при смерти игрока на месте падает его кукла; false — выключить
  death-lifetime-seconds: 90      # сколько живёт кукла умершего
  command-lifetime-seconds: 300   # сколько живёт кукла из /rd <ник> (и любая кукла, которую взяли в руки)
  max-dolls: 12                   # больше кукол сразу не бывает: лишние (самые старые) исчезают
  grab-reach: 6.0                 # Shift+ПКМ берёт куклу не дальше стольких блоков
  throw-strength: 14.0            # сила броска ЛКМ (блоков/с у взятой части)
  hold-stiffness: 10.0            # «пружина» удержания: больше — кукла жёстче следует за взглядом
  hold-max-speed: 25.0            # макс. скорость части в руках, блоков/с

# Куклы-статуи (/rd statue …).
statues:
  topple-seconds: 10              # сколько статуя лежит рэгдоллом после удара/взрыва, потом встаёт
  topple-on-hit: true             # удар (ЛКМ) по статуе роняет её
  topple-on-explosion: true       # взрыв рядом роняет статуи

# Физдвижок Jolt (применяется после выключения/включения системы).
physics:
  gravity: 17.0                   # м/с² (1 блок = 1 м); как в PasToSmith
  substeps: 3                     # под-шагов коллизий за тик (3 = 60 Гц)
  threads: 0                      # потоков Jolt (0 = авто: половина ядер, не больше 4)
  max-bodies: 4096                # лимит тел в мире (части кукол + секции меша мира)
  section-requests-per-tick: 24   # сколько секций мира 16×16×16 снимать за тик (меш коллизии вокруг кукол)

# Скины.
skins:
  fetch-on-join: true             # при входе игрока заранее скачать его скин (цвета тела) и поставить кубики MineSkin в очередь
  mojang-lookup: true             # /rd <ник> и /rd statue <ник> для игрока не в сети — искать скин у Mojang

# Полный скин тела через MineSkin: каждый кусок тела — отдельная «голова» со скином (10 штук на скин).
# Ключ API пишется ТОЛЬКО в конфиг сервера, в репозиторий — никогда. Пусто — тело цветными блоками (средние цвета скина).
# Если MineSkin недоступен (нет сети) — одна строка в логе и тело остаётся цветными блоками.
mineskin:
  key: ""
  api-url: "https://api.mineskin.org/v2/generate"
  timeout-seconds: 60

# Библиотеки Jolt (jolt-jni 6.1.1: Java-API + нативка linux x86-64) в systems/core-mechanics/lib/.
# Обычно они вшиты в .azs и распаковываются сами (со сверкой sha256). Если .azs собран без них (-PbundleJolt=false) —
# скачиваются из репозиториев ниже (или положите jar-ы в lib/ руками и выключите auto-download).
libraries:
  auto-download: true
  repositories:
    - "https://repo1.maven.org/maven2/"
    - "https://maven-central.storage-download.googleapis.com/maven2/"
