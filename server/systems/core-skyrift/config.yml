# core-skyrift: «Разлом небес» (незеритовый слиток). ПКМ — небо резко затягивает чёрным туманом, во всё небо
# раскрывается огромный адский разлом (кровавые пятна, лава, угли), и из него падают мобы core-mobs.
# Применить без рестарта: /skyrift reload  (или /amazake system reload core-skyrift).
# Тексты — MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Время — в секундах, расстояния — в блоках. Ошибка в значении — предупреждение в консоли и значение по умолчанию.

prefix: "<dark_gray>[<gradient:#ff2a00:#7a0008>Разлом</gradient>]</dark_gray> "

item:
  # Имя и описание предмета (NETHERITE_INGOT с меткой coreskyrift:rift_item в PDC; узнаётся по метке, не по имени).
  name: "<!i><b><gradient:#ffb040:#ff2a00:#b00010:#4a0008>Разлом небес</gradient></b>"
  lore:
    - "<!i><dark_red>Слиток, выкованный по ту сторону неба."
    - "<!i><gray>ПКМ — разорвать небо над собой."
    - "<!i><gray>Из разлома полезут твари."
  # item_model иконки. Пусто — обычный незеритовый слиток (с блеском зачарования).
  model: ""
  # Тратить предмет (в творческом режиме не тратится).
  consume: true
  # Задержка между разломами одного игрока, секунды (0 — без задержки).
  cooldown-seconds: 30

event:
  # Радиус события по горизонтали от центра: игроки ближе видят разлом, туман, слышат звуки (16..512).
  # Видимость с запасом: входит при radius, выходит дальше radius + 16.
  radius: 160
  # Сколько событий одновременно в одном мире (1..8).
  max-per-world: 1
  # Наименьшее расстояние между центрами событий одного мира (0..10000).
  min-distance: 400
  # Дальность видимости дисплея неба (×64 блока; дисплей всегда рядом с игроком, 0,5..8).
  view-range: 2.0

rift:
  # Высота плоскости разлома над точкой события (виртуальная, может быть выше верха мира, 40..400).
  height: 160
  # Размер разлома: длина 480 × ширина 110 блоков при size 1.0 (0.25..2.0). Шейдер берёт его из наклона
  # нормали дисплея, сервер — для мест спавна под разломом, так что вид и спавн совпадают.
  size: 1.0
  # Направление разлома: random — случайное, player — поперёк взгляда игрока, или число — градусы (0..360).
  yaw: random

timeline:
  # Чёрный туман заполняет небо.
  fog-in: 3
  # Тонкая трещина растёт от центра (вспышка, гром).
  crack: 3
  # Края медленно рвутся во весь разлом.
  opening: 20
  # Разлом открыт, «дышит», из него лезут мобы.
  active: 60
  # Края сходятся обратно в трещину и гаснут.
  closing: 6
  # Туман уходит, время суток возвращается.
  fog-out: 4

env:
  # Свой боссбар каждому игроку в радиусе (прогресс — сколько осталось). Его флаги — ванильные эффекты клиента:
  boss-bar: true
  boss-bar-title: "<dark_red><b>Разлом</b></dark_red>"
  # darken-sky: небо и свет темнеют (как у визера).
  darken-sky: true
  # create-fog: туман мира резко сходится до 10..96 блоков, облака пропадают (иначе облака рисуются поверх разлома).
  create-fog: true
  # Ночь только для игроков в радиусе (setPlayerTime): туман и свет почти чёрные; в конце время возвращается.
  night: true
  # Время суток «ночи» (0..23999; 18000 — полночь).
  night-time: 18000
  # Эффект «Тьма» на столько тиков в момент трещины (0 — выключено; тьма сжимает туман до 15 блоков).
  darkness-pulse-ticks: 0
  # Красная вспышка и кровавые потёки по краям экрана в момент трещины и закрытия (маркер 98).
  screen-flash: true

mobs:
  # Мобы из разлома. Спавнятся командой core-mobs (она должна быть включена).
  enabled: true
  # id из core-mobs (mobs.yml) и вес (чем больше — тем чаще).
  list:
    forest_zombie: 3
    cave_skeleton: 2
    venom_spider: 1
  # Команда спавна от консоли (без вывода в консоль). {id} {amount} {world} {x} {y} {z}.
  command: "mobs spawn {id} {amount} {world} {x} {y} {z}"
  # Живых мобов события одновременно (0..200).
  max-alive: 20
  # Всего мобов за событие (0..1000).
  max-total: 60
  # Пауза между волнами, секунды (1..120).
  wave-interval-seconds: 4
  # Мобов в волне: число или диапазон "2-4" (1..50).
  per-wave: "2-4"
  # Живых мобов не больше этого на каждого игрока в радиусе (итог — меньшее из этого × игроков и max-alive).
  per-player-cap: 6
  # С какой раскрытости разлома (0..1) начинаются волны.
  start-at-open: 0.6
  # Убрать мобов события в конце (и они не сохраняются в мир).
  despawn-on-end: true
  # near-players — рядом со случайными игроками (лучше — под самим разломом), under-rift — только под разломом.
  spawn-mode: near-players
  # Расстояние от игрока до места спавна (near-players), блоков.
  min-distance: 6
  max-distance: 24
  # На сколько блоков над землёй появляется моб (падает из разлома с медленным падением).
  drop-height: 28
  # Медленное падение, секунды (0 — без него).
  slow-falling-seconds: 8
  # Подсветка мобов события.
  glowing: false

effects:
  particles: true
  sounds: true
  # Гром при трещине и гул при раскрытии.
  thunder: true
  # Пепел и угли вокруг игроков в радиусе (только их клиенту).
  ambient-particles: true
  # Сколько тиков горит огненный след падающего моба (0 — без следа).
  trail-ticks: 80

messages:
  usage: "<gray>/skyrift give [игрок] [кол-во] | start [игрок | мир x y z] | stop [игрок] | list | reload"
  given: "<gray>Выдано <yellow><player></yellow>: <white><amount></white> × «Разлом небес»."
  received: "<gray>Получено: <white><amount></white> × «Разлом небес»."
  player-not-found: "<red>Игрок <yellow><player></yellow> не найден."
  world-not-found: "<red>Мир <yellow><world></yellow> не найден."
  reloaded: "<green>Настройки core-skyrift перечитаны."
  cast: "<dark_red>Небо над тобой рвётся…"
  started: "<gray>Разлом открыт: <white><where></white>."
  cooldown: "<red>Слиток ещё не остыл: подождите <yellow><seconds></yellow> с."
  too-many: "<red>В этом мире небо уже разорвано."
  too-close: "<red>Слишком близко к другому разлому (<yellow><distance></yellow> бл., нужно <yellow><need></yellow>)."
  stopped: "<gray>Закрывается разломов: <white><count></white>."
  list-empty: "<gray>Открытых разломов нет."
  list: "<gray>Открытые разломы (<white><count></white>):"
