# Мобы core-mobs. Ключ (forest_zombie) — id моба для команд, регионов и файла лута drops/<id>.yml.
# Лут: положите предметы в инвентарь и /mobs drops save <id>, шансы и количество — в drops/<id>.yml.
#
# Параметры (всё, кроме type, можно не писать):
#   type                 — ванильный моб: ZOMBIE, SKELETON, SPIDER, HUSK, STRAY, CAVE_SPIDER, WITHER_SKELETON...
#   name                 — имя (MiniMessage)
#   show-name            — показывать имя над головой (true)
#   show-health          — добавлять к имени здоровье по mobs.name-format в config.yml (true)
#   health               — здоровье (20 = 10 сердец)
#   damage               — урон в ближнем бою (не указано — ванильный)
#   projectile-damage    — урон стрелы (для скелетов)
#   speed                — скорость (у зомби 0.23, у паука 0.3)
#   armor                — броня (0..30)
#   follow-range         — с какого расстояния моб замечает игрока
#   knockback-resistance — сопротивление отбрасыванию (0..1)
#   scale                — размер (1 — обычный)
#   baby                 — детёныш (у кого он бывает)
#   glowing, silent      — подсветка, без звуков
#   prevent-sunburn      — не горит на солнце (true)
#   vanilla-drops        — оставлять ванильный дроп (false: падает только свой лут)
#   drop-equipment       — выпадает ли снаряжение (false)
#   exp                  — опыт: 10 или 5-15 (не указано — ванильный). core-rpg переводит его в свой опыт
#   equipment            — hand, off-hand, helmet, chestplate, leggings, boots: материал
#   effects              — постоянные эффекты: [{effect: speed, level: 1}]
#   on-hit-effects       — эффекты цели при ударе: [{effect: poison, level: 1, seconds: 4, chance: 35}]
#   size                 — размер слизня, магмового куба, фантома (1..16; не указано — случайный ванильный)
#   no-fire              — огненные шары моба (блейз, гаст) не поджигают и не ломают блоки (true)

