# Заточка CoreSharpen (модуль заточки core-rpg отдельной системой, бывший плагин Zatochka).
# После правки: /sharpen reload (или /amazake system reload core-sharpen).
# Тексты — MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# Как это работает:
#   • Игрок держит предмет в основной руке и открывает меню (/sharpen или правый клик по NPC «Королевский алхимик»).
#   • Кладёт камень заточки (и, по желанию, руну) и жмёт «Улучшить». Камень и руна тратятся.
#   • Успех — уровень +1. Провал с руной — уровень и предмет целы. Провал без руны — бросок уничтожения;
#     если предмет уцелел, уровень −1 (не ниже 0). Ашкалотский кубик никогда не уничтожает предмет.
#   • Крошка философского камня — только для грейда C.
#   • Грейд по материалу: незерит — A, алмаз и золото — B, остальное — C.
#   • +11 (режим royal-quest, грейды B и A): только с +10, вместо камня — второй предмет того же материала в слоте
#     жертвы. Шанс зависит от заточки жертвы (legendary.chances). Жертва тратится всегда, провал оставляет +10.
#   • Бонус заточки: оружие и инструменты — % к атаке, броня — % к защите (средний по заточенным надетым частям).
#     Щит точится, но боевого бонуса не даёт. Урон и защиту считает сама система (раздел combat ниже).

messages:
  # Префикс всех сообщений системы.
  prefix: "<dark_gray>[<gradient:#DC143C:#FFB6C1>Заточка</gradient>]</dark_gray> "

# Боевой бонус заточки (в core-rpg его считал модуль боя).
combat:
  # Урон игрока ×(1 + бонус оружия%/100): ближний бой — предмет в основной руке; лук, арбалет, трезубец — заточка
  # оружия на момент выстрела. Броня и щит урон не повышают.
  weapon-bonus: true
  # Причины урона, к которым применяется бонус оружия (имена EntityDamageEvent.DamageCause).
  attack-causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE]
  # Входящий урон игрока ÷(1 + средний бонус заточенных надетых частей брони%/100). Щит не учитывается.
  armor-bonus: true
  # Причины урона, которые заточка брони не уменьшает.
  armor-ignore-causes: [VOID, STARVATION, SUICIDE, KILL, CUSTOM, WORLD_BORDER]
  # 1.1.3: от чего считается бонус заточки оружия.
  #   base — +X% только к базовой силе оружия (MMOItems ATTACK_DAMAGE / атрибут предмета / материал): урон + база×X/100.
  #          Маг. оружие: +X% к его маг. силе (items.magic.power-stat). Легендарная броня по-прежнему % ко всему удару.
  #   hit  — как 1.1.2: весь удар ×(1 + X/100).
  weapon-bonus-from: base
  # base + старое маг. оружие без стата маг. силы (Nexo-экземпляры): true — оставить им % ко всему MAGIC-удару (как 1.1.2),
  # false — такой предмет бонуса заточки не даёт.
  legacy-magic-hit: true

# Режим шансов:
#   royal-quest — таблицы Royal Quest по категории, грейду и камню (раздел royal-quest ниже), +11 через жертву;
#   simple      — таблицы плагина Zatochka (раздел simple) × множитель камня, +11 — обычной попыткой с камнем.
mode: royal-quest

# Максимальный уровень заточки по грейду (0..11). 0 — предметы грейда не точатся.
max-level:
  C: 10
  B: 11
  A: 11

# Бонусы заточки в процентах, кумулятивные (не складываются по уровням): +10 брони даёт +200% защиты.
# Лор предмета: «Заточка: +N (Атака +X% ×M)», где M = 1 + X/100; в режиме combat.weapon-bonus-from: base — «Заточка: +N (Сила оружия +X%)».
bonuses:
  armor:    # броня и щит — защита
    1: 10
    2: 22
    3: 36
    4: 52
    5: 70
    6: 90
    7: 112
    8: 136.2
    9: 162.1
    10: 200
    11: 260
  weapon:   # оружие, луки, инструменты — атака
    1: 5
    2: 11
    3: 18
    4: 26
    5: 35.1
    6: 45
    7: 56.1
    8: 68.2
    9: 81
    10: 85
    11: 130

# +11 через жертву (только режим royal-quest).
legendary:
  # Шанс успеха, %, по уровню заточки жертвы (0..10).
  chances:
    0: 8.5
    1: 17
    2: 25.5
    3: 30
    4: 34
    5: 42.5
    6: 51
    7: 59.5
    8: 68
    9: 76.5
    10: 85
  # Каждый надетый предмет +11 (броня, оружие или инструмент в основной руке, щит во второй руке) даёт +N% к урону
  # (вместе с бонусом оружия, если combat.weapon-bonus) и +N% к защите (вместе с бонусом брони, если
  # combat.armor-bonus). В core-rpg здесь были очки четырёх параметров — без RPG-ядра их нет. 0 — выключить.
  stat-bonus: 1

# Таблицы Royal Quest (royalquest.info, «Улучшение предметов»), режим royal-quest.
# Категории: armor — броня; weapon_1h — одноручное оружие, луки, щиты, инструменты; weapon_2h — двуручное
# (булава, трезубец, копья, алмазный и незеритовый топор). Грейды C, B, A.
# Строка: целевой уровень: [осколок, чёрный, белый, красный, пурпурный] — шанс в процентах.
# Крошка и Ашкалотский кубик берут колонку осколка. 0.5 означает «меньше 1%».
