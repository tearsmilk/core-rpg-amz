# Режим simple: таблицы плагина Zatochka. Шанс успеха = таблица × множитель камня (не больше 100%).
simple:
  # Шанс успеха, % (попытка на +N).
  success-chances:
    armor:
      1: 100
      2: 90
      3: 85
      4: 75
      5: 65
      6: 50
      7: 40
      8: 30
      9: 20
      10: 20
      11: 5
    weapon_1h:
      1: 100
      2: 90
      3: 75
      4: 60
      5: 50
      6: 40
      7: 30
      8: 20
      9: 14
      10: 8
      11: 3
    weapon_2h:
      1: 100
      2: 80
      3: 65
      4: 50
      5: 35
      6: 25
      7: 15
      8: 10
      9: 5
      10: 3
      11: 1
  # Шанс уничтожения предмета при неудаче без руны и кубика, %.
  destroy-chances:
    armor:
      1: 0
      2: 1
      3: 1
      4: 1
      5: 2
      6: 3
      7: 4
      8: 7
      9: 12
      10: 24
      11: 40
    weapon_1h:
      1: 0
      2: 1
      3: 1
      4: 2
      5: 2
      6: 4
      7: 5
      8: 8
      9: 13
      10: 28
      11: 45
    weapon_2h:
      1: 0
      2: 1
      3: 2
      4: 3
      5: 5
      6: 7
      7: 10
      8: 15
      9: 22
      10: 35
      11: 50
  # Множители шанса успеха (решение артефакта: 2 / 4 / 6 / 8).
  stone-multipliers:
    shard: 1     # Осколок философского камня
    crumb: 1     # Крошка (только C)
    cube: 1      # Ашкалотский кубик (не уничтожает)
    black: 2     # Чёрный
    white: 4     # Белый
    red: 6       # Красный
    purple: 8    # Пурпурный

# Расходники. Набор фиксирован (механика привязана к ключу), меняются только внешний вид и имена.
#   name     — название в сообщениях
#   material — материал предмета (https://jd.papermc.io/paper/1.21.11/org/bukkit/Material.html)
#   item-model    — (1.1.2) модель предмета namespace:path, например Nexo enhance_mmorpg:philosophers_shard; пусто — модель материала
#   tooltip-style — (1.1.2) рамка подсказки namespace:path, например royaltooltips:material; пусто — обычная
#   Модель/рамка обновляются и у уже выданных расходников (при входе игрока), метки не меняются.
#   display  — название предмета (MiniMessage)
#   lore     — описание (MiniMessage)
#   aliases  — русские имена для /sharpen give (регистр, «ё» и пробелы/«_» не важны)
# Предметы старого плагина (zatochka:consumable_id) тоже принимаются.
consumables:
  shard:
    name: "Осколок философского камня"
    material: AMETHYST_SHARD
    item-model: "enhance_mmorpg:philosophers_shard"
    tooltip-style: "royaltooltips:material"
    display: "<light_purple>Осколок философского камня</light_purple>"
    lore:
      - "<gray>Базовый камень заточки."
      - "<gray>Может уничтожить предмет."
    aliases: [осколок, осколок_философского_камня]
  crumb:
    name: "Крошка философского камня"
    material: AMETHYST_CLUSTER
    item-model: "enhance_mmorpg:philosophers_dust"
    tooltip-style: "royaltooltips:material"
    display: "<white>Крошка философского камня</white>"
    lore:
      - "<gray>Только для грейда C."
      - "<gray>Может уничтожить предмет."
    aliases: [крошка, крошка_философского_камня]
  cube:
    name: "Ашкалотский кубик"
    material: LODESTONE
    item-model: "enhance_mmorpg:ashkalot_cube"
    tooltip-style: "royaltooltips:material"
    display: "<aqua>Ашкалотский кубик</aqua>"
    lore:
      - "<gray>Не уничтожает предмет."
      - "<gray>Уровень может понизиться."
    aliases: [кубик, ашкалотский_кубик]
  black:
    name: "Чёрный философский камень"
    material: BLACK_DYE
    item-model: "enhance_mmorpg:black_philosophers_stone"
    tooltip-style: "royaltooltips:material"
    display: "<dark_gray>Чёрный философский камень</dark_gray>"
    lore:
      - "<gray>Повышенный шанс успеха."
    aliases: [чёрный, черный, чёрный_камень, черный_камень]
  white:
    name: "Белый философский камень"
    material: WHITE_DYE
    item-model: "enhance_mmorpg:white_philosophers_stone"
    tooltip-style: "royaltooltips:material"
    display: "<white>Белый философский камень</white>"
    lore:
      - "<gray>Высокий шанс успеха."
    aliases: [белый, белый_камень]
  red:
    name: "Красный философский камень"
    material: RED_DYE
    item-model: "enhance_mmorpg:red_philosophers_stone"
    tooltip-style: "royaltooltips:material"
    display: "<red>Красный философский камень</red>"
    lore:
      - "<gray>Очень высокий шанс успеха."
    aliases: [красный, красный_камень]
  purple:
    name: "Пурпурный философский камень"
    material: PURPLE_DYE
    item-model: "enhance_mmorpg:purple_philosophers_stone"
    tooltip-style: "royaltooltips:material"
    display: "<dark_purple>Пурпурный философский камень</dark_purple>"
    lore:
      - "<gray>Наивысший шанс успеха."
    aliases: [пурпурный, пурпурный_камень, фиолетовый]
  rune_save:
    name: "Руна Сохранения"
    material: PAPER
    item-model: "enhance_mmorpg:preservation_rune"
    tooltip-style: "royaltooltips:rune"
    display: "<green>Руна Сохранения</green>"
    lore:
      - "<gray>При неудаче уровень не меняется"
      - "<gray>и предмет не уничтожается."
    aliases: [руна_сохранения, сохранение]
  rune_cold:
    name: "Руна Холода"
    material: BLUE_ICE
    item-model: "enhance_mmorpg:cold_rune"
    tooltip-style: "royaltooltips:rune"
    display: "<aqua>Руна Холода</aqua>"
    lore:
      - "<gray>При неудаче уровень не меняется"
      - "<gray>и предмет не уничтожается."
    aliases: [руна_холода, холод]

# Открытие меню правым кликом по NPC. Citizens не нужен: подходит любая сущность (NPC Citizens, житель,
# стойка для брони) с таким именем — без учёта цветов и регистра.
npc:
  enabled: true
  names:
    - "Королевский алхимик"

menu:
  # Заголовок меню заточки.
  title: "<dark_purple><bold>Улучшение предмета</bold></dark_purple>"

# Звуки результатов: ключ звука Minecraft (https://minecraft.wiki/w/Sounds.json), громкость 0..10, высота 0.5..2.
# Можно короче: success: "block.anvil.use". Пустая строка или none — без звука.
sounds:
  success:
    sound: block.enchantment_table.use
    volume: 1.0
    pitch: 1.0
  fail:
    sound: entity.villager.no
    volume: 1.0
    pitch: 0.9
  destroy:
    sound: item.totem.use
    volume: 1.0
    pitch: 1.0
  legendary:        # успешная +11
    sound: ui.toast.challenge_complete
    volume: 1.0
    pitch: 1.0
  legendary-fail:   # жертва сгорела
    sound: block.anvil.destroy
    volume: 1.0
    pitch: 1.0

# ---------------------------------------------------------------------------------------------------------------------
# zatochka 1.1.3: предметы MMOItems / Nexo, которые не узнаются по материалу, и база бонуса оружия.
# Нет раздела — по умолчанию: грейд по материалу, магическое оружие — типы MMOItems ниже и 7 Nexo-id посохов/книг.
# ---------------------------------------------------------------------------------------------------------------------
items:
  grade:
    # Грейд MMOItems-предмета без явной записи: material — по материалу (как 1.1.2), или C / B / A.
    mmoitems-default: material
    # Брать грейд из тира MMOItems (MMOITEMS_TIER = C/B/A или GRADE_C…), если он задан.
    mmoitems-tier: true
    # Точный грейд по id MMOItems (MMOITEMS_ITEM_ID). Оружие Royal Knight (уровни 1–20) — грейд C, заточка до +10.
    mmoitems-ids:
      ROYAL_KNIGHT_BEGINNER_BOW: C
      ROYAL_KNIGHT_RAM_HORN_BOW: C
      ROYAL_KNIGHT_FOREST_HUNTER: C
      ROYAL_KNIGHT_STINGING_BOW: C
      ROYAL_KNIGHT_ELVEN_SONG: C
      ROYAL_KNIGHT_FORGE_FLAME: C
      AZERUS_NIGHT_WATCH: C
      ROYAL_KNIGHT_SILVER_STILETTO: C
      ROYAL_KNIGHT_SAPPHIRE_TANTO: C
      AZERUS_FROST_NEEDLE: C
      ROYAL_KNIGHT_ASHEN_HUNTER: C
      AZERUS_CRIMSON_SCYTHE: C
      ROYAL_KNIGHT_FOREST_KEEPER: C
      ROYAL_KNIGHT_ICE_ORACLE: C
      ROYAL_KNIGHT_VOLCANO_HEART: C
      AZERUS_MOON_STAFF: C
      AZERUS_IRON_VOW: C
      ROYAL_KNIGHT_LEGIONNAIRE_FANG: C
      ROYAL_KNIGHT_RAVEN_BEAK: C
      AZERUS_SUNLEAF: C
      AZERUS_TIDEKEEPER: C
      AZERUS_MOONWARDEN: C
      AZERUS_ASHEN_OATH: C
      AZERUS_EMBER_DAWN: C
      AZERUS_BLOOD_RAVEN: C
      AZERUS_THUNDERMAUL: C
      ROYAL_KNIGHT_HERBALIST: C
      ROYAL_KNIGHT_STAR_ATLAS: C
      ROYAL_KNIGHT_ASH_GRIMOIRE: C
    # По типу MMOItems (SWORD, STAFF…): {}
    mmoitems-types: {}
    # По Nexo-id (старые экземпляры без MMOItems). Алмазные/незеритовые Nexo-версии оружия Royal Knight — грейд C (+10).
    nexo-ids:
      azerus_moonwarden: C
      azerus_tidekeeper: C
      azerus_ashen_oath: C
      azerus_ember_dawn: C
      azerus_blood_raven: C
      azerus_sunleaf: C
      azerus_thundermaul: C
      azerus_crimson_scythe: C
      azerus_moon_staff: C
  magic:
    # Магическое оружие: точится как одноручное, бонус заточки идёт в маг. силу (MAGIC-пакеты MythicLib), а не в физ. урон.
    mmoitems-types: [STAFF, WAND, GREATSTAFF, CATALYST, SPELLBOOK, TOME, SCYTHE]
    nexo-ids: [azerus_moon_staff, royal_knight_ice_oracle, royal_knight_forest_keeper, royal_knight_volcano_heart, royal_knight_star_atlas, royal_knight_ash_grimoire, royal_knight_herbalist]
    # Стат MMOItems с плоской маг. силой (custom-stats.yml: CUSTOM_MAGIC_POWER). Итог игрока (оружие + кольца) идёт в
    # MAGIC-пакеты; заточка +X% прибавляет X% только от силы оружия в руке.
    power-stat: CUSTOM_MAGIC_POWER
  # Доп. типы MMOItems, которые считать оружием, даже если материал не оружейный.
  weapon-mmoitems-types: []
