  pay-min: "<red>Наименьший перевод — <white><min></white>.</red>"
  pay-offline: "<red>Игрок <white><player></white> не в сети: переводить можно только тем, кто в сети.</red>"
  pay-no-money: "<red>Недостаточно средств: на счету <white><balance></white>.</red>"
  pay-target-full: "<red>У <white><player></white> не поместится столько: потолок счёта.</red>"
  pay-confirm: "<yellow>Перевести <white><amount></white> игроку <white><player></white>? <click:run_command:'/mpay confirm'><green>[Подтвердить]</green></click> или /mpay confirm (<seconds> с).</yellow>"
  pay-no-pending: "<gray>Нет перевода для подтверждения.</gray>"
  pay-sent: "<green>Переведено <white><amount></white> игроку <white><player></white>. Баланс: <white><balance></white>.</green>"
  pay-received: "<green>Вы получили <white><amount></white> от <white><player></white>.</green>"
  top-header: "<gold>Самые богатые</gold> <gray>(стр. <page>/<pages>)</gray>"
  top-line: "<gray><rank>.</gray> <white><player></white> <dark_gray>—</dark_gray> <gold><balance></gold>"
  top-empty: "<gray>Пока пусто.</gray>"
  top-stale: "<dark_gray>Обновлено <seconds> с назад.</dark_gray>"
  eco-usage: "<gray>/ceco give|take|set|reset <игрок> <сумма> · drop <кол-во> [x y z [мир]] · coin <игрок> <кол-во> · import vault [replace] · info · reload</gray>"
