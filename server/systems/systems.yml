# Включённые системы ядра Amazake. Файл переписывается командами
# /amazake system enable|disable <имя>; система, которой нет в списке, выключена.
# При запуске сервер включает все системы из списка.
enabled:
  - AmazakeCore
  - AmazakeTab
  - core-mechanics
  - core-mobs
  - core-npc
  - core-portals
  - core-progression
  - core-python
  - core-skyrift
  - core-vault
  - core-world
  - rezusmenu
  - seal-magic
  - zatochka
