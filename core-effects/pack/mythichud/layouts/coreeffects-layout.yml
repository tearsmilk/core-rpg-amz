# core-effects: где рисовать иконки. Положить в plugins/MythicHUD/layouts/coreeffects-layout.yml и добавить
# coreeffects-layout в layout.default (plugins/MythicHUD/config.yml), затем /mythichud reload.
# Иконки — в правом верхнем углу, справа налево; неактивные скрыты условием в ассете.
coreeffects-layout:
  elements:
    bleeding:
      asset: 'coreeffects-bleeding'
      position:
        x: 100.0
        y: 100.0
      offset:
        x: -14
        y: -14
    panic:
      asset: 'coreeffects-panic'
      position:
        x: 100.0
        y: 100.0
      offset:
        x: -40
        y: -14
    warmth:
      asset: 'coreeffects-warmth'
      position:
        x: 100.0
        y: 100.0
      offset:
        x: -66
        y: -14
    curse:
      asset: 'coreeffects-curse'
      position:
        x: 100.0
        y: 100.0
      offset:
        x: -92
        y: -14
