# Прогрессия CoreRpg: уровни, опыт, очки и формулы параметров, сообщения.
# После правки: /class admin reload (или /amazake system reload core-rpg).
# Тексты — MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Неверное значение не ломает систему: в консоли будет предупреждение, а возьмётся значение по умолчанию.

# Максимальный уровень персонажа (2..1000).
max-level: 71

# С какого уровня выбирается профессия (не больше max-level).
profession-level: 21

# Пока профессия не выбрана, опыт выше уровня профессии не начисляется (как в плагине RoyalQuestClasses).
block-exp-until-profession: true

# Без выбранного класса опыт не начисляется.
require-class-for-exp: true

# Как часто напоминать о блокировке опыта (секунды, 0..3600).
exp-blocked-message-cooldown-seconds: 15

# Открывать меню выбора класса при входе, пока класс не выбран.
open-class-menu-on-first-join: true

# Открывать меню профессии при входе, если она уже доступна, но не выбрана.
open-profession-menu-on-join: true

# Ванильные сферы опыта превращаются в опыт персонажа, ванильная полоска опыта не растёт.
convert-vanilla-exp: true
# Множитель: сколько опыта персонажа даёт единица ванильного опыта (0..100000).
vanilla-exp-multiplier: 1.0

# Показывать в actionbar «+N опыта» при каждом начислении.
show-exp-gain: false

# Очки параметров: каждые points-every-levels уровней (5, 10, 15…) игрок получает points-per-step очков.
# По умолчанию к 71 уровню — 56 очков.
points-every-levels: 5
points-per-step: 4

# Повышение уровня: звук (ключ Minecraft, пусто — без звука), громкость, высота (0.5..2), заголовок на экране.
level-up:
  sound: "entity.player.levelup"
  volume: 1.0
  pitch: 1.0
  title: true

# Сколько опыта нужно ДЛЯ уровня N (переход N−1 → N). Таблица Royal Quest ÷ 200, продолжена до 71.
# Повышение может пройти сразу через несколько уровней за одно начисление.
